<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI 语音 - 智慧空间</title>
<script src="assets/vendor/tailwindcss.js"></script>
<script src="assets/vendor/iconify-icon.min.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<script>window.parent.postMessage({ type: 'setBottomNav', visible: true }, '*')</script>
<style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        ::-webkit-scrollbar { display: none; }
        button { font: inherit; border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; }
        .app-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            background: #fff;
            padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        }
        .ai-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 0;
        }
        /* 中央 AI 浮雕字 */
        .ai-letters {
            position: absolute;
            left: 50%;
            top: 32%;
            transform: translateX(-50%);
            width: 160px;
            height: 160px;
            object-fit: contain;
            z-index: 1;
        }
        /* 右上吉祥物 */
        .ai-mascot {
            position: absolute;
            right: 32px;
            top: 17px;
            width: 65px;
            height: 63px;
            object-fit: contain;
            z-index: 2;
            cursor: pointer;
        }
        /* 底部输入区 */
        .ai-input-bar {
            position: absolute;
            left: 13px;
            right: 13px;
            bottom: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 3;
        }
        .ai-avatar {
            width: 42px;
            height: 42px;
            flex: none;
            object-fit: contain;
            display: block;
        }
        .ai-hold {
            flex: 1;
            min-width: 0;
            height: 36px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(171, 225, 232, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #555;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            cursor: pointer;
        }
        .ai-hold.holding {
            background: #f2fcfd;
            color: var(--brand-deep);
            font-weight: 600;
        }
        .ai-text-input {
            flex: 1;
            min-width: 0;
            height: 36px;
            display: none;
            padding: 0 12px;
            background: #fff;
            border: 0;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(171, 225, 232, 1);
            font-size: 14px;
            color: var(--ink-900);
            outline: none;
        }
        .ai-text-input::placeholder { color: #555; }
        .ai-icon-btn {
            width: 20px;
            height: 20px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ai-icon-btn svg { display: block; }
        /* 四宫格（⊕ 展开） */
        .plus-grid {
            position: absolute;
            left: 13px;
            right: 13px;
            bottom: 70px;
            display: none;
            gap: 10px;
            z-index: 3;
        }
        .plus-grid.open { display: flex; }
        .plus-grid button {
            flex: 1;
            height: 76px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(23, 49, 58, .08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .plus-grid .grid-label { font-size: 11px; color: var(--ink-700); }
        #toast {
            position: fixed;
            left: 50%;
            bottom: 160px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .78);
            color: #fff;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 6px;
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 背景纹理 -->
    <img class="ai-bg" src="assets/src_01/radar/AI背景纹理.png" alt=""/>

    <!-- 中央 AI 浮雕字 -->
    <img class="ai-letters" src="assets/v2/mascot/ai-letters.png" alt="AI"/>

    <!-- 右上吉祥物（雷达页弹出时点击收起，独立打开时返回雷达页） -->
    <img class="ai-mascot" src="assets/v2/mascot/cream-spoon.png" alt="吉祥物" role="button" tabindex="0" aria-label="返回雷达" onclick="handleMascotClick()" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); handleMascotClick(); }"/>

    <!-- 四宫格（⊕ 展开） -->
    <div class="plus-grid" id="plusGrid">
        <button onclick="showToast('相机')">
            <iconify-icon style="color: var(--ink-900); font-size: 22px" icon="solar:camera-bold"></iconify-icon>
            <span class="grid-label">相机</span>
        </button>
        <button onclick="showToast('相册')">
            <iconify-icon style="color: var(--ink-900); font-size: 22px" icon="solar:gallery-bold"></iconify-icon>
            <span class="grid-label">相册</span>
        </button>
        <button onclick="showToast('文件')">
            <iconify-icon style="color: var(--ink-900); font-size: 22px" icon="solar:paperclip-bold"></iconify-icon>
            <span class="grid-label">文件</span>
        </button>
        <button onclick="showToast('打电话')">
            <iconify-icon style="color: var(--ink-900); font-size: 22px" icon="solar:phone-bold"></iconify-icon>
            <span class="grid-label">打电话</span>
        </button>
    </div>

    <!-- 底部输入区 -->
    <div class="ai-input-bar">
        <img class="ai-avatar" src="assets/v2/mascot/lucky-bag.png" alt="语音助手" onclick="showToast('语音助手')"/>
        <div
            class="ai-hold"
            id="holdBox"
            onmousedown="startHold()"
            onmouseup="endHold()"
            onmouseleave="endHold()"
            ontouchstart="startHold(event)"
            ontouchend="endHold()"
            ontouchcancel="endHold()"
        >
            <span id="holdText">按住说话</span>
        </div>
        <input class="ai-text-input" id="textInput" type="text" placeholder="按住说话" autocomplete="off" enterkeyhint="send" aria-label="输入消息"/>
        <button class="ai-icon-btn" id="modeBtn" aria-label="切换键盘输入" onclick="toggleInputMode()">
            <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill="#131415" fill-rule="nonzero" d="M 10 0 C 15.523 0 20 4.477 20 10 C 20 15.523 15.523 20 10 20 C 4.477 20 0 15.523 0 10 C 0 4.477 4.477 0 10 0 Z M 10 1.667 C 5.397 1.667 1.667 5.397 1.667 10 C 1.667 14.603 5.397 18.333 10 18.333 C 14.603 18.333 18.333 14.603 18.333 10 C 18.333 5.397 14.603 1.667 10 1.667 Z M 6.667 7.083 C 7.127 7.083 7.5 7.456 7.5 7.917 C 7.5 8.377 7.127 8.75 6.667 8.75 C 6.206 8.75 5.833 8.377 5.833 7.917 C 5.833 7.456 6.206 7.083 6.667 7.083 Z M 10 7.083 C 10.46 7.083 10.833 7.456 10.833 7.917 C 10.833 8.377 10.46 8.75 10 8.75 C 9.54 8.75 9.167 8.377 9.167 7.917 C 9.167 7.456 9.54 7.083 10 7.083 Z M 13.333 7.083 C 13.794 7.083 14.167 7.456 14.167 7.917 C 14.167 8.377 13.794 8.75 13.333 8.75 C 12.873 8.75 12.5 8.377 12.5 7.917 C 12.5 7.456 12.873 7.083 13.333 7.083 Z M 6.058 12.083 L 13.942 12.083 C 13.542 14.148 11.944 15.625 10 15.625 C 8.056 15.625 6.458 14.148 6.058 12.083 Z"/>
            </svg>
        </button>
        <button class="ai-icon-btn" aria-label="更多" onclick="togglePlus()">
            <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="10" r="8.9" fill="none" stroke="#6b7280" stroke-width="1.5"/>
                <path d="M3.5 10 H16.5" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10 3.5 V16.5" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
        </button>
    </div>
</div>
<div id="toast"></div>

<script>
    let holding = false
    let inputMode = false
    const smileySvg = document.getElementById('modeBtn').innerHTML
    const VOICE_SVG = `
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(-1163 -642)">
                <path fill="#333333" fill-rule="nonzero" d="M 19.9431818181818 10 C 19.9370660103318 15.4889324365654 15.4889324365654 19.9370660103318 10 19.9431818181818 C 4.50853231702336 19.9431818181818 0.0568181818181812 15.4914676829766 0.0568181818181812 10 C 0.0568181818181812 4.50853231702336 4.50853231702336 0.0568181818181812 10 0.0568181818181812 C 15.4914676829766 0.0568181818181812 19.9431818181818 4.50853231702336 19.9431818181818 10 Z M 18.5227272727273 10 C 18.5166136358494 5.29556237863909 14.7044376213609 1.48338636415057 10 1.47727272727273 C 5.29302770030573 1.47727272727273 1.47727272727272 5.29302770030574 1.47727272727272 10 C 1.47727272727272 14.7069722996943 5.29302770030573 18.5227272727273 10 18.5227272727273 C 14.7069722996943 18.5227272727273 18.5227272727273 14.7069722996943 18.5227272727273 10 Z"/>
                <path fill="#333333" fill-rule="nonzero" d="M 1.33318014705882 12.7051123903509 C 1.1951255509891 12.8396035292453 1.00731192219084 12.9149888048588 0.811580882352943 12.9144736842105 C 0.616492919106249 12.9151414354118 0.429334517794498 12.8396867577832 0.292279411764704 12.7051123903509 C 0.154206351575485 12.5717916663568 0.0765930465316023 12.3906616338744 0.0765930465316023 12.2017543859649 C 0.0765930465316023 12.0128471380554 0.154206351575485 11.831717105573 0.292279411764704 11.6983963815789 C 1.71508529282754 10.3199203754223 2.51446547039674 8.44991718354742 2.51446547039674 6.5 C 2.51446547039674 4.55008281645259 1.71508529282754 2.68007962457773 0.292279411764704 1.30160361842105 C 0.150079295595985 1.1674333034341 0.0698665427804933 0.983246421749435 0.0698665427804933 0.790892648571008 C 0.0698665427804933 0.397268649239851 0.399068932610793 0.0781733503253942 0.805160660427552 0.0781733503253942 C 1.00417099566999 0.0781733503253942 1.19468224287584 0.156364600603792 1.33318014705882 0.294887609649122 C 4.86871496400181 3.7218770710986 4.86871496400181 9.2781229289014 1.33318014705882 12.7051123903509 Z"/>

                <path fill="#333333" fill-rule="nonzero" d="M 0.00177556818181754 1.00000002947424 C 0.00177556818181754 1.5462049400846 0.44456213484419 1.98899150674697 0.990767045454545 1.98899150674697 C 1.5369719560649 1.98899150674697 1.97975852272727 1.5462049400846 1.97975852272727 1.00000002947424 C 1.97975852272727 0.453795059915402 1.5369719560649 0.0110084932530299 0.990767045454545 0.0110084932530299 C 0.44456213484419 0.0110084932530299 0.00177556818181754 0.453795059915402 0.00177556818181754 0.999999970525757 Z"/>
            </g>
        </svg>`

    function toggleInputMode() {
        setInputMode(!inputMode)
    }

    function setInputMode(on) {
        inputMode = on
        const holdBox = document.getElementById('holdBox')
        const input = document.getElementById('textInput')
        const modeBtn = document.getElementById('modeBtn')
        holdBox.style.display = on ? 'none' : 'flex'
        input.style.display = on ? 'block' : 'none'
        modeBtn.innerHTML = on ? VOICE_SVG : smileySvg
        modeBtn.setAttribute('aria-label', on ? '切换语音输入' : '切换键盘输入')
        if (on) {
            document.getElementById('plusGrid').classList.remove('open')
            input.focus()
        } else {
            input.blur()
        }
    }

    function togglePlus() {
        document.getElementById('plusGrid').classList.toggle('open')
    }

    function startHold(event) {
        if (event && event.cancelable) event.preventDefault()
        holding = true
        document.getElementById('holdBox').classList.add('holding')
        document.getElementById('holdText').textContent = '松开 发送'
    }

    function endHold() {
        if (!holding) return
        holding = false
        document.getElementById('holdBox').classList.remove('holding')
        document.getElementById('holdText').textContent = '按住说话'
        showToast('语音已发送')
    }

    function showToast(message) {
        const toast = document.getElementById('toast')
        toast.textContent = message
        toast.style.display = 'block'
        clearTimeout(toast._timer)
        toast._timer = setTimeout(() => (toast.style.display = 'none'), 1800)
    }

    document.getElementById('textInput').addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && this.value.trim()) {
            this.value = ''
            showToast('已发送')
        }
    })

    window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'blurAiInput') document.getElementById('textInput').blur()
    })

    function handleMascotClick() {
        if (window.self !== window.top) {
            window.parent.postMessage({ type: 'closeAiVoice' }, '*')
        } else {
            window.location.href = 'radar.html'
        }
    }
</script>
<script src="assets/vendor/back.js"></script>
</body>
</html>
