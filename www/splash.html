<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>智慧空间</title>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #3fb87e;
        }
        .app-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        }
        .splash-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
        }
        .skip-btn {
            position: absolute;
            top: calc(var(--safe-area-inset-top, 0px) + 16px);
            right: 16px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .96);
            color: #6b7280;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 1px 4px rgba(20, 86, 58, .12);
        }
        .lang-pill {
            position: absolute;
            left: 8px;
            bottom: calc(var(--safe-area-inset-bottom, 0px) + 6px);
            z-index: 20;
            padding: 4px 12px;
            border-radius: 6px;
            background: #ffffff;
            color: #111827;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="app-container">
<img alt="智慧空间" class="splash-bg" src="assets/new_src/splash-bg.png"/>
<a class="skip-btn" href="login.html">跳过</a>
<div class="lang-pill">中文</div>
</div>
<script>
    setTimeout(() => {
        window.location.replace('login.html');
    }, 2500);
</script>
</body></html>
