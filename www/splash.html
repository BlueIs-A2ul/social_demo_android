<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>智能空间</title>
<script src="assets/vendor/tailwindcss.js"></script>
<style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
        }
        .app-container {
            width: 100%;
            height: 100dvh;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;

        }
        .splash-logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.15);

        .splash-title {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 700;
            color: #ec4899;
            letter-spacing: 6px;
        }
        .splash-subtitle {
            margin-top: 8px;

            color: #9ca3af;
            letter-spacing: 2px;
        }
