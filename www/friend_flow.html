<script>
    function toggleIdentityCard(id, btn) {
        const content = document.getElementById('identity-' + id);
        const isHidden = content.classList.contains('hidden');
        
        // Hide all others
        document.querySelectorAll('.identity-content').forEach(el => {
            if (el.id !== 'identity-' + id) {
                el.classList.add('hidden');
            }
        });
        document.querySelectorAll('.identity-btn').forEach(b => {
            if (b !== btn) {
                b.classList.remove('active');
                b.innerText = '虚拟身份证';
            }
        });

        if (isHidden) {
            content.classList.remove('hidden');
            btn.classList.add('active');
            btn.innerText = '收起身份证';
        } else {
            content.classList.add('hidden');
            btn.classList.remove('active');
            btn.innerText = '虚拟身份证';
        }
    }
</script>
