<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>商城 - 智慧空间</title>
    <script src="assets/vendor/nav.js"></script>
    <link href="assets/vendor/theme.css" rel="stylesheet"/>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      ::-webkit-scrollbar { display: none; }
      button { font: inherit; border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; }
      a { color: inherit; text-decoration: none; }
      .app-container {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #fff;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      }
      /* ===== 顶部栏 ===== */
      .shop-header {
        flex: none;
        height: 56px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 13px 0 14px;
        gap: 8px;
      }
      .back-btn {
        width: 28px;
        height: 28px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .back-btn svg { display: block; }
      .search-field {
        flex: 1;
        min-width: 0;
        height: 32px;
        display: flex;
        align-items: center;
        padding: 0 8px 0 14px;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 0 5px rgba(215, 215, 215, 1);
      }
      .search-field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 13px;
        color: #333;
      }
      .search-field input::placeholder { color: #d0d0d0; }
      .search-field img { flex: none; display: block; width: 18px; height: 18px; }
      .orders-btn {
        flex: none;
        width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        margin-left: 4px;
      }
      .orders-btn svg { display: block; }
      .orders-btn .orders-label {
        font-size: 12px;
        color: #6a6a6a;
        line-height: 17px;
        white-space: nowrap;
      }
      .cart-btn {
        flex: none;
        width: 33px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: 6px;
      }
      .cart-btn img { width: 33px; height: 32px; object-fit: contain; display: block; }
      /* ===== 分类宫格 ===== */
      .shop-tiles {
        flex: none;
        background: #fff;
        padding: 4px 23px 10px;
      }
      .more-link {
        text-align: right;
        font-size: 12px;
        color: #6b7280;
        line-height: 20px;
        cursor: pointer;
      }
      .tiles-row {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .tile img { width: 50px; height: 50px; object-fit: contain; display: block; }
      .tile .tile-label {
        font-size: 13px;
        color: #6b7280;
        line-height: 20px;
      }
      /* ===== 商品列表 ===== */
      .shop-products {
        flex: 1;
        overflow-y: auto;
        background: #f5f5f5;
        padding: 9px;
      }
      .products-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }
      .product-card {
        background: #fff;
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
      }
      .product-card:active { opacity: 0.85; }
      .product-image {
        width: 100%;
        aspect-ratio: 178 / 187;
        overflow: hidden;
        background: #f5f5f5;
      }
      .product-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .product-title {
        margin: 7px 5px 0;
        font-size: 14px;
        line-height: 20px;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .product-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 10px 12px 5px;
      }
      .product-price { color: #ff552e; font-size: 10px; }
      .product-price .price-num { font-size: 14px; font-weight: 600; }
      .product-sold { font-size: 12px; color: #aaaaaa; }
      .empty-state {
        grid-column: 1 / -1;
        padding: 40px 0;
        text-align: center;
        color: #aaaaaa;
        font-size: 13px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 110px;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, .78);
        color: #fff;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 6px;
        z-index: 999;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header class="shop-header">
        <button class="back-btn" aria-label="返回" onclick="goBack('profile_settings.html', {profile_settings: 'profile_settings.html', profile: 'profile.html'})">
          <svg width="18" height="18" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <path d="M185.3952 511.232l398.2336 398.2336-72.3968 72.448L40.6016 511.232 511.232 40.6016 583.68 112.9984z" fill="#333333"/>
          </svg>
        </button>
        <label class="search-field" aria-label="搜索商品">
          <input type="search" id="searchInput" placeholder="输入商品名称" />
          <img src="assets/v2/processed/放大镜-金色.png" alt="" />
        </label>
        <a class="orders-btn" href="history_favorites.html">
          <svg width="18" height="21" viewBox="0 0 18 21" xmlns="http://www.w3.org/2000/svg">
            <path fill="#9f9f9f" fill-rule="nonzero" d="M 14.2900402121375 0.266612682130858 L 3.24167612343547 0.266612682130858 C 1.6090147076457 0.266612682130858 0.28429593909818 1.58880371942476 0.28429593909818 3.21744158084252 L 0.28429593909818 17.3687584454194 C 0.28429593909818 18.9973963068371 1.6090147076457 20.3195873441311 3.24167612343547 20.3195873441311 L 14.2900402121375 20.3195873441311 C 15.9227016279272 20.3195873441311 17.2474203964747 18.9973963068371 17.2474203964747 17.3687584454194 L 17.2474203964747 3.21744158084252 C 17.2474203964747 1.58880371942476 15.9227016279272 0.266612682130858 14.2900402121375 0.266612682130858 Z M 13.103925935917 13.1320299170592 L 4.41600629387189 13.1320299170592 C 4.00267914992276 13.1320299170592 3.66843160628368 12.7977823734201 3.66843160628368 12.384455229471 C 3.66843160628368 11.9711280855219 4.00267914992276 11.6368805418828 4.41600629387189 11.6368805418828 L 13.103925935917 11.6368805418828 C 13.5172530798661 11.6368805418828 13.8515006235052 11.9711280855219 13.8515006235052 12.384455229471 C 13.8515006235052 12.7977823734201 13.5172530798661 13.1320299170592 13.103925935917 13.1320299170592 Z M 13.103925935917 9.26562087989625 L 4.41600629387189 9.26562087989625 C 4.00267914992276 9.26562087989625 3.66843160628368 8.93137333625717 3.66843160628368 8.51804619230804 C 3.66843160628368 8.1047190483589 4.00267914992276 7.77047150471983 4.41600629387189 7.77047150471983 L 13.103925935917 7.77047150471983 C 13.5172530798661 7.77047150471983 13.8515006235052 8.1047190483589 13.8515006235052 8.51804619230804 C 13.8515006235052 8.93137333625717 13.5172530798661 9.26562087989625 13.103925935917 9.26562087989625 Z M 13.103925935917 5.39921181873331 L 4.41600629387189 5.39921181873331 C 4.00267914992276 5.39921181873331 3.66843160628368 5.06496427509423 3.66843160628368 4.6516371311451 C 3.66843160628368 4.23830998719597 4.00267914992276 3.90406244355689 4.41600629387189 3.90406244355689 L 13.103925935917 3.90406244355689 C 13.5172530798661 3.90406244355689 13.8515006235052 4.23830998719597 13.8515006235052 4.6516371311451 C 13.8515006235052 5.06496427509423 13.5172530798661 5.39921181873331 13.103925935917 5.39921181873331 Z"/>
          </svg>
          <span class="orders-label">我的订单</span>
        </a>
        <button class="cart-btn" aria-label="购物车" onclick="showToast('购物车')">
          <img src="assets/v2/processed/金色购物车.png" alt="购物车"/>
        </button>
      </header>

      <!-- 分类宫格 -->
      <section class="shop-tiles">
        <div class="more-link" onclick="showToast('更多分类')">更多&gt;&gt;</div>
        <div class="tiles-row" id="tilesRow"></div>
      </section>

      <!-- 商品列表 -->
      <main class="shop-products">
        <div class="products-grid" id="productsGrid"></div>
      </main>
    </div>
    <div id="toast"></div>

    <script>
      const tiles = [
        { name: '装修类', icon: 'assets/v2/processed/商城-装修类.png' },
        { name: '家具类', icon: 'assets/v2/processed/商城-家具类.png' },
        { name: '文具类', icon: 'assets/v2/processed/商城-文具类.png' },
        { name: '装饰类', icon: 'assets/v2/processed/商城-装饰类.png' },
        { name: '饰品类', icon: 'assets/v2/processed/商城-饰品类.png' }
      ];

      const products = [
        {
          title: '全自动折叠雨伞防晒加厚',
          image: 'assets/v2/processed/商城商品-雨伞.png',
          price: '12.80',
          sold: '已售2230'
        },
        {
          title: '前100名减10元-8件套',
          image: 'assets/v2/processed/商城商品-修甲套装.png',
          price: '16.80',
          sold: '已售10000+'
        }
      ];

      let searchKeyword = '';

      const tilesRow = document.getElementById('tilesRow');
      const productsGrid = document.getElementById('productsGrid');
      const searchInput = document.getElementById('searchInput');

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => (toast.style.display = 'none'), 1600);
      }

      function renderTiles() {
        tilesRow.innerHTML = tiles
          .map(
            tile => `<button class="tile" onclick="showToast('${tile.name}')">
              <img src="${tile.icon}" alt="${tile.name}"/>
              <span class="tile-label">${tile.name}</span>
            </button>`
          )
          .join('');
      }

      function renderProducts() {
        const list = searchKeyword
          ? products.filter(p => p.title.toLowerCase().includes(searchKeyword.toLowerCase()))
          : products;

        if (!list.length) {
          productsGrid.innerHTML = '<div class="empty-state">暂无相关商品</div>';
          return;
        }

        productsGrid.innerHTML = list
          .map(
            product => `<article class="product-card" onclick="showToast('${product.title}')">
              <div class="product-image">
                <img src="${product.image}" alt="${product.title}" loading="lazy"/>
              </div>
              <h3 class="product-title">${product.title}</h3>
              <div class="product-foot">
                <span class="product-price">￥<span class="price-num">${product.price}</span></span>
                <span class="product-sold">${product.sold}</span>
              </div>
            </article>`
          )
          .join('');
      }

      searchInput.addEventListener('input', event => {
        searchKeyword = event.target.value.trim();
        renderProducts();
      });

      renderTiles();
      renderProducts();
    </script>
  
<script src="assets/vendor/back.js"></script>
</body>
</html>
