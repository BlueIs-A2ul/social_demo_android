<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>商品空间</title>
    <script src="assets/vendor/nav.js"></script>
    <script src="assets/vendor/iconify-icon.min.js"></script>
    <link href="assets/vendor/theme.css" rel="stylesheet"/>
    <style>
      * {
        box-sizing: border-box;
        border-radius: 0 !important;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e5e7eb;
        color: #111827;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei',
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .phone {
        width: 100%;
        height: 100dvh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      }

      .app-header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 9px 12px;
        background: #ffffff;
        border-bottom: 1px solid #f3f4f6;
        z-index: 5;
      }

      .icon-button {
        width: 34px;
        height: 34px;
        flex: none;
        border: 0;
        background: transparent;
        color: #111827;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .page-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }

      .search-field {
        height: 36px;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        background: #ffffff;
        border: 1px solid #d1d5db;
      }

      .search-field input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: #111827;
        font-size: 14px;
      }

      .search-field input::placeholder {
        color: #9ca3af;
      }

      .main-container {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .category-sidebar {
        width: 100px;
        flex: none;
        overflow-y: auto;
        background: #f3f4f6;
        border-right: 1px solid #e5e7eb;
      }

      .category-sidebar::-webkit-scrollbar {
        display: none;
      }

      .category-tab {
        width: 100%;
        min-height: 54px;
        border: 0;
        border-bottom: 1px solid #e5e7eb;
        border-left: 3px solid transparent;
        background: transparent;
        color: #4b5563;
        padding: 8px 8px;
        text-align: center;
        font-size: 13px;
        line-height: 1.25;
        cursor: pointer;
      }

      .category-tab.active {
        border-left-color: #26c6da;
        background: #ffffff;
        color: #111827;
        font-weight: 600;
      }

      .products-area {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        background: #f3f4f6;
      }

      .products-area::-webkit-scrollbar {
        display: none;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .product-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        overflow: hidden;
        cursor: pointer;
      }

      .product-card:active {
        opacity: 0.8;
      }

      .product-image {
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        background: #f9fafb;
      }

      .product-image img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .product-title {
        height: 32px;
        padding: 4px 6px;
        margin: 0;
        font-size: 12px;
        line-height: 1.3;
        color: #111827;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 40px 0;
        text-align: center;
        color: #9ca3af;
        font-size: 13px;
      }

      /* ====== 商城：顶栏链接 ====== */
      .header-link {
        flex: none;
        font-size: 13px;
        color: var(--ink-700);
        text-decoration: none;
        white-space: nowrap;
      }

      /* ====== 分类宫格 ====== */
      .category-tiles {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        background: #fff;
        flex: none;
        border-bottom: 1px solid #f3f4f6;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        flex: 1;
        cursor: pointer;
        border: 0;
        background: transparent;
      }
      .tile .tile-icon {
        width: 46px;
        height: 46px;
        border-radius: 9999px !important;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile .tile-label {
        font-size: 11px;
        color: var(--ink-700);
      }

      /* ====== 二级分类 ====== */
      .sub-tabs {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 14px;
        background: #fff;
        border-bottom: 1px solid #f3f4f6;
        overflow-x: auto;
        flex: none;
      }
      .sub-tabs:empty {
        display: none;
      }
      .sub-tab {
        position: relative;
        font-size: 13px;
        color: var(--ink-500);
        white-space: nowrap;
        border: 0;
        background: transparent;
        padding: 4px 0;
        cursor: pointer;
      }
      .sub-tab.active {
        color: var(--brand-deep);
        font-weight: 700;
        border-bottom: 2px solid var(--brand-strong);
      }
      .sub-tab .tab-badge {
        position: absolute;
        top: -6px;
        right: -14px;
        min-width: 15px;
        height: 15px;
        padding: 0 3px;
        background: var(--gold);
        color: #6b4a00;
        font-size: 10px;
        font-weight: 700;
        border-radius: 4px !important;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ====== 商品价格与销量 ====== */
      .product-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px 10px;
      }
      .product-price {
        color: #ff4d4f;
        font-size: 15px;
        font-weight: 700;
      }
      .product-sold {
        font-size: 11px;
        color: var(--ink-500);
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="app-header">
        <button class="icon-button" aria-label="返回" onclick="goBack('hot_products_virtual.html', {room_list: 'room_list.html', merchant_shop: 'merchant_shop.html'})">
          <svg
            width="25"
            height="25"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
          </svg>
        </button>
        <label class="search-field" aria-label="搜索商品">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#6b7280"
            stroke-width="2.3"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.8-3.8"></path>
          </svg>
          <input type="search" id="searchInput" placeholder="输入商品名称" />
        </label>
        <a class="header-link" href="history_favorites.html">我的订单</a>
        <button class="icon-button" aria-label="购物车" onclick="showToast('购物车')">
          <img src="assets/v2/icon/cart.png" alt="购物车" style="width: 26px; height: 26px; object-fit: contain" />
        </button>
      </header>
      <!-- 分类宫格 -->
      <div class="category-tiles" id="categoryTiles"></div>
      <!-- 二级分类 -->
      <div class="sub-tabs" id="subTabs"></div>

      <main class="main-container">
        <nav class="category-sidebar" id="categorySidebar" aria-label="商品分类"></nav>
        <section class="products-area">
          <div class="products-grid" id="productsGrid"></div>
        </section>
      </main>
    </div>

    <script>
      const categoryGroups = [
        {
          category: '装修类',
          children: ['住宅公寓', '复式 Loft', '庭院别墅', '商务写字楼', '店铺空间', '展厅空间', '直播间', '主题房间']
        },
        {
          category: '家具类',
          children: ['沙发组合', '床与床头柜', '书桌椅', '收纳柜架', '吧台套件', '茶几边桌', '餐桌椅', '展示货架']
        },
        {
          category: '文具',
          children: ['书桌套件', '文件架', '笔记本', '展示牌', '办公小物', '便签贴纸', '画板支架', '资料盒']
        },
        {
          category: '装饰类',
          children: ['墙画海报', '地毯', '窗帘', '绿植', '桌面摆件', '墙面挂件', '屏风隔断', '背景装饰']
        },
        {
          category: '饰品类',
          children: ['挂饰', '收藏摆件', '空间徽章', '节日饰品', '角色周边', '钥匙扣', '纪念牌', '氛围小物']
        },
        {
          category: '灯具类',
          children: ['吊灯', '台灯', '壁灯', '落地灯', '氛围灯带', '招牌灯箱', '舞台射灯', '智能灯组']
        },
        {
          category: '文案类',
          children: ['店铺介绍', '房间说明', '活动文案', '个性签名', '空间公告', '商品标题', '欢迎语', '互动引导']
        }
      ];

      const products = [
        { id: 1, title: '云上会客厅全景房型模板', image: 'assets/products/space-living-room.jpg', category: '装修类', price: 12.8, sold: 2230 },
        { id: 2, title: '咖啡角氛围装饰组合', image: 'assets/products/space-cafe-decor.jpg', category: '装饰类', price: 16.8, sold: 10000 },
        { id: 3, title: '街角店铺门头空间', image: 'assets/products/space-shopfront.jpg', category: '装修类', price: 39.9, sold: 860 },
        { id: 4, title: '沉浸式休闲房装修方案', image: 'assets/products/space-renovation.jpg', category: '装修类', price: 29.9, sold: 1520 },
        { id: 5, title: '小型吧台家具套件', image: 'assets/products/space-furniture.jpg', category: '家具类', price: 128, sold: 320 },
        { id: 6, title: '开业活动空间文案包', image: 'assets/products/space-lighting.jpg', category: '文案类', price: 9.9, sold: 4210 },
        { id: 7, title: '现代简约客厅家具组合', image: 'assets/products/space-furniture.jpg', category: '家具类', price: 268, sold: 145 },
        { id: 8, title: '直播间灯光布置方案', image: 'assets/products/space-lighting.jpg', category: '灯具类', price: 59.9, sold: 780 },
        { id: 9, title: '国风雅居书房套装', image: 'assets/products/space-renovation.jpg', category: '装修类', price: 88, sold: 260 },
        { id: 10, title: '商务办公桌椅组合', image: 'assets/products/space-furniture.jpg', category: '家具类', price: 199, sold: 190 },
        { id: 11, title: '墙面装饰画精选集', image: 'assets/products/space-cafe-decor.jpg', category: '装饰类', price: 45.9, sold: 1320 },
        { id: 12, title: '氛围灯带套装', image: 'assets/products/space-lighting.jpg', category: '灯具类', price: 19.9, sold: 5600 },
        { id: 13, title: '复式Loft空间模板', image: 'assets/products/space-living-room.jpg', category: '装修类', price: 68, sold: 430 },
        { id: 14, title: '展示货架组合', image: 'assets/products/space-furniture.jpg', category: '家具类', price: 158, sold: 275 },
        { id: 15, title: '店铺介绍文案模板', image: 'assets/products/space-lighting.jpg', category: '文案类', price: 6.9, sold: 8800 },
        { id: 16, title: '温馨软装搭配方案', image: 'assets/products/space-renovation.jpg', category: '装修类', price: 25.9, sold: 1010 },
        { id: 17, title: '桌面摆件精选', image: 'assets/products/space-cafe-decor.jpg', category: '装饰类', price: 15.8, sold: 2340 },
        { id: 18, title: '智能灯组控制系统', image: 'assets/products/space-lighting.jpg', category: '灯具类', price: 299, sold: 88 }
      ];

      let currentCategory = '装修类';
      let currentChild = '';
      let searchKeyword = '';

      const categorySidebar = document.getElementById('categorySidebar');
      const productsGrid = document.getElementById('productsGrid');
      const searchInput = document.getElementById('searchInput');
      const categoryTiles = document.getElementById('categoryTiles');
      const subTabs = document.getElementById('subTabs');

      const TILE_STYLE = {
        '装修类': { bg: 'transparent', img: 'assets/v2/processed/T恤-青色1.png' },
        '家具类': { bg: 'transparent', img: 'assets/v2/processed/沙发-1.png' },
        '文具': { bg: 'transparent', img: 'assets/v2/processed/铅笔橡皮-1.png' },
        '装饰类': { bg: 'transparent', img: 'assets/v2/processed/蝴蝶结-1.png' },
        '饰品类': { bg: 'transparent', img: 'assets/v2/processed/宝箱-1.png' },
        '灯具类': { bg: '#fffbe6', icon: 'solar:lamp-bold', color: '#e0b500' },
        '文案类': { bg: '#eafaf1', icon: 'solar:document-text-bold', color: '#2ecc71' }
      };

      function showToast(message) {
        const el = document.createElement('div');
        el.textContent = message;
        el.style.cssText =
          'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:8px 16px;border-radius:6px;z-index:999;';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1600);
      }

      function renderTiles() {
        categoryTiles.innerHTML = categoryGroups
          .slice(0, 5)
          .map(g => {
            const s = TILE_STYLE[g.category] || TILE_STYLE['装修类'];
            const inner = s.img
              ? `<img src="${s.img}" alt="${g.category}" style="width:30px;height:30px;object-fit:contain" />`
              : `<iconify-icon style="font-size:24px" icon="${s.icon}"></iconify-icon>`;
            return `<button class="tile" onclick="selectCategory('${g.category}')">
              <span class="tile-icon" style="background:${s.bg}; color:${s.color || 'inherit'}">
                ${inner}
              </span>
              <span class="tile-label">${g.category}</span>
            </button>`;
          })
          .join('');
      }

      function renderSubTabs() {
        const group = categoryGroups.find(g => g.category === currentCategory);
        if (!group) {
          subTabs.innerHTML = '';
          return;
        }
        subTabs.innerHTML = group.children
          .map((child, index) => {
            const count = index === 0 ? 12 : 0;
            return `<button class="sub-tab${currentChild === child ? ' active' : ''}" onclick="selectChild('${child}')">
              ${child}${count ? `<span class="tab-badge">${count}</span>` : ''}
            </button>`;
          })
          .join('');
      }

      function selectCategory(category) {
        currentCategory = category;
        currentChild = '';
        renderCategoryTabs();
        renderSubTabs();
        renderProducts();
      }

      function selectChild(child) {
        currentChild = child;
        renderSubTabs();
        renderProducts();
      }

      function renderCategoryTabs() {
        categorySidebar.innerHTML =
          `<button class="category-tab${currentCategory === '全部' ? ' active' : ''}" data-category="全部">全部</button>` +
          categoryGroups
            .map(
              (group, index) =>
                `<button class="category-tab${group.category === currentCategory ? ' active' : ''}" data-category="${group.category}">${group.category}</button>`
            )
            .join('');
      }

      categorySidebar.addEventListener('click', event => {
        const tab = event.target.closest('.category-tab');
        if (!tab) return;
        currentCategory = tab.dataset.category;
        currentChild = '';
        renderCategoryTabs();
        renderSubTabs();
        renderProducts();
      });

      function renderProducts() {
        let filteredProducts = products.filter(
          p => currentCategory === '全部' || p.category === currentCategory
        );

        if (currentChild) {
          const matched = filteredProducts.filter(p =>
            p.title.includes(currentChild.replace(/\s/g, ''))
          );
          if (matched.length) filteredProducts = matched;
        }

        if (searchKeyword) {
          filteredProducts = filteredProducts.filter(p =>
            p.title.toLowerCase().includes(searchKeyword.toLowerCase())
          );
        }

        if (filteredProducts.length === 0) {
          productsGrid.innerHTML = '<div class="empty-state">暂无相关商品</div>';
          return;
        }

        productsGrid.innerHTML = filteredProducts
          .map(
            product => `
            <article class="product-card" data-id="${product.id}">
              <div class="product-image">
                <img src="${product.image}" alt="${product.title}" loading="lazy" />
              </div>
              <h3 class="product-title">${product.title}</h3>
              <div class="product-foot">
                <span class="product-price">¥${product.price.toFixed(2)}</span>
                <span class="product-sold">已售${product.sold}</span>
              </div>
            </article>
          `
          )
          .join('');
      }

      searchInput.addEventListener('input', event => {
        searchKeyword = event.target.value.trim();
        renderProducts();
      });

      renderTiles();
      renderCategoryTabs();
      renderSubTabs();
      renderProducts();
    </script>
  </body>
</html>
