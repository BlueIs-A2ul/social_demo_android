<!doctype html>

<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0"
      name="viewport"
    />
    <title>引导页 - 性别选择</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <link href="assets/vendor/theme.css" rel="stylesheet" />
    <style>
      body {
        width: 100%;
        height: 100dvh;
        background-color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        overflow: hidden;
        position: relative;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(
          --safe-area-inset-bottom,
          env(safe-area-inset-bottom, 0px)
        );
      }
      .gender-btn {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.18s ease;
        cursor: pointer;
        background: transparent;
        border: 2px solid transparent;
      }
      .gender-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .gender-btn.selected {
        border-color: var(--brand);
        box-shadow: 0 0 0 6px var(--brand-soft);
        transform: scale(1.04);
      }
    </style>
  </head>
  <body class="flex flex-col">
    <!-- 顶部：返回 + 跳过 -->
    <div
      class="flex items-center justify-between px-5 pt-3 shrink-0"
      style="padding-top: calc(var(--safe-area-inset-top, 0px) + 12px)"
    >
      <button class="text-[#9fb3b9] text-2xl leading-none" onclick="history.back()">‹</button>
      <a
        class="text-[13px] text-[#9fb3b9] px-4 py-1.5 rounded-full bg-[#f2f7f8]"
        href="onboarding_birth.html"
        >跳过</a
      >
    </div>
    <!-- 主内容区 -->
    <div class="flex-1 px-8 pt-10 flex flex-col min-h-0 overflow-y-auto">
      <h1 class="text-[28px] font-bold title-brand leading-snug tracking-wide">
        告诉我们<br />你的性别
      </h1>
      <div class="flex-1 flex flex-col items-center justify-center gap-9 pb-6">
        <!-- 男 -->
        <div class="flex flex-col items-center gap-2">
          <button
            class="gender-btn selected"
            id="btn-male"
            onclick="selectGender('male')"
          >
            <img alt="男" src="assets/v2/icon/gender-male.png" />
          </button>
          <span class="text-[15px] text-[#3f5b64]">男</span>
        </div>
        <!-- 女 -->
        <div class="flex flex-col items-center gap-2">
          <button class="gender-btn" id="btn-female" onclick="selectGender('female')">
            <img alt="女" src="assets/v2/icon/gender-female.png" />
          </button>
          <span class="text-[15px] text-[#3f5b64]">女</span>
        </div>
        <!-- 其它 -->
        <div class="flex flex-col items-center gap-2">
          <button class="gender-btn" id="btn-other" onclick="selectGender('other')">
            <img alt="其它" src="assets/new_src/gender/other.png" />
          </button>
          <span class="text-[15px] text-[#3f5b64]">其它</span>
        </div>
      </div>
    </div>
    <!-- 底部操作栏 -->
    <div class="px-8 py-6 flex items-center justify-center shrink-0">
      <button
        class="btn-brand text-base px-12 py-3"
        onclick="location.href = 'onboarding_birth.html'"
      >
        下一步
      </button>
    </div>
    <script>
      function selectGender(gender) {
        const btns = {
          male: document.getElementById('btn-male'),
          female: document.getElementById('btn-female'),
          other: document.getElementById('btn-other'),
        }
        Object.values(btns).forEach(btn => btn.classList.remove('selected'))
        btns[gender].classList.add('selected')
      }
    </script>
  </body>
</html>
