    <script>
      const memberPermissionState = { speak: true, receive: true }
      let sheetToastTimer

      function openMemberMenu(name, avatarSrc, tag) {
        document.getElementById('memberSheetName').textContent = name
        document.getElementById('memberSheetAvatar').src = avatarSrc
        document.getElementById('memberSheetTag').textContent = tag
        memberPermissionState.speak = true
        memberPermissionState.receive = true
        renderPermissionToggle('speak')
        renderPermissionToggle('receive')
        document.getElementById('memberSheetOverlay').classList.add('show')
      }

      function closeMemberMenu() {
        document.getElementById('memberSheetOverlay').classList.remove('show')
      }

      function renderPermissionToggle(type) {
        const on = memberPermissionState[type]
        document
          .getElementById(type + 'Toggle')
          .classList.toggle('on', on)
        const desc = document.getElementById(type + 'Desc')
        if (type === 'speak') {
          desc.textContent = on ? '允许发言' : '禁止发言'
        } else {
          desc.textContent = on ? '接收消息' : '屏蔽消息'
        }
      }

      function togglePermission(type) {
        memberPermissionState[type] = !memberPermissionState[type]
        renderPermissionToggle(type)
        const name = document.getElementById('memberSheetName').textContent
        const label = type === 'speak' ? '发言' : '接收'
        const action = memberPermissionState[type] ? '已允许' : '已禁止'
        showSheetToast(name + ' ' + action + label)
      }

      function showSheetToast(msg) {
        const toast = document.getElementById('memberSheetToast')
        toast.textContent = msg
        toast.classList.add('show')
        clearTimeout(sheetToastTimer)
        sheetToastTimer = setTimeout(() => {
          toast.classList.remove('show')
        }, 1500)
      }
    </script>
  </body>
</html>
