<!doctype html>

<html data-immersive-translate-page-theme="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>收藏夹 - 元宇宙社交</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <style>
      @import url('assets/vendor/inter.css');
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
      }
      .mobile-container {
        width: 100%;
        height: 100dvh;
        background-color: white;
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* 直角设计 */
      * {
        border-radius: 0 !important;
      }
      .group-content {
        transition: max-height 0.3s ease-out;
        max-height: 0;
        overflow: hidden;
      }
      .group-content.expanded {
        max-height: 2000px; /* Large enough to fit content */
      }
      .resume-clone-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        border: 1px solid #000;
        color: #000;
        background: #fff;
        font-family: SimSun, 'Songti SC', 'Noto Serif SC', serif;
        font-size: 12px;
      }
      .resume-clone-table td {
        border: 1px solid #000;
        padding: 0 6px;
        height: 52px;
        vertical-align: middle;
      }
      .resume-clone-table .resume-top-row td {
        height: 62px;
      }
      .resume-clone-table .resume-unit-row td {
        height: 30px;
      }
      .resume-label {
        text-align: center;
        font-size: 16px;
        line-height: 1.75;
        font-weight: 400;
        white-space: normal;
      }
      .resume-label-multiline {
        display: inline-block;
        line-height: 1.8;
      }
      .resume-value {
        text-align: left;
        font-size: 11px;
        line-height: 1.35;
        word-break: break-word;
      }
      .resume-photo-cell {
        padding: 8px !important;
        text-align: center;
      }
      .resume-photo-box {
        width: 78px;
        height: 78px;
        margin: 0 auto;
        object-fit: cover;
        border: 1px solid #000;
      }
      .toast {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 8px 16px;
        font-size: 14px;
        z-index: 100;
        display: none;
      }
      .user-vip-badge {
        display: inline-block;
        width: 18px;
        height: auto;
        margin-left: 4px;
        vertical-align: -4px;
      }
    </style>
  </head>
  <body class="">
    <div class="mobile-container">
      <!-- Header -->
      <header
        class="px-4 py-3 flex justify-between items-center bg-[#ec4899] text-white flex-none"
        style="background-color: rgb(255, 255, 255);"
      >
        <a class="text-white" href="profile.html">
          <svg class="" fill="none" height="24" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter" stroke-width="2" style="color: rgb(0, 0, 0);" viewbox="0 0 24 24" width="24">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
          </svg>
        </a>
        <h1 class="text-lg font-bold tracking-tight" style="color: rgb(0, 0, 0);">收藏夹</h1>
        <div class="w-6"></div>
        <!-- Placeholder for symmetry -->
      </header>
      <!-- Search Bar -->
      <div class="px-4 py-3 bg-white flex-none border-b border-gray-100">
        <div class="flex space-x-0">
          <div class="relative flex-1">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
              <svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
              </svg>
            </span>
            <input class="w-full pl-10 pr-4 py-2 bg-white border border-gray-300 focus:outline-none focus:border-pink-500 text-sm font-light" id="favSearchInput" placeholder="搜索收藏" type="text"/>
          </div>
          <button class="bg-[#ec4899] text-white px-5 py-2 text-sm font-bold hover:bg-[#db2777] transition-colors" onclick="filterFavorites()">搜索</button>
        </div>
      </div>
      <!-- Favorite Groups -->
      <main class="flex-1 overflow-y-auto bg-white hide-scrollbar" id="favList">
        <!-- Group 1: 房间收藏 -->
        <div class="group-item border-b border-gray-100">
          <div class="group-header px-4 py-3 flex items-center justify-between cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors" onclick="toggleGroup(this)">
            <div class="flex items-center space-x-2">
              <span class="arrow transition-transform duration-200">▼</span>
              <span class="font-bold text-sm">房间收藏（5）</span>
            </div>
          </div>
          <div class="group-content expanded">
            <!-- Card R1: 王爷府 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="王爷府">
              <div class="flex items-start space-x-3">
                <img alt="王爷府房间" class="w-10 h-10 !rounded-full object-cover flex-none cursor-pointer" src="assets/packaged/sq/微信图片_20260727180857.jpg" onclick="enterRoom('王爷府')"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">王爷府<img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); enterRoom('王爷府')"/></h3>
                  <p class="text-[12px] text-gray-500 mt-0.5">游戏策划 · 在线</p>
                </div>
                <div class="flex-none"></div>
              </div>
            </div>
            <!-- Card R2: 小美的房间 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="小美的房间">
              <div class="flex items-start space-x-3">
                <img alt="小美的房间房间" class="w-10 h-10 !rounded-full object-cover flex-none cursor-pointer" src="assets/packaged/a360e987b470405b93134ddbf8e0e7c2.png" onclick="enterRoom('小美的房间')"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">小美的房间<img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); enterRoom('小美的房间')"/></h3>
                  <p class="text-[12px] text-gray-500 mt-0.5">插画师 · 在线</p>
                </div>
                <div class="flex-none"></div>
              </div>
            </div>
            <!-- Card R3: 蓝鹊咖啡 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="蓝鹊咖啡">
              <div class="flex items-start space-x-3">
                <img alt="蓝鹊咖啡房间" class="w-10 h-10 !rounded-full object-cover flex-none cursor-pointer" src="./assets/shops/shop-coffee-bar.png" onclick="enterRoom('蓝鹊咖啡')"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">蓝鹊咖啡<img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); enterRoom('蓝鹊咖啡')"/></h3>
                  <p class="text-[12px] text-gray-500 mt-0.5">咖啡馆主理人 · 营业中</p>
                </div>
                <div class="flex-none"></div>
              </div>
            </div>
            <!-- Card R4: 布朗披萨 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="布朗披萨">
              <div class="flex items-start space-x-3">
                <img alt="布朗披萨房间" class="w-10 h-10 !rounded-full object-cover flex-none cursor-pointer" src="./assets/shops/shop-pizza-front.png" onclick="enterRoom('布朗披萨')"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">布朗披萨<img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); enterRoom('布朗披萨')"/></h3>
                  <p class="text-[12px] text-gray-500 mt-0.5">餐饮店主理人 · 营业中</p>
                </div>
                <div class="flex-none"></div>
              </div>
            </div>
            <!-- Card R5: 妮妮的播客 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="妮妮的播客">
              <div class="flex items-start space-x-3">
                <img alt="妮妮的播客房间" class="w-10 h-10 !rounded-full object-cover flex-none cursor-pointer" src="assets/packaged/sq/妮妮的播客.png" onclick="enterRoom('妮妮的播客')"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">妮妮的播客<img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); enterRoom('妮妮的播客')"/></h3>
                  <p class="text-[12px] text-gray-500 mt-0.5">电台主播 · 在线</p>
                </div>
                <div class="flex-none"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- Group 2: 简历收藏 -->
        <div class="group-item border-b border-gray-100">
          <div class="group-header px-4 py-3 flex items-center justify-between cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors" onclick="toggleGroup(this)">
            <div class="flex items-center space-x-2">
              <span class="arrow transition-transform duration-200">▼</span>
              <span class="font-bold text-sm">简历收藏（3）</span>
            </div>
          </div>
          <div class="group-content expanded">
            <!-- Card C1: 林晓 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="林晓">
              <div class="flex items-start space-x-3">
                <img alt="林晓头像" class="w-10 h-10 !rounded-full object-cover flex-none" src="assets/packaged/sq/0d701411d275f9d164e246bd175c76644d3023fa.jpg"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">林晓<img alt="女" class="user-vip-badge" src="assets/new_src/gender/female.png"/><img alt="个人VIP" class="user-vip-badge" src="assets/src_01/颜色vip/技术服务类vip.jpg"/><img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); showToast('进入林晓房间 建设中')"/></h3>
                  <p class="text-[12px] text-green-500 mt-0.5">在线</p>
                </div>
                <div class="flex space-x-2 flex-none">
                  <button class="px-2 py-1 text-[9px] border border-black font-bold hover:bg-gray-50" onclick="showResume('林晓')">个人简历</button>
                </div>
              </div>
            </div>
            <!-- Card C2: 张明 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="张明">
              <div class="flex items-start space-x-3">
                <img alt="张明头像" class="w-10 h-10 !rounded-full object-cover flex-none" src="assets/packaged/sq/8ec66e69782ddb4c55f6563040c540e8f07b5058.webp"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">张明<img alt="男" class="user-vip-badge" src="assets/new_src/gender/male.png"/><img alt="个人VIP" class="user-vip-badge" src="assets/src_01/颜色vip/技术服务类vip.jpg"/><img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); showToast('进入张明房间 建设中')"/></h3>
                  <p class="text-[12px] text-green-500 mt-0.5">在线</p>
                </div>
                <div class="flex space-x-2 flex-none">
                  <button class="px-2 py-1 text-[9px] border border-black font-bold hover:bg-gray-50" onclick="showResume('张明')">个人简历</button>
                </div>
              </div>
            </div>
            <!-- Card C3: 王芳 -->
            <div class="p-4 border-b border-gray-50 fav-card" data-name="王芳">
              <div class="flex items-start space-x-3">
                <img alt="王芳头像" class="w-10 h-10 !rounded-full object-cover flex-none" src="assets/packaged/sq/8401169b53134beca3685656529d68e7.jpg"/>
                <div class="flex-1">
                  <h3 class="text-[14px] font-bold text-black">王芳<img alt="女" class="user-vip-badge" src="assets/new_src/gender/female.png"/><img alt="个人VIP" class="user-vip-badge" src="assets/src_01/颜色vip/技术服务类vip.jpg"/><img alt="房间已点亮" class="user-vip-badge cursor-pointer" src="assets/new_src/雷达点亮房间图.jpg" onclick="event.stopPropagation(); showToast('进入王芳房间 建设中')"/></h3>
                  <p class="text-[12px] text-gray-400 mt-0.5">5分钟前活跃</p>
                </div>
                <div class="flex space-x-2 flex-none">
                  <button class="px-2 py-1 text-[9px] border border-black font-bold hover:bg-gray-50" onclick="showResume('王芳')">个人简历</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <!-- Resume Modal -->
      <div class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" id="resumeModal">
        <div class="bg-white w-full max-w-[360px] p-4 relative border border-black">
          <button class="absolute top-2 right-2 text-gray-500 hover:text-black" onclick="closeResumeModal()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
              <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </button>
          <h2 class="text-center text-lg font-bold mb-4">个人简历</h2>
          <div id="resumeContent">
            <!-- Table inserted here -->
          </div>
          <div class="mt-4 flex justify-center">
            <button class="px-6 py-2 border border-black text-sm font-bold hover:bg-gray-100" onclick="closeResumeModal()">关闭</button>
          </div>
        </div>
      </div>
      <!-- Toast -->
      <div class="toast" id="toast">进入房间</div>
    </div>
    <script>
      // Collapsible logic
      function toggleGroup(header) {
        const content = header.nextElementSibling;
        const arrow = header.querySelector('.arrow');

        if (content.classList.contains('expanded')) {
          content.classList.remove('expanded');
          arrow.style.transform = 'rotate(0deg)';
          arrow.textContent = '▶';
        } else {
          content.classList.add('expanded');
          arrow.style.transform = 'rotate(0deg)';
          arrow.textContent = '▼';
        }
      }

      // Search filter
      function filterFavorites() {
        const keyword = document.getElementById('favSearchInput').value.trim().toLowerCase();
        document.querySelectorAll('.fav-card').forEach(card => {
          const name = (card.dataset.name || '').toLowerCase();
          card.classList.toggle('hidden', keyword !== '' && !name.includes(keyword));
        });
      }

      // Enter room from room image
      function enterRoom(name) {
        window.location.href = 'panorama_room.html?from=favorites';
      }

      // Resume data
      const resumes = {
        '林晓': {
          "姓名": "林晓", "出生": "1998年3月", "性别": "女", "民族": "汉族", "职业": "空间设计师", "职业现状": "在职",
          "上任单位": "XX装饰设计有限公司", "教育经历": "南京艺术学院 环境设计 本科", "技能": "空间设计、摄影",
          "特长": "视觉表达、沟通", "爱好": "旅行、音乐、阅读", "自我评价": "热爱空间设计，善于用视觉语言表达创意，乐于沟通合作",
          "联系人": "张经理", "电话": "138****8888", "头像": "assets/packaged/sq/0d701411d275f9d164e246bd175c76644d3023fa.jpg"
        },
        '张明': {
          "姓名": "张明", "出生": "1997年8月", "性别": "男", "民族": "汉族", "职业": "软件工程师", "职业现状": "在职",
          "上任单位": "XX互联网技术有限公司", "教育经历": "浙江大学 计算机科学 硕士", "技能": "Java、Python、前端开发",
          "特长": "算法设计、团队协作", "爱好": "篮球、游戏、电影", "自我评价": "技术驱动型开发者，注重代码质量和团队效率",
          "联系人": "李总", "电话": "139****7777", "头像": "assets/packaged/sq/8ec66e69782ddb4c55f6563040c540e8f07b5058.webp"
        },
        '王芳': {
          "姓名": "王芳", "出生": "1999年12月", "性别": "女", "民族": "回族", "职业": "平面设计师", "职业现状": "在职",
          "上任单位": "创意方舟设计工作室", "教育经历": "中央美术学院 视觉传达 本科", "技能": "插画、品牌设计",
          "特长": "色彩搭配、创意构思", "爱好": "绘画、摄影、旅行", "自我评价": "用画笔记录世界，追求视觉美感与品牌理念的统一",
          "联系人": "王总监", "电话": "137****6666", "头像": "assets/packaged/sq/8401169b53134beca3685656529d68e7.jpg"
        }
      };

      function showResume(name) {
        const data = resumes[name];
        if (!data) return;
        const content = document.getElementById('resumeContent');

        content.innerHTML = `
          <table class="resume-clone-table">
            <colgroup>
              <col class="resume-col-label" style="width: 16.66%;">
              <col class="resume-col-value" style="width: 16.66%;">
              <col class="resume-col-label" style="width: 16.66%;">
              <col class="resume-col-value" style="width: 16.66%;">
              <col class="resume-col-photo" style="width: 33.36%;">
            </colgroup>
            <tr class="resume-top-row">
              <td class="resume-label">姓名</td>
              <td class="resume-value">${data["姓名"]}</td>
              <td class="resume-label">性别</td>
              <td class="resume-value">${data["性别"]}</td>
              <td class="resume-photo-cell" rowspan="3">
                <img src="${data["头像"]}" alt="${data["姓名"]}" class="resume-photo-box">
              </td>
            </tr>
            <tr class="resume-top-row">
              <td class="resume-label">出生</td>
              <td class="resume-value">${data["出生"]}</td>
              <td class="resume-label">民族</td>
              <td class="resume-value">${data["民族"]}</td>
            </tr>
            <tr class="resume-top-row">
              <td class="resume-label">职业</td>
              <td class="resume-value">${data["职业"]}</td>
              <td class="resume-label"><span class="resume-label-multiline">职业<br>现状</span></td>
              <td class="resume-value">${data["职业现状"]}</td>
            </tr>
            <tr class="resume-unit-row">
              <td class="resume-label" rowspan="2"><span class="resume-label-multiline">上任单<br>位名称</span></td>
              <td class="resume-value" colspan="2" rowspan="2">${data["上任单位"]}</td>
              <td class="resume-label">联系人</td>
              <td class="resume-value">${data["联系人"]}</td>
            </tr>
            <tr class="resume-unit-row">
              <td class="resume-label">电话</td>
              <td class="resume-value">${data["电话"]}</td>
            </tr>
            <tr>
              <td class="resume-label"><span class="resume-label-multiline">教育<br>经历</span></td>
              <td class="resume-value" colspan="4">${data["教育经历"]}</td>
            </tr>
            <tr>
              <td class="resume-label">技能</td>
              <td class="resume-value" colspan="4">${data["技能"]}</td>
            </tr>
            <tr>
              <td class="resume-label">特长</td>
              <td class="resume-value" colspan="4">${data["特长"]}</td>
            </tr>
            <tr>
              <td class="resume-label">爱好</td>
              <td class="resume-value" colspan="4">${data["爱好"]}</td>
            </tr>
            <tr>
              <td class="resume-label"><span class="resume-label-multiline">自我<br>评价</span></td>
              <td class="resume-value" colspan="4">${data["自我评价"]}</td>
            </tr>
          </table>
        `;
        document.getElementById('resumeModal').classList.remove('hidden');
      }

      function closeResumeModal() {
        document.getElementById('resumeModal').classList.add('hidden');
      }

      function showToast(msg) {
        const toast = document.getElementById('toast');
        if (msg) toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => {
          toast.style.display = 'none';
        }, 2000);
      }
    </script>
  </body>
</html>
