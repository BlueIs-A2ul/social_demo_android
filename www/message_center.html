<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>信息中心 - 智慧空间</title>
<script src="assets/vendor/tailwindcss.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<script src="assets/vendor/nav.js"></script>
<script>
    (function () {
        try {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'setBottomNav', visible: false }, '*')
            }
        } catch (e) {}
    })();
</script>
<style>
    :root {
        --teal: #56C2CE;
        --teal-line: #ABE1E8;
        --teal-glow: rgba(171, 225, 232, 1);
        --red-badge: #FF736B;
        --green: #00DC6E;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
    }
    ::-webkit-scrollbar { display: none; }
    button { font: inherit; border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; }
    a { color: inherit; text-decoration: none; }
    .app-container {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #fff;
        overflow: hidden;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    }
    /* ===== 顶部青色栏 ===== */
    .topbar {
        flex: none;
        height: 44px;
        background: var(--teal);
        display: flex;
        align-items: center;
        padding: 0 6px;
        color: #fff;
    }
    .topbar .icon-btn {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
    }
    .topbar h1 {
        flex: 1;
        margin: 0;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
    }
    .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-right: 20px;
        flex: none;
    }
    .header-actions .icon-btn { width: 26px; height: 26px; }
    .header-actions.hidden { display: none; }

    main { flex: 1; overflow-y: auto; position: relative; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* ===== 会话卡片 ===== */
    .chat-card {
        display: flex;
        align-items: center;
        margin: 8px 13px 0;
        height: 66px;
        padding-left: 13px;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 1px 6px var(--teal-glow);
        cursor: pointer;
    }
    .chat-avatar { position: relative; width: 32px; height: 32px; flex: none; }
    .chat-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 9999px;
    }
    .chat-avatar img.square { border-radius: 4px; }
    .chat-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 16px;
        height: 16px;
        padding: 0 3px;
        border-radius: 9999px;
        background: var(--red-badge);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .chat-info { flex: 1; min-width: 0; margin-left: 19px; padding-right: 12px; }
    .chat-name { font-size: 16px; line-height: 22px; color: var(--teal); }
    .chat-preview {
        font-size: 13px;
        line-height: 20px;
        color: #B3B3B3;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ===== 通讯录 ===== */
    .contacts-top {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 12px 11px 0 10px;
    }
    .search-field {
        flex: 1;
        min-width: 0;
        height: 32px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px 0 12px;
        background: #fff;
        border: 1px solid var(--teal-line);
        border-radius: 30px;
        box-shadow: 0 0 5px var(--teal-glow);
    }
    .search-field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        font-size: 13px;
        background: transparent;
    }
    .search-field img { width: 18px; height: 18px; flex: none; }
    .pill {
        height: 26px;
        min-width: 60px;
        padding: 0 14px;
        border-radius: 100px;
        font-size: 13px;
        background: #fff;
        border: 1px solid #E1E1E1;
        color: #555;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
    }
    .pill.selected { background: var(--teal); border-color: var(--teal); color: #fff; }

    .new-friends {
        margin: 12px 10px 0;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 1px 5px var(--teal-glow);
        padding: 7px 6px 14px;
    }
    .nf-title { font-size: 14px; line-height: 20px; color: #555; }
    .nf-divider { height: 1px; background: #F2F2F2; margin-top: 5px; }
    .nf-row { display: flex; align-items: center; margin-top: 13px; }
    .nf-avatar { width: 33px; height: 33px; border-radius: 9999px; object-fit: cover; flex: none; }
    .nf-name { font-size: 16px; color: var(--teal); margin-left: 8px; flex: none; }
    .nf-desc { font-size: 13px; color: #999; margin-left: 10px; flex: 1; min-width: 0; }
    .btn-reject,
    .btn-accept {
        width: 45px;
        height: 22px;
        border-radius: 5px;
        font-size: 12px;
        flex: none;
        box-shadow: 0 4px 10px rgba(179, 179, 179, 1);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .btn-reject { background: #fff; color: #555; margin-right: 15px; }
    .btn-accept { background: var(--green); color: #fff; margin-right: 6px; }

    .contact-list { margin-top: 14px; }
    .contact-row {
        display: flex;
        align-items: center;
        height: 43px;
        padding: 0 10px 0 24px;
        border-bottom: 1px solid #F2F2F2;
    }
    .contact-avatar { width: 33px; height: 33px; border-radius: 9999px; object-fit: cover; flex: none; }
    .contact-name { font-size: 16px; color: var(--teal); margin-left: 8px; width: 73px; flex: none; }
    .contact-name.offline { color: #909090; }
    .contact-badges { display: flex; align-items: center; gap: 3px; min-width: 0; }
    .contact-badges img { width: 35px; height: 35px; object-fit: contain; display: block; flex: none; }

    .az-index {
        position: absolute;
        right: 4px;
        top: 62px;
        width: 14px;
        text-align: center;
        font-family: '微软雅黑', -apple-system, sans-serif;
        font-size: 12px;
        line-height: 20px;
        color: #555;
        user-select: none;
    }

    /* ===== 底部 Tab：信息 / 群聊 / 通讯录 ===== */
    .msg-tabs {
        flex: none;
        height: 58px;
        background: #fff;
        display: flex;
        align-items: stretch;
        box-shadow: 0 0 5px var(--teal-glow);
        position: relative;
        z-index: 5;
    }
    .msg-tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        color: #7f7f7f;
        font-size: 12px;
    }
    .msg-tab.active { color: var(--teal); }
    .tab-icon { position: relative; height: 26px; display: flex; align-items: center; justify-content: center; }
    .tab-icon svg { display: block; }
    .tab-badge {
        position: absolute;
        top: -5px;
        right: -6px;
        min-width: 16px;
        height: 16px;
        padding: 0 3px;
        border-radius: 9999px;
        background: var(--red-badge);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ===== 添加好友弹窗 ===== */
    .add-friend-modal { position: fixed; inset: 0; z-index: 80; display: none; }
    .add-friend-modal.open { display: block; }
    .af-mask { position: absolute; inset: 0; background: rgba(47, 79, 79, .6); }
    .af-panel {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: calc(var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) + 64px);
        width: 266px;
        height: 188px;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 0 3px rgba(171, 225, 232, 1);
    }
    .af-title {
        position: absolute;
        left: 114px;
        top: 9px;
        width: 56px;
        height: 20px;
        font-size: 14px;
        line-height: 20px;
        color: #555;
        white-space: nowrap;
    }
    .af-close {
        position: absolute;
        right: 6px;
        top: 8px;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .af-close svg { display: block; }
    .af-divider { position: absolute; left: 0; right: 0; top: 36px; height: 1px; background: #f2f2f2; }
    .af-input {
        position: absolute;
        left: 25px;
        top: 68px;
        width: 216px;
        height: 35px;
        box-sizing: border-box;
        padding: 0 2px;
        border: 1px solid #f2f2f2;
        border-radius: 4px;
        background: #fff;
        font-size: 14px;
        color: #000;
        outline: none;
    }
    .af-input::placeholder { font-size: 12px; color: #999; }
    .af-input:focus { border-color: #abe1e8; }
    .af-btn {
        position: absolute;
        left: 77px;
        top: 138px;
        width: 117px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: linear-gradient(100.608085046201deg, #7EDBE5 3%, #56C2CE 38%, #2E8A96 97%);
        box-shadow: 0 4px 10px rgba(179, 179, 179, 1);
        color: #fff;
        font-size: 12px;
    }
    /* ===== 模拟扫码 ===== */
    .scan-modal { position: fixed; inset: 0; z-index: 120; display: none; background: radial-gradient(circle at 50% 42%, #1d3036 0%, #10181b 68%); }
    .scan-modal.open { display: block; }
    .scan-topbar {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .scan-title { color: #fff; font-size: 16px; font-weight: 600; }
    .scan-close {
        position: absolute;
        left: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
    }
    .scan-stage {
        position: absolute;
        left: 50%;
        top: 44%;
        width: 232px;
        height: 232px;
        transform: translate(-50%, -50%);
    }
    .scan-frame i { position: absolute; width: 28px; height: 28px; border: 3px solid #7edbe5; }
    .scan-frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
    .scan-frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
    .scan-frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
    .scan-frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
    .scan-line {
        position: absolute;
        left: 6px;
        right: 6px;
        top: 4px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(126, 219, 229, 0), #7edbe5 50%, rgba(126, 219, 229, 0));
        box-shadow: 0 0 14px rgba(126, 219, 229, .85);
        animation: scan-move 1.6s ease-in-out infinite alternate;
    }
    @keyframes scan-move {
        from { transform: translateY(0); }
        to { transform: translateY(222px); }
    }
    .scan-success {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
    }
    .scan-modal.done .scan-line { display: none; }
    .scan-modal.done .scan-success { display: flex; }
    .scan-success-circle {
        width: 58px;
        height: 58px;
        border-radius: 9999px;
        background: #4dd0e1;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: scan-pop .28s ease-out;
    }
    @keyframes scan-pop {
        from { transform: scale(.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    .scan-hint {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(44% + 140px);
        text-align: center;
        color: rgba(255, 255, 255, .72);
        font-size: 13px;
        line-height: 1.6;
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- 顶部栏 -->
    <header class="topbar">
        <button aria-label="返回" class="icon-btn" onclick="appBack()">
            <svg width="9" height="17" viewBox="0 0 9 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.80578052719351 8.50370982382574 L 8.97338443919557 0.991619997177496 L 8.10342780198317 0.0797946369688453 L 0.0672535821171025 8.50426177111519 L 8.10342780198317 16.9277618170732 L 8.97338443919557 16.0159576720417 L 1.80578052719351 8.50370982382574 Z" fill="currentColor"/>
            </svg>
        </button>
        <h1 id="pageTitle">信息中心</h1>
        <div class="header-actions" id="actionsChat">
            <button aria-label="扫一扫" class="icon-btn" onclick="startQrScan()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 8.5V5.2c0-.9.8-1.7 1.7-1.7h3.3"></path>
                    <path d="M15.5 3.5h3.3c.9 0 1.7.8 1.7 1.7v3.3"></path>
                    <path d="M20.5 15.5v3.3c0 .9-.8 1.7-1.7 1.7h-3.3"></path>
                    <path d="M8.5 20.5H5.2c-.9 0-1.7-.8-1.7-1.7v-3.3"></path>
                    <path d="M3.5 12h17"></path>
                </svg>
            </button>
            <button aria-label="搜索" class="icon-btn" onclick="showToast('搜索')">
                <svg width="22" height="23" viewBox="0 0 22 23" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
                    <circle cx="9.6" cy="9.6" r="7.4"></circle>
                    <path d="M15.2 15.2 L20.4 20.4"></path>
                </svg>
            </button>
            <button aria-label="添加好友" class="icon-btn" onclick="showAddFriendModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10.5" cy="7.6" r="4"></circle>
                    <path d="M3.6 20.4c0-3.6 3.1-6.2 6.9-6.2 1.3 0 2.5.3 3.6.8"></path>
                    <path d="M17.6 13.6v6.8M14.2 17h6.8"></path>
                </svg>
            </button>
        </div>
        <div class="header-actions hidden" id="actionsContacts">
            <button aria-label="扫一扫" class="icon-btn" onclick="startQrScan()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3a4a4a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 8.5V5.2c0-.9.8-1.7 1.7-1.7h3.3"></path>
                    <path d="M15.5 3.5h3.3c.9 0 1.7.8 1.7 1.7v3.3"></path>
                    <path d="M20.5 15.5v3.3c0 .9-.8 1.7-1.7 1.7h-3.3"></path>
                    <path d="M8.5 20.5H5.2c-.9 0-1.7-.8-1.7-1.7v-3.3"></path>
                    <path d="M3.5 12h17"></path>
                </svg>
            </button>
            <button aria-label="我的二维码" class="icon-btn" onclick="showToast('我的二维码')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#3a4a4a" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M3 3h7v7H3V3Zm2 2v3h3V5H5Z"></path>
                    <path fill-rule="evenodd" d="M14 3h7v7h-7V3Zm2 2v3h3V5h-3Z"></path>
                    <path fill-rule="evenodd" d="M3 14h7v7H3v-7Zm2 2v3h3v-3H5Z"></path>
                    <path d="M14 14h3v3h-3zM18 14h3v3h-3zM14 18h3v3h-3zM18 18h3v3h-3z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main id="mainArea">
        <!-- 信息 -->
        <section class="panel active" id="panelRecent">
            <a class="chat-card" href="room_chat.html?from=message_center">
                <div class="chat-avatar">
                    <img alt="小鹿" src="assets/v2/processed/小鹿头像.png"/>
                    <span class="chat-badge">1</span>
                </div>
                <div class="chat-info">
                    <div class="chat-name">小鹿</div>
                    <div class="chat-preview">Hi,看到你的简历，很感兴趣，希望能再深入</div>
                </div>
            </a>
        </section>

        <!-- 群聊 -->
        <section class="panel" id="panelGroup">
            <div class="chat-card">
                <div class="chat-avatar">
                    <img class="square" alt="小鹿" src="assets/v2/processed/蜡笔小新全家福.png"/>
                    <span class="chat-badge">1</span>
                </div>
                <div class="chat-info">
                    <div class="chat-name">小鹿</div>
                    <div class="chat-preview">这次可以了</div>
                </div>
            </div>
        </section>

        <!-- 通讯录 -->
        <section class="panel" id="panelContacts">
            <div class="contacts-top">
                <div class="search-field">
                    <input type="text" placeholder=""/>
                    <img alt="搜索" src="assets/v2/icon/search-teal.svg"/>
                </div>
                <button class="pill selected" onclick="selectPill(this)">全部</button>
                <button class="pill" onclick="selectPill(this)">在线</button>
            </div>

            <div class="new-friends">
                <div class="nf-title">新的朋友</div>
                <div class="nf-divider"></div>
                <div class="nf-row">
                    <img class="nf-avatar" alt="小鹿" src="assets/v2/processed/精灵公主头像.png"/>
                    <span class="nf-name">小鹿</span>
                    <span class="nf-desc">请求加为好友</span>
                    <button class="btn-reject" onclick="showToast('已拒绝')">拒绝</button>
                    <button class="btn-accept" onclick="showToast('已通过')">通过</button>
                </div>
            </div>

            <div class="contact-list">
                <div class="contact-row">
                    <img class="contact-avatar" alt="七七" src="assets/v2/processed/明日香头像.png"/>
                    <span class="contact-name">七七</span>
                    <div class="contact-badges">
                        <img alt="VIP" src="assets/v2/vip/cat-entertainment.png"/>
                        <img alt="个人名片" src="assets/v2/card/idcard.png"/>
                        <img alt="房间" src="assets/v2/processed/小房子气泡-橙色.png"/>
                        <img alt="TV" src="assets/v2/processed/金色相机-水晶球.png"/>
                    </div>
                </div>
                <div class="contact-row">
                    <img class="contact-avatar" alt="小鹿" src="assets/v2/processed/精灵公主头像.png"/>
                    <span class="contact-name">小鹿</span>
                    <div class="contact-badges">
                        <img alt="VIP" src="assets/v2/vip/cat-tech.png"/>
                        <img alt="个人名片" src="assets/v2/card/idcard.png"/>
                        <img alt="TV" src="assets/v2/processed/金色相机-水晶球.png"/>
                    </div>
                </div>
                <div class="contact-row">
                    <img class="contact-avatar" alt="卓越红星" src="assets/v2/processed/春丽头像.png"/>
                    <span class="contact-name">卓越红星</span>
                    <div class="contact-badges">
                        <img alt="VIP" src="assets/v2/vip/cat-education.png"/>
                        <img alt="公司名片" src="assets/v2/card/company-idcard.png"/>
                    </div>
                </div>
                <div class="contact-row">
                    <img class="contact-avatar" alt="星河" src="assets/v2/processed/碇真嗣头像.png"/>
                    <span class="contact-name offline">星河</span>
                    <div class="contact-badges">
                        <img alt="VIP" src="assets/v2/vip/cat-charity.png"/>
                        <img alt="个人名片" src="assets/v2/card/idcard.png"/>
                    </div>
                </div>
            </div>

            <div class="az-index" id="azIndex"></div>
        </section>
    </main>

    <!-- 底部 Tab -->
    <nav class="msg-tabs">
        <button class="msg-tab active" data-target="panelRecent" data-title="信息中心" data-actions="chat" onclick="switchPanel(this)">

<div class="scan-modal" id="scanModal">
    <div class="scan-topbar">
        <button aria-label="关闭" class="scan-close" onclick="closeQrScan()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
        </button>
        <span class="scan-title">扫一扫</span>
    </div>
    <div class="scan-stage">
        <div class="scan-frame"><i></i><i></i><i></i><i></i></div>
        <div class="scan-line"></div>
        <div class="scan-success">
            <span class="scan-success-circle">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.5 12.5l5 5 10-11"></path>
                </svg>
            </span>
            <span>扫描成功</span>
        </div>
    </div>
    <div class="scan-hint">将二维码放入框内，即可自动扫描</div>
</div>

<script>
    (function buildIndex() {
        const el = document.getElementById('azIndex')
        if (!el) return
        const letters = []
        for (let i = 65; i <= 90; i++) letters.push(String.fromCharCode(i))
        el.innerHTML = letters.map(l => '<div>' + l + '</div>').join('')
    })()

    function switchPanel(button) {
        document.querySelectorAll('.msg-tab').forEach(tab => tab.classList.remove('active'))
        button.classList.add('active')
        document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'))
        document.getElementById(button.dataset.target).classList.add('active')
        document.getElementById('pageTitle').textContent = button.dataset.title
        const actions = button.dataset.actions
        document.getElementById('actionsChat').classList.toggle('hidden', actions !== 'chat')
        document.getElementById('actionsContacts').classList.toggle('hidden', actions !== 'contacts')
        document.getElementById('mainArea').scrollTop = 0
    }

    (function applyHash() {
        const hash = (location.hash || '').replace('#', '')
        const map = { group: 'panelGroup', contacts: 'panelContacts' }
        const target = map[hash]
        if (target) {
            document.querySelector('.msg-tab[data-target="' + target + '"]').click()
        }
    })()

    function selectPill(button) {
        button.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'))
        button.classList.add('selected')
    }

    function showToast(message) {
        let toast = document.getElementById('pageToast')
        if (!toast) {
            toast = document.createElement('div')
            toast.id = 'pageToast'
            toast.style.cssText =
                'position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:8px 16px;border-radius:6px;z-index:999;'
            document.body.appendChild(toast)
        }
        toast.textContent = message
        toast.style.display = 'block'
        clearTimeout(toast._timer)
        toast._timer = setTimeout(() => (toast.style.display = 'none'), 1800)
    }

    function showAddFriendModal() {
        document.getElementById('addFriendModal').classList.add('open')
    }

    function hideAddFriendModal() {
        document.getElementById('addFriendModal').classList.remove('open')
        document.getElementById('addFriendInput').value = ''
    }

    function searchAddFriend() {
        const value = document.getElementById('addFriendInput').value.trim()
        if (!value) {
            showToast('请输入手机号或名称')
            return
        }
        hideAddFriendModal()
        showToast('查找：' + value)
    }

    let qrScanTimer = null
    let qrDoneTimer = null

    function startQrScan() {
        hideAddFriendModal()
        const modal = document.getElementById('scanModal')
        modal.classList.add('open')
        modal.classList.remove('done')
        clearTimeout(qrScanTimer)
        clearTimeout(qrDoneTimer)
        qrScanTimer = setTimeout(function () {
            modal.classList.add('done')
            qrDoneTimer = setTimeout(closeQrScan, 1200)
        }, 2000)
    }

    function closeQrScan() {
        clearTimeout(qrScanTimer)
        clearTimeout(qrDoneTimer)
        document.getElementById('scanModal').classList.remove('open', 'done')
    }

    if (location.hash === '#addFriend') {
        showAddFriendModal()
    }
</script>
<script src="assets/vendor/back.js"></script>
<script>
    BackLayers.register({ isOpen: function () { return document.getElementById('addFriendModal').classList.contains('open'); }, close: hideAddFriendModal });
    BackLayers.register({ isOpen: function () { return document.getElementById('scanModal').classList.contains('open'); }, close: closeQrScan });
</script>
