<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>消息中心</title>
    <script src="assets/vendor/tailwindcss.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
    <style>
      body {
        background-color: #f3f4f6;
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, sans-serif;
      }
      .app-container {
        width: 100%;
        height: 100dvh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: white;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      }
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        border-radius: 0 !important;
        box-sizing: border-box;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 0;
        background: transparent;
        padding: 0;
        color: inherit;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .avatar {
        border-radius: 9999px !important;
        display: block;
        object-fit: cover;
        flex: none;
        border: 1px solid #e6f9fc;
        background: #f2fcfd;
      }
      .group-avatar {
        width: 48px;
        height: 48px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 2px;
        padding: 2px;
        flex: none;
        border: 1px solid #e5e7eb;
        background: #f3f4f6;
      }
      .group-avatar img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .flex {
        display: flex;
      }
      .block {
        display: block;
      }
      .hidden {
        display: none;
      }
      .items-center {
        align-items: center;
      }
      .items-start {
        align-items: flex-start;
      }
      .justify-center {
        justify-content: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .min-h-screen {
        min-height: 100dvh;
      }
      .relative {
        position: relative;
      }
      .absolute {
        position: absolute;
      }
      .right-0 {
        right: 0;
      }
      .top-0 {
        top: 0;
      }
      .shrink-0 {
        flex-shrink: 0;
      }
      .flex-1 {
        flex: 1 1 0%;
      }
      .min-w-0 {
        min-width: 0;
      }
      .gap-2 {
        gap: 0.5rem;
      }
      .gap-3 {
        gap: 0.75rem;
      }
      .p-1 {
        padding: 0.25rem;
      }
      .p-3 {
        padding: 0.75rem;
      }
      .p-4 {
        padding: 1rem;
      }
      .px-2 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
      .px-3 {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
      .px-4 {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      .py-0\.5 {
        padding-top: 0.125rem;
        padding-bottom: 0.125rem;
      }
      .py-2 {
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }
      .mt-0\.5 {
        margin-top: 0.125rem;
      }
      .mt-1 {
        margin-top: 0.25rem;
      }
      .mb-2 {
        margin-bottom: 0.5rem;
      }
      .w-1\.5 {
        width: 0.375rem;
      }
      .h-1\.5 {
        height: 0.375rem;
      }
      .w-8 {
        width: 2rem;
      }
      .h-8 {
        height: 2rem;
      }
      .w-10 {
        width: 2.5rem;
      }
      .h-10 {
        height: 2.5rem;
      }
      .w-12 {
        width: 3rem;
      }
      .h-12 {
        height: 3rem;
      }
      .h-11 {
        height: 2.75rem;
      }
      .h-14 {
        height: 3.5rem;
      }
      .w-full {
        width: 100%;
      }
      .overflow-y-auto {
        overflow-y: auto;
      }
      .overflow-hidden {
        overflow: hidden;
      }
      .border {
        border-width: 1px;
        border-style: solid;
      }
      .border-b {
        border-bottom-width: 1px;
        border-bottom-style: solid;
      }
      .border-t {
        border-top-width: 1px;
        border-top-style: solid;
      }
      .border-gray-100 {
        border-color: #f3f4f6;
      }
      .border-gray-200 {
        border-color: #e5e7eb;
      }
      .border-gray-300 {
        border-color: #d1d5db;
      }
      .border-[#4dd0e1] {
        border-color: #26c6da;
      }
      .bg-white {
        background-color: #fff;
      }
      .bg-gray-50 {
        background-color: #f9fafb;
      }
      .bg-gray-100 {
        background-color: #f3f4f6;
      }
      .bg-[#f2fcfd] {
        background-color: #f2fcfd;
      }
      .bg-[#26c6da] {
        background-color: #26c6da;
      }
      .bg-green-500 {
        background-color: #22c55e;
      }
      .text-white {
        color: #fff;
      }
      .text-[#26c6da] {
        color: #26c6da;
      }
      .text-gray-400 {
        color: #9ca3af;
      }
      .text-gray-500 {
        color: #6b7280;
      }
      .text-gray-600 {
        color: #4b5563;
      }
      .text-gray-900 {
        color: #111827;
      }
      .text-xs {
        font-size: 0.75rem;
        line-height: 1rem;
      }
      .text-sm {
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .text-base {
        font-size: 1rem;
        line-height: 1.5rem;
      }
      .text-\[10px\] {
        font-size: 10px;
        line-height: 14px;
      }
      .text-\[11px\] {
        font-size: 11px;
        line-height: 15px;
      }
      .font-bold {
        font-weight: 700;
      }
      .leading-tight {
        line-height: 1.25;
      }
      .leading-relaxed {
        line-height: 1.625;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .text-left {
        text-align: left;
      }
      .shadow-2xl {
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
      .tab-active {
        color: #26c6da;
        border-bottom: 2px solid #26c6da;
        font-weight: 700;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .category-children {
        display: none;
      }
      .category.open .category-children {
        display: block;
      }
      .category.open .chevron {
        transform: rotate(90deg);
      }
      /* ====== 底部 Tab ====== */
      .msg-tab {
        color: var(--ink-500);
        gap: 2px;
      }
      .msg-tab-text {
        font-size: 10px;
        line-height: 1.2;
      }
      .msg-tab.active {
        color: var(--brand-deep);
      }
      .msg-tab.active .msg-tab-text {
        font-weight: 700;
      }
      .msg-tab-badge {
        position: absolute;
        top: -5px;
        right: -12px;
        min-width: 15px;
        height: 15px;
        padding: 0 3px;
        background: #ff4d4f;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        border-radius: 8px !important;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 1.5px #fff;
      }
      /* ====== 会话卡片 ====== */
      main .panel > a,
      .category-children > a {
        margin: 8px 12px;
        padding: 12px;
        border: 1px solid var(--brand-line) !important;
        border-radius: 8px !important;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #fff;
        position: relative;
      }
      main .panel > a .avatar,
      .category-children > a .avatar {
        border-radius: 9999px !important;
      }
      .msg-row-badge {
        position: absolute;
        left: 6px;
        top: 6px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        background: #ff4d4f;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        border-radius: 8px !important;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 1.5px #fff;
        z-index: 2;
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen">
    <div class="app-container shadow-2xl">
      <header class="p-4 flex items-center topbar shrink-0">
        <button
          aria-label="返回"
          class="w-8 h-8 flex items-center justify-center text-white"
          onclick="window.location.href='announcements.html'"
        >
          <svg
            fill="none"
            height="24"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            width="24"
          >
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </button>
        <h1 class="flex-1 text-center font-bold text-base text-white">信息中心</h1>
        <div class="flex items-center gap-1">
          <button
            aria-label="搜索"
            class="w-8 h-8 flex items-center justify-center text-white"
            onclick="showSearch()"
          >
            <svg
              fill="none"
              height="21"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              width="21"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.8-3.8"></path>
            </svg>
          </button>
          <button
            aria-label="添加好友"
            class="w-8 h-8 flex items-center justify-center text-white"
            onclick="showToast('添加好友')"
          >
            <svg
              fill="none"
              height="22"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              width="22"
            >
              <circle cx="9" cy="8" r="3.2"></circle>
              <path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path>
              <path d="M18 8v6M15 11h6"></path>
            </svg>
          </button>
        </div>
      </header>

      <div
        class="px-4 py-2 border-b border-gray-100 bg-white hidden"
        id="searchBar"
      >
        <div class="h-11 border border-gray-300 flex items-center px-3 gap-2">
          <svg
            fill="none"
            height="18"
            stroke="#9ca3af"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            width="18"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.8-3.8"></path>
          </svg>
          <input
            class="flex-1 text-sm"
            style="border: 0; outline: 0"
            placeholder="搜索群、分类或联系人"
          />
        </div>
      </div>

      <main class="flex-1 overflow-y-auto bg-white">
        <section class="panel active" id="recentPanel">
          <a
            class="p-4 border-b border-gray-100 flex items-center gap-3 text-left"
            href="room_chat.html?from=message_center"
          >
            <img
              class="avatar w-12 h-12"
              alt="小鹿"
              src="assets/v2/processed/精灵公主头像.png"
            />
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <span class="flex items-center gap-1.5 min-w-0">
                  <span
                    class="flex-none"
                    style="
                      display: inline-flex;
                      align-items: center;
                      justify-content: center;
                      min-width: 16px;
                      height: 16px;
                      padding: 0 4px;
                      background: #ff4d4f;
                      color: #fff;
                      font-size: 10px;
                      font-weight: 700;
                      border-radius: 9999px !important;
                    "
                    >1</span
                  >
                  <h2 class="text-sm font-bold text-gray-900 truncate">小鹿</h2>
                </span>
                <span class="text-[10px] text-gray-400">11:52</span>
              </div>
              <p class="text-xs text-gray-500 truncate mt-1">
                Hi,看到你的简历，很感兴趣，希望能再深入了解一下
              </p>
            </div>
          </a>
        </section>
        <section class="panel" id="groupPanel">
          <div
            class="px-4 py-2 bg-gray-50 border-b border-gray-100 text-[11px] text-gray-400"
          ></div>
          <a
            class="p-4 border-b border-gray-100 flex items-center gap-3 text-left"
            href="group_create.html"
          >
            <div
              class="w-12 h-12 bg-[#f2fcfd] flex items-center justify-center shrink-0"

                height="22"

                stroke-linecap="round"
                stroke-linejoin="round"

              <img alt="成员头像" src="assets/v2/processed/碇真嗣头像.png" />
            </div>
            <div class="flex-1 min-w-0">

                <span

          </a>
          <a
            class="p-4 border-b border-gray-100 flex items-center gap-3 text-left"
            href="group_settings.html?from=message_center"
          >
            <div class="group-avatar" aria-label="家庭周末安排群头像">

            </div>
          </a>

              <img alt="成员头像" src="assets/v2/processed/汉库克坐姿.png" />
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-bold text-gray-900 truncate">
                  小商品批发合作群
                </h2>
                <span
                  class="px-2 py-0.5 bg-gray-50 text-gray-600 text-[10px] font-bold border border-gray-200"
                  >业务群</span
                >
              </div>
              <p class="text-xs text-gray-500 truncate mt-1">34 人</p>
            </div>
          </a>
        </section>

            class="px-4 py-2 bg-gray-50 border-b border-gray-100 text-[11px] text-gray-400"

            </div>
          </div>
          <div class="category border-b border-gray-100">
            <button
              class="w-full p-4 flex items-center justify-between text-left"
              onclick="toggleCategory(this)"
            >
              <span>
                <span class="block text-sm font-bold text-gray-900"
                  >社会朋友</span
                >
                <span class="block text-[11px] text-gray-400 mt-0.5"
                  >15个联系人</span
                >
              </span>
              <svg
                class="chevron"
                fill="none"
                height="16"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
                width="16"
              >
                <path d="M9 18l6-6-6-6"></path>
              </svg>
            </button>
            <div class="category-children bg-gray-50">
              <a
                class="px-4 py-2 border-t border-gray-100 flex items-center gap-3"
                href="room_chat.html?from=message_center"
              >
                <img
                  class="avatar w-10 h-10"
                  alt="邓猛"
                  src="assets/packaged/src/generated_avatars/avatar-05.png"
                />
                <span class="flex-1 min-w-0"
                  ><span class="block text-sm font-bold text-gray-900 truncate"
                    >邓猛老车朋友</span
                  ><span class="block text-[11px] text-gray-400 truncate"
                    >老朋友，车友活动联系人</span
                  ></span
                >
              </a>
            </div>
          </div>
        </section>
      </main>

      <!-- 底部 Tab：信息 / 群聊 / 通讯录 -->
      <nav
        class="h-[58px] flex-none bg-white border-t border-[#e6f2f4] flex items-stretch shrink-0"
        id="msgBottomTabs"
      >
        <button
          class="msg-tab active flex-1 flex flex-col items-center justify-center"
          data-target="recentPanel"
          onclick="switchPanel(this)"
        >
          <span class="relative flex">
            <svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22">
              <path d="M20.5 11.6c0 4.2-3.8 7.6-8.5 7.6-.9 0-1.8-.1-2.6-.4L4.5 20.5l1-3.3A7.3 7.3 0 0 1 3.5 11.6C3.5 7.4 7.3 4 12 4s8.5 3.4 8.5 7.6Z"></path>
              <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"></path>
            </svg>
            <span class="msg-tab-badge">1</span>
          </span>
          <span class="msg-tab-text">信息</span>
        </button>
        <button
          class="msg-tab flex-1 flex flex-col items-center justify-center"
          data-target="groupPanel"
          onclick="switchPanel(this)"
        >
          <span class="relative flex">
            <svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22">
              <circle cx="9" cy="8" r="3.2"></circle>
              <path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path>
              <path d="M16 5.6a3 3 0 0 1 0 5.4"></path>
              <path d="M18.5 19c0-2.2-.9-3.9-2.3-5"></path>
            </svg>
            <span class="msg-tab-badge">1</span>
          </span>
          <span class="msg-tab-text">群聊</span>
        </button>
        <button
          class="msg-tab flex-1 flex flex-col items-center justify-center"
          data-target="categoryPanel"
          onclick="window.location.href = 'my_contacts.html'"
        >
          <span class="relative flex">
            <svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24" width="22">
              <rect height="18" rx="2" width="15" x="5" y="3"></rect>
              <path d="M5 8H3.5M5 12H3.5M5 16H3.5"></path>
              <circle cx="12.5" cy="10" r="2.2"></circle>
              <path d="M9 16.2c.8-1.6 2-2.4 3.5-2.4s2.7.8 3.5 2.4"></path>
            </svg>
            <span class="msg-tab-badge">1</span>
          </span>
          <span class="msg-tab-text">通讯录</span>
        </button>
      </nav>
    </div>

    <script>
      function switchPanel(button) {
        document
          .querySelectorAll('#msgBottomTabs .msg-tab')
          .forEach(tab => tab.classList.remove('active'))
        button.classList.add('active')
        document
          .querySelectorAll('.panel')
          .forEach(panel => panel.classList.remove('active'))
        document.getElementById(button.dataset.target).classList.add('active')
      }

      function showToast(message) {
        let toast = document.getElementById('pageToast')
        if (!toast) {
          toast = document.createElement('div')
          toast.id = 'pageToast'
          toast.style.cssText =
            'position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:8px 16px;border-radius:6px;z-index:999;'
          document.body.appendChild(toast)
        }
        toast.textContent = message
        toast.style.display = 'block'
        clearTimeout(toast._timer)
        toast._timer = setTimeout(() => (toast.style.display = 'none'), 1800)
      }

      function toggleCategory(button) {
        button.closest('.category').classList.toggle('open')
      }

      function showSearch() {
        document.getElementById('searchBar').classList.toggle('hidden')
      }
    </script>
  </body>
</html>
