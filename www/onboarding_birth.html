<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>引导页 - 出生年份</title>
<script src="assets/vendor/tailwindcss.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<style>
        body {
            width: 100%;
            height: 100dvh;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
            padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        }
        .birth-input {
            width: 264px;
            height: 64px;
            background-color: #ffffff;
            border: 2px solid #e2eef1;
            border-radius: 12px;
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: #17313a;
            letter-spacing: 8px;
            padding-left: 8px;
            outline: none;
            transition: border-color 0.2s;
            caret-color: var(--brand-strong);
        }
        .birth-input::placeholder {
            font-size: 15px;
            font-weight: 400;
            color: #9fb3b9;
            letter-spacing: 0;
        }
        .birth-input:focus,
        .birth-input.filled {
            border-color: var(--brand-strong);
        }
    </style>
</head>
<body class="flex flex-col">
<!-- 顶部：返回 + 跳过 -->
<div class="flex items-center justify-between px-5 pt-3 shrink-0" style="padding-top: calc(var(--safe-area-inset-top, 0px) + 12px)">
<button class="text-[#9fb3b9] text-2xl leading-none" onclick="history.back()">‹</button>
<a class="text-[13px] text-[#9fb3b9] px-4 py-1.5 rounded-full bg-[#f2f7f8]" href="onboarding_interests.html">跳过</a>
</div>
<!-- 主内容区 -->
<div class="flex-1 min-h-0 overflow-y-auto px-8 pt-10">
<h1 class="text-[28px] font-bold title-brand leading-snug tracking-wide">
                告诉我们<br/>你的出生年份
            </h1>
<!-- 年份输入（调用系统数字键盘） -->
<div class="flex justify-center mt-10">
<input
  aria-label="出生年份"
  autocomplete="off"
  autofocus
  class="birth-input"
  enterkeyhint="done"
  id="birth-input"
  inputmode="numeric"
  maxlength="4"
  pattern="[0-9]*"
  placeholder="请输入 4 位出生年份"
  type="tel"
/>
</div>
</div>
<!-- 底部操作栏 -->
<div class="px-8 py-6 flex items-center justify-center shrink-0">
<button class="btn-brand text-base px-12 py-3" disabled="" id="submit-btn" onclick="location.href='onboarding_interests.html'">
            下一步
        </button>
</div>
<script>
        const birthInput = document.getElementById('birth-input')
        const submitBtn = document.getElementById('submit-btn')

        function updateState() {
            birthInput.value = birthInput.value.replace(/\D/g, '').slice(0, 4)
            birthInput.classList.toggle('filled', birthInput.value.length > 0)
            submitBtn.disabled = birthInput.value.length !== 4
        }

        birthInput.addEventListener('input', updateState)
        birthInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !submitBtn.disabled) submitBtn.click()
        })
        birthInput.focus()
        updateState()
    </script>
<script src="assets/vendor/back.js"></script>
</body></html>
