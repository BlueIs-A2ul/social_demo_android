<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>引导页 - 出生年份</title>
<script src="assets/vendor/tailwindcss.js"></script>
<style>
        body {
            width: 100%;
            height: 100dvh;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
            padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        }
        .key-btn {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 64px;
            transition: all 0.1s;
        }
        .key-btn:active {
            background-color: #f3f4f6;
            transform: scale(0.98);
        }
        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #ec4899;
            transition: all 0.2s;
        }
        .dot.filled {
            background-color: #ec4899;
        }
    </style>
</head>
<body class="flex flex-col">
<!-- 主内容区 -->
<div class="flex-1 px-8 pt-12">
<div class="flex justify-between items-start mb-16">
<h1 class="text-3xl font-bold text-[#ec4899] leading-relaxed tracking-wider">
                告诉我<br/>你的出生年份
            </h1>
<div class="text-[#ec4899] mt-2">
<svg fill="none" height="40" viewbox="0 0 60 40" width="60" xmlns="http://www.w3.org/2000/svg">
<circle cx="30" cy="20" fill="#ec4899" fill-opacity="0.2" r="14"></circle>
<circle cx="30" cy="20" fill="#ec4899" r="10"></circle>
<ellipse cx="30" cy="20" rx="28" ry="6" stroke="#333333" stroke-width="1.5" transform="rotate(-15, 30, 20)"></ellipse>
</svg>
</div>
</div>
<!-- 输入进度点 -->
<div class="flex justify-center gap-8 mb-20">
<div class="dot rounded-none" id="dot-0"></div>
<div class="dot rounded-none" id="dot-1"></div>
<div class="dot rounded-none" id="dot-2"></div>
<div class="dot rounded-none" id="dot-3"></div>
</div>
<!-- 数字键盘 -->
<div class="grid grid-cols-3 gap-3">
<button class="key-btn" onclick="addDigit('1')">1</button>
<button class="key-btn" onclick="addDigit('2')">2</button>
<button class="key-btn" onclick="addDigit('3')">3</button>
<button class="key-btn" onclick="addDigit('4')">4</button>
<button class="key-btn" onclick="addDigit('5')">5</button>
<button class="key-btn" onclick="addDigit('6')">6</button>
<button class="key-btn" onclick="addDigit('7')">7</button>
<button class="key-btn" onclick="addDigit('8')">8</button>
<button class="key-btn" onclick="addDigit('9')">9</button>
<div class="h-16"></div>
<button class="key-btn" onclick="addDigit('0')">0</button>
<button class="key-btn" onclick="removeDigit()">
<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 4H8l-7 8 7 8h13V4z"></path>
<line x1="18" x2="12" y1="9" y2="15"></line>
<line x1="12" x2="18" y1="9" y2="15"></line>
</svg>
</button>
</div>
</div>
<!-- 底部操作栏 -->
<div class="h-24 px-8 flex items-center justify-between shrink-0">
<a class="text-gray-400 font-medium" href="onboarding_interests.html">跳过</a>
<button class="bg-gray-200 text-white px-12 py-3 text-lg font-bold transition-colors" disabled="" id="submit-btn" onclick="location.href='onboarding_interests.html'">
            提交
        </button>
</div>
<script>
        let digits = "";
        const submitBtn = document.getElementById('submit-btn');

        function addDigit(d) {
            if (digits.length < 4) {
                digits += d;
                updateDots();
            }
        }

        function removeDigit() {
            if (digits.length > 0) {
                digits = digits.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < digits.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }

            if (digits.length === 4) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-gray-200');
                submitBtn.classList.add('bg-[#ec4899]');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('bg-gray-200');
                submitBtn.classList.remove('bg-[#ec4899]');
            }
        }
    </script>
</body>
</html>
