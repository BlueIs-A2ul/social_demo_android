<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>与小鹿的聊天 - 智慧空间</title>
<script src="assets/vendor/tailwindcss.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<script src="assets/vendor/nav.js"></script>
<script>
    (function () {
        try {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'setBottomNav', visible: false }, '*')
            }
        } catch (e) {}
    })();
</script>
<style>
    :root {
        --teal: #56C2CE;
        --teal-line: #ABE1E8;
        --bubble-line: #D4F0F4;
        --teal-glow: rgba(171, 225, 232, 1);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
    }
    ::-webkit-scrollbar { display: none; }
    button { font: inherit; border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; }
    .app-container {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #fff;
        overflow: hidden;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    }
    .topbar {
        flex: none;
        height: 44px;
        background: var(--teal);
        display: flex;
        align-items: center;
        padding: 0 6px;
        color: #fff;
    }
    .topbar .icon-btn {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
    }
    .topbar h1 {
        flex: 1;
        margin: 0;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
    }
    .topbar .icon-spacer { width: 36px; flex: none; }

    .chat-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 12px 16px 48px;
    }
    .msg-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; }
    .msg-row.me { flex-direction: row-reverse; }
    .msg-avatar {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        object-fit: cover;
        flex: none;
        margin-top: 7px;
    }
    .msg-row.me .msg-avatar { margin-top: 0; }
    .msg-main { min-width: 0; max-width: 78%; }
    .msg-name { font-size: 13px; line-height: 20px; color: #6B7280; }
    .bubble {
        position: relative;
        font-size: 14px;
        line-height: 20px;
        color: #333;
        padding: 8px 10px;
        border-radius: 6px;
        word-break: break-word;
    }
    .bubble.other {
        background: #fff;
        border: 1px solid var(--bubble-line);
    }
    .bubble.me {
        background: var(--teal);
        border: 1px solid var(--bubble-line);
        color: #fff;
    }
    .bubble .tail {
        position: absolute;
        top: 10px;
        width: 9px;
        height: 14px;
        display: block;
    }
    .bubble.other .tail { left: -9px; }
    .bubble.me .tail { right: -9px; }

    .chat-input-bar {
        flex: none;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 1px 6px var(--teal-glow);
        height: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 15px 0 25px;
    }
    .chat-input-bar .field {
        flex: 1;
        min-width: 0;
        height: 37px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        background: #fff;
        border: 1px solid var(--teal-line);
        border-radius: 19px;
        box-shadow: 0 0 4px rgba(171, 225, 232, 0.7);
    }
    .chat-input-bar input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        font-size: 13px;
        background: transparent;
    }
    .chat-input-bar .send-btn { width: 22px; height: 22px; flex: none; display: flex; }
    .chat-input-bar .send-btn img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="app-container">
    <header class="topbar">
        <button aria-label="返回" class="icon-btn" onclick="goBack('message_center.html', {message_center: 'message_center.html', owner_profile: 'owner_profile.html', square: 'square.html'})">
            <svg width="9" height="17" viewBox="0 0 9 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.80578052719351 8.50370982382574 L 8.97338443919557 0.991619997177496 L 8.10342780198317 0.0797946369688453 L 0.0672535821171025 8.50426177111519 L 8.10342780198317 16.9277618170732 L 8.97338443919557 16.0159576720417 L 1.80578052719351 8.50370982382574 Z" fill="currentColor"/>
            </svg>
        </button>
        <h1>与小鹿的聊天</h1>
        <span class="icon-spacer"></span>
    </header>

    <div class="chat-body" id="chatBody">
        <div class="msg-row">
            <img class="msg-avatar" alt="小鹿" src="assets/v2/processed/小鹿头像.png"/>
            <div class="msg-main">
                <div class="msg-name">小鹿</div>
                <div class="bubble other">
                    Hi,看到你的简历，很感兴趣，希望能再深入了解一下
                    <svg class="tail" viewBox="0 0 9 14" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 0 L0 7 L9 14 Z" fill="#fff" stroke="#D4F0F4" stroke-width="1"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="msg-row me">
            <img class="msg-avatar" alt="我" src="assets/v2/processed/聊天男生头像.png"/>
            <div class="msg-main">
                <div class="bubble me">
                    好的，稍后发给您简历。
                    <svg class="tail" viewBox="0 0 9 14" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 0 L9 7 L0 14 Z" fill="#56C2CE" stroke="#D4F0F4" stroke-width="1"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-input-bar">
        <div class="field">
            <input id="chatInput" type="text" placeholder=""/>
        </div>
        <button aria-label="发送" class="send-btn" onclick="sendChatMessage()">
            <img alt="发送" src="assets/v2/icon/send-plane.svg"/>
        </button>
    </div>
</div>

<script>
    function sendChatMessage() {
        const input = document.getElementById('chatInput')
        const text = (input.value || '').trim()
        if (!text) return
        const body = document.getElementById('chatBody')
        const row = document.createElement('div')
        row.className = 'msg-row me'
        row.innerHTML =
            '<img class="msg-avatar" alt="我" src="assets/v2/processed/聊天男生头像.png"/>' +
            '<div class="msg-main">' +
            '<div class="bubble me"></div>' +
            '</div>'
        const bubble = row.querySelector('.bubble')
        bubble.textContent = text
        bubble.insertAdjacentHTML(
            'beforeend',
            '<svg class="tail" viewBox="0 0 9 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 0 L9 7 L0 14 Z" fill="#56C2CE" stroke="#D4F0F4" stroke-width="1"/></svg>'
        )
        body.appendChild(row)
        input.value = ''
        body.scrollTop = body.scrollHeight
    }
</script>
</body>
</html>
