      const detailDefaults = {
        authorAvatar: document.getElementById('detail-author-avatar').src,
        author: document.getElementById('detail-author').innerHTML,
        time: document.getElementById('detail-time').innerHTML,
        desc: document.getElementById('detail-desc').innerHTML,
        body: document.getElementById('detail-body').innerHTML,
        tags: document.getElementById('detail-tags').innerHTML,
      }

      let currentDetailIndex = -1

      function renderDetail(index) {
        const data = feedData[index]
        if (!data) {
          showToast('内容不存在')
          setTimeout(function () {
            window.location.href = 'publish.html'
          }, 1000)
          return
        }
        currentDetailIndex = index

        const isSeries = Array.isArray(data.images) && data.images.length > 0
        const images = isSeries ? data.images : [data.img]
        document.getElementById('detail-images').innerHTML = images
          .map(src =>
            isSeries
              ? `<img alt="动态图片" class="w-full block bg-gray-50" src="${src}" />`
              : `<img alt="动态图片" class="w-full h-[280px] object-contain bg-gray-50 block" src="${src}" />`,
          )
          .join('')

        document.getElementById('detail-title').innerText = data.title
        document.getElementById('detail-author-avatar').src =
          data.authorAvatar || detailDefaults.authorAvatar
        document.getElementById('detail-author').innerHTML =
          data.author || detailDefaults.author
        document.getElementById('detail-time').innerHTML =
          data.time || detailDefaults.time
        document.getElementById('detail-desc').innerHTML =
          data.desc || detailDefaults.desc
        document.getElementById('detail-body').innerHTML =
          data.body || detailDefaults.body
        document.getElementById('detail-tags').innerHTML = data.tags
          ? data.tags
              .map(
                t =>
                  `<span class="text-[12px] text-[#26c6da] cursor-pointer">#${t}</span>`,
              )
              .join(' ')
          : detailDefaults.tags

        updateDetailLike()
        updateDetailFavBtn()

        if (window.HistoryFavorites) {
          window.HistoryFavorites.addHistory({
            id: 'share_' + index,
            source: 'share',
            data: {
              title: data.title,
              img: data.img,
              images: data.images,
              author: data.author,
              authorAvatar: data.authorAvatar,
              time: data.time,
              desc: data.desc,
              body: data.body,
              tags: data.tags,
            },
          })
        }
      }

      const detailLikeBase = 12

      function updateDetailLike() {
        if (currentDetailIndex < 0) return
        const liked = localStorage.getItem('detailLike_' + currentDetailIndex) === '1'
        const icon = document.getElementById('detail-like-icon')
        const count = document.getElementById('detail-like-count')
        icon.src = liked
          ? 'assets/src_01/icon/互动/点赞-active.png'
          : 'assets/src_01/icon/互动/点赞.png'
        count.textContent = detailLikeBase + (liked ? 1 : 0)
      }

      function toggleDetailLike() {
        if (currentDetailIndex < 0) return
        const key = 'detailLike_' + currentDetailIndex
        const liked = localStorage.getItem(key) === '1'
        localStorage.setItem(key, liked ? '0' : '1')
        updateDetailLike()
        showToast(liked ? '已取消点赞' : '已点赞')
      }

      function updateDetailFavBtn() {
        if (currentDetailIndex < 0) return
        const fav = localStorage.getItem('detailFav_' + currentDetailIndex) === '1'
        const icon = document.getElementById('detail-fav-icon')
        icon.src = fav
          ? 'assets/src_01/icon/互动/收藏-active.png'
          : 'assets/src_01/icon/互动/收藏.png'
      }

      function toggleDetailFavorite() {
        if (currentDetailIndex < 0) return
        const key = 'detailFav_' + currentDetailIndex
        const fav = localStorage.getItem(key) === '1'
        localStorage.setItem(key, fav ? '0' : '1')
        updateDetailFavBtn()
        showToast(fav ? '已取消收藏' : '已收藏')
      }

      function showToast(msg) {
        const toast = document.getElementById('toast')
        toast.innerText = msg
        toast.classList.add('show')
        setTimeout(() => {
          toast.classList.remove('show')
        }, 2000)
      }

      document
        .getElementById('comment-input')
        .addEventListener('keydown', e => {
          if (e.key === 'Enter') showToast('评论已发布')
        })

      const index = parseInt(
        new URLSearchParams(window.location.search).get('index'),
        10,
      )
      renderDetail(isNaN(index) ? -1 : index)
