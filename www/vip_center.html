<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VIP介绍 - 智慧空间</title>
<script src="assets/vendor/tailwindcss.js"></script>
<script src="assets/vendor/iconify-icon.min.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            background: var(--page-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        ::-webkit-scrollbar { display: none; }
        #toast {
            position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%);
            background: rgba(0, 0, 0, .78); color: #fff; font-size: 13px;
            padding: 8px 16px; border-radius: 6px; z-index: 999; display: none;
        }
    </style>
</head>
<body>
<div class="w-full h-[100dvh] overflow-hidden flex flex-col"
     style="padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));">
    <header class="flex-none topbar flex items-center" style="height: 48px; padding: 0 12px">
        <button aria-label="返回" class="flex items-center justify-center text-white" style="width: 32px; height: 32px" onclick="appBack()">
            <iconify-icon class="text-[22px]" icon="solar:alt-arrow-left-linear"></iconify-icon>
        </button>
        <h1 class="flex-1 text-center text-white" style="font-size: 17px; font-weight: 700">VIP介绍</h1>
        <span style="width: 32px"></span>
    </header>
    <div class="flex-1 overflow-y-auto" style="padding: 10px 0 20px">
        <div class="guide-card" onclick="showToast('文化娱乐类VIP')">
            <img class="guide-icon" alt="文化娱乐类VIP" src="assets/v2/vip/cat-entertainment.png"/>
            <span class="guide-label">文化娱乐类VIP</span>
        </div>
        <div class="guide-card" onclick="showToast('教育类VIP')">
            <img class="guide-icon" alt="教育类VIP" src="assets/v2/vip/cat-education.png"/>
            <span class="guide-label">教育类VIP</span>
        </div>
        <div class="guide-card" onclick="showToast('技术服务·生活服务类VIP')">
            <img class="guide-icon" alt="技术服务·生活服务类VIP" src="assets/v2/vip/cat-tech.png"/>
            <span class="guide-label">技术服务·生活服务类VIP</span>
        </div>
        <div class="guide-card" onclick="showToast('公益类活动VIP')">
            <img class="guide-icon" alt="公益类活动VIP" src="assets/v2/vip/cat-charity.png"/>
            <span class="guide-label">公益类活动VIP</span>
        </div>
        <div class="guide-card" onclick="showToast('VIP1')">
            <img class="guide-icon" alt="VIP1" src="assets/v2/vip/vip1.png"/>
            <span class="guide-label">VIP1</span>
        </div>
        <div class="guide-card" onclick="showToast('VIP2')">
            <img class="guide-icon" alt="VIP2" src="assets/v2/vip/vip2.png"/>
            <span class="guide-label">VIP2</span>
        </div>
        <div class="guide-card" onclick="showToast('VIP3')">
            <img class="guide-icon" alt="VIP3" src="assets/v2/vip/vip3.png"/>
            <span class="guide-label">VIP3</span>
        </div>
        <div class="guide-card" onclick="showToast('VIP4')">
            <img class="guide-icon" alt="VIP4" src="assets/v2/vip/vip4.png"/>
            <span class="guide-label">VIP4</span>
        </div>
        <div class="guide-card" onclick="showToast('VIP5')">
            <img class="guide-icon" alt="VIP5" src="assets/v2/vip/vip5.png"/>
            <span class="guide-label">VIP5</span>
        </div>
        <div class="guide-card" onclick="showToast('VIP6')">
            <img class="guide-icon" alt="VIP6" src="assets/v2/vip/vip6.png"/>
            <span class="guide-label">VIP6</span>
        </div>
    </div>
</div>
<div id="toast"></div>
<script>
    function showToast(message) {
        const toast = document.getElementById('toast')
        toast.textContent = message
        toast.style.display = 'block'
        clearTimeout(toast._timer)
        toast._timer = setTimeout(() => (toast.style.display = 'none'), 1800)
    }
</script>
<script src="assets/vendor/back.js"></script>
</body>
</html>
