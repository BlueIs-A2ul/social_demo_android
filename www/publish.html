<!doctype html>

<html data-immersive-translate-page-theme="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>分享动态 - 智能空间</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <script>
      (function () {
        try {
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'setBottomNav', visible: true }, '*')
          }

      })();

    <script src="assets/vendor/history-favorites.js"></script>
    <script src="assets/vendor/safe-area.js"></script>
    <style>
      body {
        background-color: white;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
        position: relative;
      }
      html:not(.in-frame) body {
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      }
      ::-webkit-scrollbar {
        display: none;
      }
      .v-badge {
        background-color: #ffb800;
        color: white;
        font-size: 8px;
        font-weight: bold;
        width: 14px;
        height: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin-left: 6px;
      }
      .user-vip-badge {
        display: inline-block;
        width: 20px;
        height: auto;
        margin-left: 4px;
        vertical-align: -4px;
      }
      .user-vip-badge-sm {
        width: 15px;
        margin-left: 3px;
        vertical-align: -3px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .modal-open {
        overflow: hidden;
      }
      .publish-top-nav {
        width: 100%;
        height: 52px;
        box-sizing: border-box;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        border-bottom: 1px solid #f3f4f6;
        background: #fff;
        color: #888;
        position: sticky;
        top: 0;
        z-index: 60;
      }
      .publish-menu-btn,
      .publish-search-btn {
        width: 28px;
        height: 28px;
        flex: none;
        border: 0;
        padding: 0;
        background: transparent;
        color: #555;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .publish-menu-badge {
        position: absolute;
        top: -4px;
        right: -7px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border: 2px solid #fff;
        border-radius: 999px;
        background: #ff3f74;
        color: #fff;
        font-size: 11px;
        line-height: 14px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .publish-nav-tabs {
        min-width: 0;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        white-space: nowrap;
      }
      .publish-nav-tab {
        color: #8a8a8a;
        font-size: 18px;
        font-weight: 800;
        line-height: 52px;
        text-decoration: none;
        position: relative;
      }
      .publish-nav-tab.active {
        color: #333;
      }
      .publish-nav-tab.active::after {
        content: '';
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: 7px;
        height: 3px;
        background: #333;
      }
      .publish-nav-caret {
        font-size: 12px;
        margin-left: 2px;
        vertical-align: 2px;
      }
      .publish-view-hidden {
        display: none !important;
      }
      body.publish-discover-mode #feed-grid {
        padding-top: 16px;
      }
      .publish-discover-only {
        display: none;
      }
      body.publish-discover-mode .publish-discover-only {
        display: block;
      }

      /* ====== 视觉精修：柔和圆角与按压反馈（仅样式，不改布局/图片） ====== */
      .publish-home-only div.absolute img {
        border-radius: 9999px;
      }
      .publish-nav-tab.active::after {
        border-radius: 2px;
      }
      .publish-menu-btn,
      .publish-search-btn {
        border-radius: 8px;
        transition: background-color 0.15s ease;
      }
      .publish-menu-btn:active,
      .publish-search-btn:active {
        background: #f3f4f6;
      }
      #feed-grid > div > div:first-child {
        border-radius: 8px;
      }
      #feed-grid span.absolute {
        border-radius: 6px;
      }
      #compose-modal .border-b button:last-child {
        border-radius: 6px;
      }
      #compose-modal textarea {
        border-radius: 8px;
      }
      #compose-grid .aspect-square {
        border-radius: 8px;
      }
      /* ====== 二级 Tab（全部 / 图文 / 视频） ====== */
      .publish-sub-tabs {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 10px 0;
        background: #fff;
        border-bottom: 1px solid #f3f4f6;
        flex: none;
      }
      .sub-tab {
        position: relative;
        font-size: 13px;
        color: var(--ink-500);
        padding-bottom: 4px;
        border: 0;
        background: transparent;
      }
      .sub-tab.active {
        color: var(--ink-900);
        font-weight: 700;
      }
      .sub-tab.active::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 18px;
        height: 2px;
        background: var(--brand-strong);
      }
      /* ====== 我的内容分类 ====== */
      .my-tab {
        font-size: 13px;
        color: var(--ink-500);
        white-space: nowrap;
        border: 0;
        background: transparent;
      }
      .my-tab.active {
        color: var(--brand-deep);
        font-weight: 700;
      }
      /* ====== 我的作品：三列网格 ====== */
      #feed-grid.publish-grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
        padding: 0 0 40px;
      }
    </style>
    <style data-id="immersive-translate-input-injected-css"></style>
  </head>
  <body class="bg-white">
    <!-- 顶部导航栏 -->
    <div class="publish-top-nav">
      <nav aria-label="内容频道" class="publish-nav-tabs">
        <a class="publish-nav-tab" href="category.html">商城</a>
        <a

        <a

      </nav>
    </div>
    <!-- 二级 Tab：全部 / 图文 / 视频 -->
    <div class="publish-sub-tabs" id="subTabs">
      <button class="sub-tab active" data-kind="all" onclick="setSubTab(this)">
        全部
      </button>
      <button class="sub-tab" data-kind="text" onclick="setSubTab(this)">
        图文
      </button>
      <button class="sub-tab" data-kind="video" onclick="setSubTab(this)">
        视频
      </button>
    </div>
    <!-- 顶部封面区 -->
    <div
      class="publish-home-only relative w-full h-[150px] cursor-pointer shrink-0"
      onclick="showToast('更换封面')"
    >
      <img
        alt="Cover Image"
        class="w-full h-full object-cover"

    </div>
    <!-- 用户信息区 -->
    <div class="publish-home-only relative px-5 pt-2 pb-3 shrink-0">
      <!-- 头像叠加 -->
      <div

        <img
          alt="User Avatar"

        />
      </div>
      <div class="mt-10">
        <div class="flex items-center">
          <span class="text-xl font-bold text-black">雅柔</span>
          <img
            alt="个人VIP"
            class="user-vip-badge"
            src="assets/v2/vip/cat-entertainment.png"
          />
          <img
            alt="等级"
            class="user-vip-badge"
            src="assets/v2/icon/gear-badge.png"
          />
        </div>
        <p class="text-[12px] text-gray-400 mt-1">id:202609060012</p>
        <div
          class="mt-2 flex items-center gap-2 text-[13px] text-gray-500 cursor-pointer"
          onclick="showToast('编辑介绍')"
        >
          添加介绍，让大家都来了解一下你
          <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14">
            <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </div>
        <div class="flex gap-6 mt-4">
          <div class="text-center">
            <div class="text-[16px] font-bold text-[#26c6da]">100</div>
            <div class="text-[12px] text-gray-400">粉丝</div>

            <div class="text-[16px] font-bold text-[#26c6da]">20</div>
            <div class="text-[12px] text-gray-400">关注</div>

          <div class="text-center">
            <div class="text-[16px] font-bold text-[#26c6da]">60</div>
            <div class="text-[12px] text-gray-400">获赞</div>
          </div>

      </div>
    </div>
    <div class="publish-home-only h-1 bg-gray-50 w-full shrink-0"></div>
    <!-- 我的内容分类 -->
    <div
      class="publish-home-only px-5 py-3 flex items-center gap-5 overflow-x-auto no-scrollbar shrink-0 border-b border-gray-100"
    >
      <button class="my-tab active" onclick="setMyTab(this)">作品（3）</button>
      <button class="my-tab" onclick="setMyTab(this)">草稿（0）</button>
      <button class="my-tab" onclick="setMyTab(this)">私密（0）</button>
      <button class="my-tab" onclick="setMyTab(this)">收藏（0）</button>
      <button class="my-tab" onclick="setMyTab(this)">点赞（0）</button>

    <!-- 两列瀑布流网格 -->
    <div
      class="grid grid-cols-2 gap-x-[10px] gap-y-4 px-5 pb-10"

    <!-- 发布入口 -->
    <button
      aria-label="发布"
      class="fixed right-4 z-[100] flex items-center justify-center bg-[#26c6da] text-white"
      style="bottom: calc(var(--safe-area-inset-bottom, 0px) + 84px); width: 48px; height: 48px; border-radius: 9999px; box-shadow: 0 6px 18px rgba(38, 198, 218, .45); border: 0;"
      onclick="openPublishSheet()"
    >

        fill="none"

        <path d="M12 5v14M5 12h14"></path>
      </svg>

    <!-- 发布选项弹窗 -->
    <div
      class="fixed inset-0 bg-black/50 z-[110] opacity-0 transition-opacity duration-300 hidden"
      id="publish-overlay"
      onclick="closePublishSheet()"
    ></div>
    <div
      class="fixed bottom-0 left-0 w-full bg-white z-[120] transform transition-transform duration-300 translate-y-full"
      id="publish-sheet"

    >

        <button

    <div

      id="compose-overlay"
      onclick="closeCompose()"
    ></div>
    <div
      class="fixed bottom-0 left-0 w-full bg-white z-[140] transform transition-transform duration-300 translate-y-full flex flex-col"
      id="compose-modal"
      style="max-height: 92dvh; padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));"
    >
      <!-- 顶部栏 -->
      <div
        class="h-12 shrink-0 flex items-center justify-between px-4 border-b border-gray-100"
      >
        <button
          class="text-sm text-gray-500 active:text-gray-800"
          onclick="closeCompose()"
        >
          取消
        </button>
        <span class="text-base font-bold text-black">发布动态</span>
        <button
          class="text-sm font-bold text-white bg-[#26c6da] px-4 py-1.5 active:opacity-80"

          发布

      <!-- 滚动内容 -->

        <!-- 图片九宫格 -->

          id="compose-grid"
        ></div>
        <!-- 文字输入 -->
        <div class="px-4 pb-4">
          <textarea
            class="w-full h-28 bg-gray-50 p-3 text-sm outline-none resize-none"
            id="compose-text"
            maxlength="500"
            placeholder="说点什么..."
          ></textarea>
          <div class="text-right text-xs text-gray-400 mt-1">
            <span id="compose-count">0</span>/500
          </div>
        </div>
      </div>
    </div>
    <!-- Toast -->
    <div
      class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-black/80 text-white text-xs px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity duration-300 z-[200]"
      id="toast"
    ></div>
    <script>
      // ===== 帖子数据（index 对应 publish_post_detail.html 的 feedData） =====
      const POSTS = [
        { index: 0, title: '中医：真正能让气血恢复的方式只有两种', img: 'assets/src_01/分享样例/966C4524685A0374B01D5616402D6C9A.jpg' },
        { index: 1, title: '一周抗炎 抗氧化 健康饮食食谱 拿走不谢', img: 'assets/src_01/分享样例/1C8309C5D99DCCCCCC45F35D09E22EB4.jpg' },
        { index: 2, title: '终于有人把全国旅行地说明白了', img: 'assets/src_01/分享样例/E48B6D2A6A6262F98BD99810BE97F390.jpg' },
        { index: 3, title: '会穿衣服 是一种顶级能力', img: 'assets/src_01/分享样例/B15C88F706527C63D9F2B86FBFF5997F.jpg' },
        { index: 4, title: '给你3亿在无人深林待三年 六选三', img: 'assets/src_01/分享样例/03C97DD74948F540243370B20E16156B.jpg' },
        { index: 5, title: '一图看懂整个英语语法体系表', img: 'assets/src_01/分享样例/05823C55FFF4D2081DC3D173711C04F0.jpg' },
        { index: 6, title: '为什么空调一关马上就热起来了？', img: 'assets/src_01/分享样例/1A9E0D43FC03A6060A194C18AD661F33.jpg' },
        { index: 7, title: '强者是怎么熬过来的', img: 'assets/src_01/分享样例/358A2C1D61442017F6D2F0216C8556FD.jpg' },
        { index: 8, title: '做生意 必须知道的11个公式', img: 'assets/src_01/分享样例/6709F497401C22EAC60FCD7E73F82AF5.jpg' },
        { index: 9, title: '谈话时手势的艺术 肢体语言是灵魂的扩音器', img: 'assets/src_01/分享样例/C152B1D86E487B527AA6B9F98D3A4FC5.jpg' },
        { index: 10, title: '这些运动习惯 正在悄悄延长你的寿命', img: 'assets/src_01/分享样例/77C3596D45EA99126623724490CCB592.jpg' },
        { index: 11, title: '你能认出哪颗是水稻 哪颗是杂草吗？', img: 'assets/src_01/分享样例/D3E51E02BB7424C0BC9093BE801FD715.jpg' },
        { index: 12, title: '有钱人为啥都喜欢这个手势', img: 'assets/src_01/分享样例/2AACCF9E4BB049CF43E35CA29A5BD3EC.jpg' },
        { index: 13, title: '12种视频剪辑技巧 我看看还有谁不会', img: 'assets/src_01/分享样例/34FBBC70673B58DCA51BD714C29F31B2.jpg' },
      ]

      // 各频道展示的帖子集合与顺序（index 不重复出现即内容不同）
      const VIEW_FEEDS = {
        home: [0, 1, 2, 3, 4, 5, 6], // 我的作品
        follow: [7, 0, 10, 5, 13, 6], // 关注的人近期发布
        discover: [10, 2, 12, 7, 1, 13, 4, 9, 0, 11, 5, 8, 6, 3], // 全部推荐
        nearby: [6, 10, 11, 8, 4, 9, 2], // 同城热帖
      }

      // 卡片底栏的作者与点赞数
      const AUTHORS = [
        { name: '谢锋FM', avatar: 'assets/v2/processed/碇真嗣头像.png' },
        { name: '小鹿', avatar: 'assets/v2/processed/精灵公主头像.png' },
        { name: '阿Z想开了', avatar: 'assets/v2/processed/井上织姬头像.png' },
        { name: '武当云溪', avatar: 'assets/v2/processed/不知火舞头像.png' },
        { name: '昔日老雷', avatar: 'assets/v2/processed/汉库克头像.png' },
        { name: '许升', avatar: 'assets/v2/processed/春丽头像.png' },
        { name: '雷法', avatar: 'assets/v2/processed/纲手头像.png' },
      ]
      const LIKE_COUNTS = [1000, 880, 10000, 10000, 620, 360, 550]

      const HEART_SVG =
        '<svg fill="none" height="14" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="14"><path d="M12 20.3 4.7 13a4.6 4.6 0 0 1 6.5-6.5l.8.8.8-.8A4.6 4.6 0 0 1 19.3 13Z"/></svg>'

      function renderFeed(view) {
        const feedGrid = document.getElementById('feed-grid')
        const ids = VIEW_FEEDS[view] || VIEW_FEEDS.follow
        const isHome = view === 'home'
        feedGrid.classList.toggle('publish-grid-3', isHome)
        feedGrid.innerHTML = ids
          .map((i, n) => {
            const p = POSTS[i]
            const a = AUTHORS[n % AUTHORS.length]
            const likes = LIKE_COUNTS[n % LIKE_COUNTS.length]
            const isVideo = n % 3 === 0
            const overlay = isVideo
              ? '<span class="absolute right-1.5 bottom-1.5 px-1 bg-black/45 text-white text-[10px]">▶ 0:23</span>'
              : ''
            const footer = isHome
              ? ''
              : '<div class="flex items-center justify-between mt-1.5">' +
                '<span class="flex items-center gap-1.5 min-w-0">' +
                '<img class="w-5 h-5 object-cover flex-none" style="border-radius:9999px" src="' + a.avatar + '" alt="" />' +
                '<span class="text-[12px] text-gray-700 truncate">' + a.name + '</span>' +
                '</span>' +
                '<span class="flex items-center gap-1 text-[12px] text-gray-500 flex-none">' +
                HEART_SVG + likes +
                '</span>' +
                '</div>'
            return `<div class="cursor-pointer group" onclick="window.location.href='publish_post_detail.html?index=${p.index}'">
          <div class="relative w-full aspect-[3/4] bg-gray-50 overflow-hidden">
            <img
              alt="${p.title}"
              class="w-full h-full object-cover transition-transform group-active:scale-95"
              src="${p.img}"
            />
            ${overlay}
          </div>
          ${footer}
        </div>`
          })
          .join('')
      }

      function setSubTab(el) {
        document
          .querySelectorAll('#subTabs .sub-tab')
          .forEach(t => t.classList.remove('active'))
        el.classList.add('active')
        showToast('筛选：' + el.textContent.trim())
      }

      function setMyTab(el) {
        document
          .querySelectorAll('.my-tab')
          .forEach(t => t.classList.remove('active'))
        el.classList.add('active')
      }

      function switchPublishView(view, event) {
        if (event) event.preventDefault()
        // "发现"/"我"为内部视图切换：已处于发现模式时点击"发现"返回主页视图
        const isDiscover = view === 'discover' || view === 'follow' || view === 'nearby'

        document.body.classList.toggle('publish-discover-mode', isDiscover)
        document.querySelectorAll('.publish-home-only').forEach(section => {
          section.classList.toggle('publish-view-hidden', isDiscover)
        })
        const subTabs = document.getElementById('subTabs')
        if (subTabs) {
          subTabs.classList.toggle('publish-view-hidden', view === 'home')
        }

        // 先移除所有导航标签的active状态
        document.querySelectorAll('.publish-nav-tab').forEach(tab => {
          tab.classList.remove('active')
        })

        // 如果有event.target，只在当前点击的按钮上添加active状态
        if (event && event.target) {
          const clickedTab = event.target.closest('.publish-nav-tab')
          if (clickedTab) {
            clickedTab.classList.add('active')
          }
        }

        // 不同频道渲染各自的内容与顺序
        renderFeed(view)

        window.scrollTo(0, 0)
      }

      // 初始渲染「关注」频道（与目标稿一致）
      switchPublishView('follow')

      function showToast(msg) {
        const toast = document.getElementById('toast')
        toast.innerText = msg
        toast.classList.add('opacity-100')
        setTimeout(() => {
          toast.classList.remove('opacity-100')
        }, 2000)
      }

      // 发布选项弹窗
      function openPublishSheet() {
        document.getElementById('publish-overlay').classList.remove('hidden')
        setTimeout(() => {
          document
            .getElementById('publish-overlay')
            .classList.add('opacity-100')
          document
            .getElementById('publish-sheet')
            .classList.remove('translate-y-full')
        }, 10)
        document.body.classList.add('modal-open')
      }

      function closePublishSheet() {
        document
          .getElementById('publish-overlay')
          .classList.remove('opacity-100')
        document
          .getElementById('publish-sheet')
          .classList.add('translate-y-full')
        setTimeout(() => {
          document.getElementById('publish-overlay').classList.add('hidden')
        }, 300)
        document.body.classList.remove('modal-open')
      }

      function selectPublishOption(type) {
        closePublishSheet()
        if (type === 'album') {
          document.getElementById('album-input').click()
          return
        }
        const toastMap = {
          camera: '相机拍摄功能将在正式版开放',
          text: '写文字功能将在正式版开放',
        }
        showToast(toastMap[type])
      }

      // ===== 相册选择与发布编辑 =====
      const MAX_IMAGES = 9
      let selectedImages = [] // { file, url }

      const albumInput = document.getElementById('album-input')
      albumInput.addEventListener('change', () => {
        const files = Array.from(albumInput.files || []).filter(f =>
          f.type.startsWith('image/')
        )
        if (files.length === 0) return
        const remaining = MAX_IMAGES - selectedImages.length
        if (files.length > remaining) {
          showToast(`最多选择 ${MAX_IMAGES} 张图片`)
          files.length = remaining
        }
        files.forEach(file => {
          selectedImages.push({ file, url: URL.createObjectURL(file) })
        })
        albumInput.value = ''
        renderComposeGrid()
        openCompose()
      })

      function openCompose() {
        document.getElementById('compose-overlay').classList.remove('hidden')
        setTimeout(() => {
          document.getElementById('compose-overlay').classList.add('opacity-100')
          document.getElementById('compose-modal').classList.remove('translate-y-full')
        }, 10)
        document.body.classList.add('modal-open')
      }

      function closeCompose() {
        document.getElementById('compose-overlay').classList.remove('opacity-100')
        document.getElementById('compose-modal').classList.add('translate-y-full')
        setTimeout(() => {
          document.getElementById('compose-overlay').classList.add('hidden')
        }, 300)
        document.body.classList.remove('modal-open')
      }

      function renderComposeGrid() {
        const grid = document.getElementById('compose-grid')
        grid.innerHTML = selectedImages
          .map(
            (img, i) => `
          <div class="relative aspect-square bg-gray-100 overflow-hidden">
            <img alt="已选图片" class="w-full h-full object-cover" src="${img.url}" />
            <button class="absolute top-1 right-1 w-5 h-5 bg-black/60 text-white text-xs flex items-center justify-center active:bg-black/80" onclick="removeSelectedImage(${i})">✕</button>
          </div>`
          )
          .join('')
        if (selectedImages.length < MAX_IMAGES) {
          grid.insertAdjacentHTML(
            'beforeend',
            `<div class="aspect-square border border-dashed border-gray-300 flex items-center justify-center text-2xl text-gray-400 cursor-pointer active:bg-gray-50" onclick="document.getElementById('album-input').click()">+</div>`
          )
        }
      }

      function removeSelectedImage(index) {
        URL.revokeObjectURL(selectedImages[index].url)
        selectedImages.splice(index, 1)
        renderComposeGrid()
      }

      function publishCompose() {
        const text = document.getElementById('compose-text').value.trim()
        if (selectedImages.length === 0 && !text) {
          showToast('请添加图片或文字')
          return
        }
        selectedImages.forEach(img => URL.revokeObjectURL(img.url))
        selectedImages = []
        document.getElementById('compose-text').value = ''
        document.getElementById('compose-count').innerText = '0'
        closeCompose()
        showToast('发布成功')
      }

      document
        .getElementById('compose-text')
        .addEventListener('input', e => {
          document.getElementById('compose-count').innerText =
            e.target.value.length
        })
    </script>
  </body>
</html>
