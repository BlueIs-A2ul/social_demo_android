              <path d="M 2.99435483870968 1.98611111111111 L 0.806451612903226 0.808333333333333 L 0.806451612903226 3.16388888888889 L 2.99435483870968 1.98611111111111 Z M 3.64032258064516 2.45694444444444 L 0.987096774193549 3.88541666666667 C 0.884560086785695 3.94060151358721 0.766077462752397 3.96986246436651 0.645161210461262 3.96986246436651 C 0.288973824042204 3.96986246436651 0.000177226070700125 3.72130021144944 0 3.41458333333333 L 0 0.557638888888889 C 0.000177226070700125 0.250922010772779 0.288973824042204 0.0023597578557073 0.645161210461262 0.0023597578557073 C 0.766077462752397 0.0023597578557073 0.884560086785695 0.0316207086350088 0.987096774193548 0.0868055555555556 L 3.64032258064516 1.51527777777778 C 3.82866220385105 1.61685312809122 3.94303522985464 1.79474669552991 3.94303522985464 1.98611111111111 C 3.94303522985464 2.17747552669232 3.82866220385105 2.35536909413101 3.64032258064516 2.45694444444444 Z" fill="#ffffff" fill-rule="nonzero" transform="translate(4 4)"/>
            </svg>
            <span class="my-count">360</span>
          </div>
          <div
            class="my-grid-item"
            onclick="window.location.href = 'publish_post_detail.html?index=2'"
          >
            <img
              alt="作品"
              class="my-grid-img"
              src="assets/v2/processed/我的作品-窗前.png"
            />
            <svg class="my-play" height="12" viewBox="0 0 12 12" width="12" xmlns="http://www.w3.org/2000/svg">
              <path d="M 6 11.25 C 8.89949493661167 11.25 11.25 8.89949493661167 11.25 6 C 11.25 3.10050506338833 8.89949493661167 0.75 6 0.75 C 3.10050506338833 0.75 0.75 3.10050506338833 0.75 6 C 0.75 8.89949493661167 3.10050506338833 11.25 6 11.25 Z M 6 12 C 2.68629150101524 12 0 9.31370849898476 0 6 C 0 2.68629150101524 2.68629150101524 0 6 0 C 9.31370849898476 0 12 2.68629150101524 12 6 C 12 9.31370849898476 9.31370849898476 12 6 12 Z" fill="#ffffff" fill-rule="nonzero"/>
              <path d="M 2.99435483870968 1.98611111111111 L 0.806451612903226 0.808333333333333 L 0.806451612903226 3.16388888888889 L 2.99435483870968 1.98611111111111 Z M 3.64032258064516 2.45694444444444 L 0.987096774193549 3.88541666666667 C 0.884560086785695 3.94060151358721 0.766077462752397 3.96986246436651 0.645161210461262 3.96986246436651 C 0.288973824042204 3.96986246436651 0.000177226070700125 3.72130021144944 0 3.41458333333333 L 0 0.557638888888889 C 0.000177226070700125 0.250922010772779 0.288973824042204 0.0023597578557073 0.645161210461262 0.0023597578557073 C 0.766077462752397 0.0023597578557073 0.884560086785695 0.0316207086350088 0.987096774193548 0.0868055555555556 L 3.64032258064516 1.51527777777778 C 3.82866220385105 1.61685312809122 3.94303522985464 1.79474669552991 3.94303522985464 1.98611111111111 C 3.94303522985464 2.17747552669232 3.82866220385105 2.35536909413101 3.64032258064516 2.45694444444444 Z" fill="#ffffff" fill-rule="nonzero" transform="translate(4 4)"/>
            </svg>
            <span class="my-count">550</span>
          </div>
        </div>
        <div class="my-empty" id="myEmpty" style="display: none">~暂无内容~</div>
      </div>
    </div>
    <!-- 两列瀑布流网格 -->
    <div
      class="grid grid-cols-2 gap-x-[10px] gap-y-4 px-5 pb-10"
      id="feed-grid"
    ></div>
    <!-- Toast -->
    <div
      class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-black/80 text-white text-xs px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity duration-300 z-[200]"
      id="toast"
    ></div>
    <!-- 商城「建设中」弹窗 -->
    <div class="mall-modal" id="mallBuildingModal">
      <div class="mall-mask" onclick="closeMallBuilding()"></div>
      <div class="mall-panel">
        <img alt="建设中" class="mall-icon" src="assets/v2/icon/建设中-工人.svg"/>
        <div class="mall-text">建设中...</div>
      </div>
    </div>
    <script>
      if (window.self !== window.top) document.body.classList.add('is-embedded')

      // ===== 帖子数据（index 对应 publish_post_detail.html 的 feedData） =====
      const POSTS = [
        { index: 0, title: '中医：真正能让气血恢复的方式只有两种', img: 'assets/src_01/分享样例/966C4524685A0374B01D5616402D6C9A.jpg' },
        { index: 1, title: '一周抗炎 抗氧化 健康饮食食谱 拿走不谢', img: 'assets/src_01/分享样例/1C8309C5D99DCCCCCC45F35D09E22EB4.jpg' },
        { index: 2, title: '终于有人把全国旅行地说明白了', img: 'assets/src_01/分享样例/E48B6D2A6A6262F98BD99810BE97F390.jpg' },
        { index: 3, title: '会穿衣服 是一种顶级能力', img: 'assets/src_01/分享样例/B15C88F706527C63D9F2B86FBFF5997F.jpg' },
        { index: 4, title: '给你3亿在无人深林待三年 六选三', img: 'assets/src_01/分享样例/03C97DD74948F540243370B20E16156B.jpg' },
        { index: 5, title: '一图看懂整个英语语法体系表', img: 'assets/src_01/分享样例/05823C55FFF4D2081DC3D173711C04F0.jpg' },
        { index: 6, title: '为什么空调一关马上就热起来了？', img: 'assets/src_01/分享样例/1A9E0D43FC03A6060A194C18AD661F33.jpg' },
        { index: 7, title: '强者是怎么熬过来的', img: 'assets/src_01/分享样例/358A2C1D61442017F6D2F0216C8556FD.jpg' },
        { index: 8, title: '做生意 必须知道的11个公式', img: 'assets/src_01/分享样例/6709F497401C22EAC60FCD7E73F82AF5.jpg' },
        { index: 9, title: '谈话时手势的艺术 肢体语言是灵魂的扩音器', img: 'assets/src_01/分享样例/C152B1D86E487B527AA6B9F98D3A4FC5.jpg' },
        { index: 10, title: '这些运动习惯 正在悄悄延长你的寿命', img: 'assets/src_01/分享样例/77C3596D45EA99126623724490CCB592.jpg' },
        { index: 11, title: '你能认出哪颗是水稻 哪颗是杂草吗？', img: 'assets/src_01/分享样例/D3E51E02BB7424C0BC9093BE801FD715.jpg' },
        { index: 12, title: '有钱人为啥都喜欢这个手势', img: 'assets/src_01/分享样例/2AACCF9E4BB049CF43E35CA29A5BD3EC.jpg' },
        { index: 13, title: '12种视频剪辑技巧 我看看还有谁不会', img: 'assets/src_01/分享样例/34FBBC70673B58DCA51BD714C29F31B2.jpg' },
      ]

      // 各频道展示的帖子集合与顺序（index 不重复出现即内容不同）
      const VIEW_FEEDS = {
        follow: [7, 0, 10, 5, 13, 6], // 关注的人近期发布
        discover: [10, 2, 12, 7, 1, 13, 4, 9, 0, 11, 5, 8, 6, 3], // 全部推荐
        nearby: [6, 10, 11, 8, 4, 9, 2], // 同城热帖
      }

      // 卡片底栏的作者与点赞数
      const AUTHORS = [
        { name: '谢锋FM', avatar: 'assets/v2/processed/碇真嗣头像.png' },
        { name: '小鹿', avatar: 'assets/v2/processed/精灵公主头像.png' },
        { name: '阿Z想开了', avatar: 'assets/v2/processed/井上织姬头像.png' },
        { name: '武当云溪', avatar: 'assets/v2/processed/不知火舞头像.png' },
        { name: '昔日老雷', avatar: 'assets/v2/processed/汉库克头像.png' },
        { name: '许升', avatar: 'assets/v2/processed/春丽头像.png' },
        { name: '雷法', avatar: 'assets/v2/processed/纲手头像.png' },
      ]
      const LIKE_COUNTS = [1000, 880, 10000, 10000, 620, 360, 550]

      const HEART_SVG =
        '<svg fill="none" height="14" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" width="14"><path d="M12 20.3 4.7 13a4.6 4.6 0 0 1 6.5-6.5l.8.8.8-.8A4.6 4.6 0 0 1 19.3 13Z"/></svg>'

      const VIEW_AUTHOR_ORDER = {
        follow: [0, 1, 2, 3],
        discover: [4, 1, 5, 6],
        nearby: [4, 1, 5, 6]
      }

      function renderFeed(view) {
        const feedGrid = document.getElementById('feed-grid')
        const ids = VIEW_FEEDS[view] || VIEW_FEEDS.follow
        const order = VIEW_AUTHOR_ORDER[view] || VIEW_AUTHOR_ORDER.follow
        feedGrid.innerHTML = ids
          .map((i, n) => {
            const p = POSTS[i]
            const a = AUTHORS[order.length ? order[n % order.length] : 0]
            const likes = LIKE_COUNTS[n % LIKE_COUNTS.length]
            const isVideo = n % 3 === 0
            const overlay = isVideo
              ? '<span class="absolute right-1.5 bottom-1.5 px-1 bg-black/45 text-white text-[10px]">▶ 0:23</span>'
              : ''
            const footer =
              '<div class="flex items-center justify-between mt-1.5">' +
              '<span class="flex items-center gap-1.5 min-w-0">' +
              '<img class="w-5 h-5 object-cover flex-none" style="border-radius:9999px" src="' + a.avatar + '" alt="" />' +
              '<span class="text-[12px] text-gray-700 truncate">' + a.name + '</span>' +
              '</span>' +
              '<span class="flex items-center gap-1 text-[12px] text-gray-500 flex-none">' +
              HEART_SVG + likes +
              '</span>' +
              '</div>'
            return `<div class="cursor-pointer group" onclick="window.location.href='publish_post_detail.html?index=${p.index}'">
          <div class="relative w-full aspect-[3/4] bg-gray-50 overflow-hidden">
            <img
              alt="${p.title}"
              class="w-full h-full object-cover transition-transform group-active:scale-95"
              src="${p.img}"
            />
            ${overlay}
          </div>
          ${footer}
        </div>`
          })
          .join('')
      }

      function setSubTab(el) {
        document
          .querySelectorAll('#subTabs .sub-tab')
          .forEach(t => t.classList.remove('active'))
        el.classList.add('active')
        showToast('筛选：' + el.textContent.trim())
      }

      const PUBLISH_VIEW_TAB = { home: 1, follow: 2, discover: 3, nearby: 4 }

      function switchPublishView(view, event) {
        if (event) event.preventDefault()
        // 「我」为个人作品页，其余为内容发现模式
        const isMy = view === 'home'
        const isDiscover = !isMy

        document.body.classList.toggle('publish-discover-mode', isDiscover)
        document.body.classList.toggle('publish-my-mode', isMy)

        // 先移除所有导航标签的active状态
        document.querySelectorAll('.publish-nav-tab').forEach(tab => {
          tab.classList.remove('active')
        })

        // 如果有event.target，只在当前点击的按钮上添加active状态
        let activated = false
        if (event && event.target) {
          const clickedTab = event.target.closest('.publish-nav-tab')
          if (clickedTab) {
            clickedTab.classList.add('active')
            activated = true
          }
        }
        if (!activated) {
          const tabs = document.querySelectorAll('.publish-nav-tab')
          const idx = PUBLISH_VIEW_TAB[view]
          if (tabs[idx]) tabs[idx].classList.add('active')
        }

        // 不同频道渲染各自的内容与顺序
        if (!isMy) renderFeed(view)

        history.replaceState(
          null,
          '',
          isMy ? '#me' : location.pathname + location.search
        )

        window.scrollTo(0, 0)
      }

      // 初始渲染「关注」频道（与目标稿一致）；支持 #me 直达个人作品页
      switchPublishView(location.hash === '#me' ? 'home' : 'follow')

      // ===== 商城「建设中」弹窗（TV 商城暂不开放，2 秒后自动关闭） =====
      let mallPrevTab = null
      let mallAutoTimer = null

      function openMallBuilding(event) {
        if (event) event.preventDefault()
        mallPrevTab = document.querySelector('.publish-nav-tab.active')
        document.querySelectorAll('.publish-nav-tab').forEach(tab => {
          tab.classList.remove('active')
        })
        if (event && event.target) {
          const clickedTab = event.target.closest('.publish-nav-tab')
          if (clickedTab) clickedTab.classList.add('active')
        }
        document.getElementById('mallBuildingModal').classList.add('open')
        document.body.classList.add('modal-open')
        if (window.self !== window.top) {
          window.parent.postMessage({ type: 'dimBottomNav', on: true }, '*')
        }
        clearTimeout(mallAutoTimer)
        mallAutoTimer = setTimeout(closeMallBuilding, 2000)
      }

      function closeMallBuilding() {
        clearTimeout(mallAutoTimer)
        document.getElementById('mallBuildingModal').classList.remove('open')
        document
          .querySelectorAll('.publish-nav-tab')
          .forEach(tab => tab.classList.remove('active'))
        if (mallPrevTab) mallPrevTab.classList.add('active')
        document.body.classList.remove('modal-open')
        if (window.self !== window.top) {
          window.parent.postMessage({ type: 'dimBottomNav', on: false }, '*')
        }
      }

      function setMyViewTab(el, index) {
        document
          .querySelectorAll('.my-tab')
          .forEach(t => t.classList.remove('selected'))
        el.classList.add('selected')
        const grid = document.getElementById('myGrid')
        const empty = document.getElementById('myEmpty')
        if (grid) grid.style.display = index === 0 ? 'flex' : 'none'
        if (empty) empty.style.display = index === 0 ? 'none' : 'block'
      }

      function showToast(msg) {
        const toast = document.getElementById('toast')
        toast.innerText = msg
        toast.classList.add('opacity-100')
        setTimeout(() => {
          toast.classList.remove('opacity-100')
        }, 2000)
      }
    </script>
  </body>
</html>
