<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>创建群组</title>
<script src="assets/vendor/tailwindcss.js"></script>
<style>
    body { background-color: #f3f4f6; margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; }
    .app-container { width: 100%; height: 100dvh; position: relative; overflow: hidden; display: flex; flex-direction: column; background: white;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    }
    ::-webkit-scrollbar { display: none; }
    * { border-radius: 0 !important; }
    .avatar { border-radius: 9999px !important; display: block; border: 1px solid #fce7f3; background: #fdf2f8; object-fit: cover; flex: none; }
    .text-pink-main { color: #ec4899; }
    .bg-pink-main { background-color: #ec4899; }
    .border-pink-main { border-color: #ec4899; }
    .flex { display: flex; }
    .grid { display: grid; }
    .block { display: block; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .min-h-screen { min-height: 100dvh; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .left-1\/2 { left: 50%; }
    .top-20 { top: 5rem; }
    .-translate-x-1\/2 { transform: translateX(-50%); }
    .shrink-0 { flex-shrink: 0; }
    .flex-1 { flex: 1 1 0%; }
    .min-w-0 { min-width: 0; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .gap-2 { gap: .5rem; }
    .gap-3 { gap: .75rem; }
    .space-y-2 > * + * { margin-top: .5rem; }
    .p-3 { padding: .75rem; }
    .p-4 { padding: 1rem; }
    .px-3 { padding-left: .75rem; padding-right: .75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: .5rem; padding-bottom: .5rem; }
    .pb-24 { padding-bottom: 6rem; }
    .mb-1 { margin-bottom: .25rem; }
    .mb-3 { margin-bottom: .75rem; }
    .mt-1 { margin-top: .25rem; }
    .mt-4 { margin-top: 1rem; }
    .w-full { width: 100%; }
    .w-10 { width: 2.5rem; }
    .w-14 { width: 3.5rem; }
    .h-8 { height: 2rem; }
    .h-10 { height: 2.5rem; }
    .h-12 { height: 3rem; }
    .h-14 { height: 3.5rem; }
    .h-20 { height: 5rem; }
    .w-10.h-10, .h-10.w-10 { height: 2.5rem; }
    .w-14.h-14, .h-14.w-14 { height: 3.5rem; }
    .overflow-y-auto { overflow-y: auto; }
    .resize-none { resize: none; }
    .object-cover { object-fit: cover; }
    .border { border-width: 1px; border-style: solid; }
    .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
    .border-gray-100 { border-color: #f3f4f6; }
    .border-gray-200 { border-color: #e5e7eb; }
    .border-gray-300 { border-color: #d1d5db; }
    .border-pink-main { border-color: #ec4899; }
    .bg-white { background-color: #fff; }
    .bg-gray-50 { background-color: #f9fafb; }
    .bg-gray-100 { background-color: #f3f4f6; }
    .bg-pink-50 { background-color: #fdf2f8; }
    .bg-black\/70 { background-color: rgba(0, 0, 0, .7); }
    .text-white { color: #fff; }
    .text-gray-400 { color: #9ca3af; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-900 { color: #111827; }
    .text-xs { font-size: .75rem; line-height: 1rem; }
    .text-sm { font-size: .875rem; line-height: 1.25rem; }
    .text-base { font-size: 1rem; line-height: 1.5rem; }
    .text-\[10px\] { font-size: 10px; line-height: 14px; }
    .text-\[11px\] { font-size: 11px; line-height: 15px; }
    .font-bold { font-weight: 700; }
    .leading-tight { line-height: 1.25; }
    .leading-relaxed { line-height: 1.625; }
    .text-left { text-align: left; }
    .opacity-0 { opacity: 0; }
    .transition-opacity { transition: opacity .2s ease; }
    .focus\:outline-none:focus { outline: none; }
    .focus\:border-pink-main:focus { border-color: #ec4899; }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); }
    .type-active { background: #ec4899; color: #fff; border-color: #ec4899; }
    .admin-active { border-color: #ec4899; background: #fdf2f8; }
    .switch { width: 38px; height: 22px; background: #d1d5db; position: relative; transition: background .2s ease; }
    .switch::after { content: ""; width: 18px; height: 18px; background: white; position: absolute; left: 2px; top: 2px; transition: left .2s ease; }
    .switch.on { background: #ec4899; }
    .switch.on::after { left: 18px; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen">
<div class="app-container shadow-2xl">
    <header class="p-4 border-b border-gray-100 flex items-center justify-between bg-white shrink-0">
        <div class="flex items-center gap-3">
            <button class="text-gray-900" onclick="window.location.href='message_center.html'">
                <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="m15 18-6-6 6-6"></path></svg>
            </button>
            <div>
                <h1 class="font-bold text-base text-gray-900 leading-tight">创建群组</h1>
                <p class="text-[10px] text-gray-400 leading-tight">朋友群 / 家庭群 / 兴趣群</p>
            </div>
        </div>
        <button class="px-3 h-8 bg-pink-main text-white text-xs font-bold" onclick="window.location.href='group_settings.html?from=group_create'">完成</button>
    </header>

    <main class="flex-1 overflow-y-auto bg-white">
        <section class="p-4 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-gray-100 border border-gray-200 flex items-center justify-center text-pink-main">
                    <svg fill="none" height="28" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="28"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <div class="flex-1">
                    <label class="block text-[11px] text-gray-400 mb-1">群名称</label>
                    <input class="w-full h-10 border border-gray-300 px-3 text-sm focus:outline-none focus:border-pink-main" value="周末空间设计小组" />
                </div>
            </div>
            <label class="block text-[11px] text-gray-400 mt-4 mb-1">群介绍</label>
            <textarea class="w-full h-20 border border-gray-300 p-3 text-xs leading-relaxed resize-none focus:outline-none focus:border-pink-main">整理熟人、家人和兴趣伙伴，方便按关系分类沟通。</textarea>
        </section>

        <section class="p-4 border-b border-gray-100">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-sm text-gray-900">群类型</h2>
                <span class="text-[10px] text-gray-400">创建后管理员可修改</span>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button class="group-type h-10 border border-gray-300 text-xs font-bold type-active" onclick="selectType(this)">朋友群</button>
                <button class="group-type h-10 border border-gray-300 text-xs font-bold text-gray-600" onclick="selectType(this)">家庭群</button>
                <button class="group-type h-10 border border-gray-300 text-xs font-bold text-gray-600" onclick="selectType(this)">兴趣群</button>
            </div>
        </section>

        <section class="p-4 border-b border-gray-100">
            <h2 class="font-bold text-sm text-gray-900 mb-3">群设置</h2>
            <div class="space-y-0 border border-gray-100">
                <div class="h-12 px-3 flex items-center justify-between border-b border-gray-100">
                    <div>
                        <p class="text-sm text-gray-900">成员可邀请朋友</p>
                        <p class="text-[10px] text-gray-400">适合朋友群快速扩展</p>
                    </div>
                    <button class="switch on" onclick="toggleSwitch(this)" aria-label="成员可邀请朋友"></button>
                </div>
                <div class="h-12 px-3 flex items-center justify-between border-b border-gray-100">
                    <div>
                        <p class="text-sm text-gray-900">加入需要管理员审核</p>
                        <p class="text-[10px] text-gray-400">家庭群建议开启</p>
                    </div>
                    <button class="switch on" onclick="toggleSwitch(this)" aria-label="加入需要审核"></button>
                </div>
                <div class="h-12 px-3 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-900">展示成员身份介绍</p>
                        <p class="text-[10px] text-gray-400">头像旁显示关系与说明</p>
                    </div>
                    <button class="switch on" onclick="toggleSwitch(this)" aria-label="展示成员身份介绍"></button>
                </div>
            </div>
        </section>

        <section class="p-4 border-b border-gray-100">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-sm text-gray-900">选择管理员</h2>
                <span class="text-[10px] text-pink-main">已选 2 人</span>
            </div>
            <div class="space-y-2">
                <button class="admin-card w-full p-3 border border-pink-main bg-pink-50 flex items-center gap-3 text-left admin-active" onclick="toggleAdmin(this)">
                    <img class="avatar w-10 h-10" alt="小云头像" src="assets/packaged/src/generated_avatars/avatar-01.png" />
                    <span class="flex-1">
                        <span class="block text-sm font-bold text-gray-900">小云</span>
                        <span class="block text-[11px] text-gray-400">空间设计师，负责群分类整理</span>
                    </span>
                    <span class="admin-role text-[10px] text-pink-main font-bold">管理员</span>
                </button>
                <button class="admin-card w-full p-3 border border-pink-main bg-pink-50 flex items-center gap-3 text-left admin-active" onclick="toggleAdmin(this)">
                    <img class="avatar w-10 h-10" alt="约翰逊头像" src="assets/packaged/src/generated_avatars/avatar-07.png" />
                    <span class="flex-1">
                        <span class="block text-sm font-bold text-gray-900">约翰逊</span>
                        <span class="block text-[11px] text-gray-400">家庭群联系人，负责成员审核</span>
                    </span>
                    <span class="admin-role text-[10px] text-pink-main font-bold">管理员</span>
                </button>
                <button class="admin-card w-full p-3 border border-gray-200 bg-white flex items-center gap-3 text-left" onclick="toggleAdmin(this)">
                    <img class="avatar w-10 h-10" alt="七七头像" src="assets/packaged/src/generated_avatars/avatar-09.png" />
                    <span class="flex-1">
                        <span class="block text-sm font-bold text-gray-900">七七</span>
                        <span class="block text-[11px] text-gray-400">兴趣伙伴，擅长活动组织</span>
                    </span>
                    <span class="admin-role text-[10px] text-gray-400 font-bold">成员</span>
                </button>
            </div>
        </section>

        <section class="p-4 pb-24">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-sm text-gray-900">成员分类</h2>
                <button class="text-[11px] text-pink-main font-bold">新增分类</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="border border-gray-200 bg-gray-50 p-3">
                    <p class="font-bold text-sm text-gray-900">家人</p>
                    <p class="text-[10px] text-gray-400 mt-1">父母、伴侣、亲属</p>
                </div>
                <div class="border border-gray-200 bg-gray-50 p-3">
                    <p class="font-bold text-sm text-gray-900">朋友</p>
                    <p class="text-[10px] text-gray-400 mt-1">熟人、同学、邻居</p>
                </div>
                <div class="border border-gray-200 bg-gray-50 p-3">
                    <p class="font-bold text-sm text-gray-900">同事</p>
                    <p class="text-[10px] text-gray-400 mt-1">工作协作关系</p>
                </div>
                <div class="border border-gray-200 bg-gray-50 p-3">
                    <p class="font-bold text-sm text-gray-900">兴趣伙伴</p>
                    <p class="text-[10px] text-gray-400 mt-1">活动、空间、爱好</p>
                </div>
            </div>
        </section>
    </main>

    <div class="absolute left-1/2 top-20 -translate-x-1/2 bg-black/70 text-white text-xs px-4 py-2 opacity-0 transition-opacity" id="toast">提示</div>
</div>

<script>
    function selectType(button) {
        document.querySelectorAll('.group-type').forEach((item) => {
            item.classList.remove('type-active');
            item.classList.add('text-gray-600');
        });
        button.classList.add('type-active');
        button.classList.remove('text-gray-600');
    }

    function toggleSwitch(button) {
        button.classList.toggle('on');
    }

    function toggleAdmin(button) {
        const label = button.querySelector('.admin-role');
        button.classList.toggle('admin-active');
        button.classList.toggle('border-pink-main');
        button.classList.toggle('bg-pink-50');
        button.classList.toggle('border-gray-200');
        label.textContent = button.classList.contains('admin-active') ? '管理员' : '成员';
        label.classList.toggle('text-pink-main');
        label.classList.toggle('text-gray-400');
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 1500);
    }
</script>
</body>
</html>
