<style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
        }
        .app-container {
            width: 100%;
            height: 100dvh;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        }
        #toast {
            visibility: hidden;
            min-width: 200px;
            background: rgba(23, 49, 58, .82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            text-align: center;
            padding: 12px 20px;
            position: absolute;
            z-index: 100;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(23, 49, 58, .18);
        }
        #toast.show {
            visibility: visible;
        }
        .protocol-checkbox {
            width: 15px;
            height: 15px;
            border: 1px solid #c9d8dc;
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border-radius: 4px;
        }
        .protocol-checkbox.checked {
            border-color: var(--brand-strong);
            background-color: var(--brand-strong);
        }
        .protocol-checkbox.checked::after {
            content: "✓";
            color: white;
            font-size: 10px;
        }
        .social-tile {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(23, 49, 58, .10);
            transition: transform .12s ease;
        }
        .social-tile:active { transform: scale(.94); }
        .social-tile svg { width: 26px; height: 26px; }
    </style>
</head>

  <div class="bg-white w-full max-w-[300px] overflow-hidden shadow-2xl" style="border-radius: 12px;">
    <div class="p-6 text-center">
      <h3 class="text-[16px] font-bold text-[#17313a] mb-2">完善个人资料</h3>
      <p class="text-[13px] text-gray-400 leading-relaxed">花一点时间，系统为你推荐更优质更合适的内容</p>
    </div>
    <div class="flex border-t border-gray-100">
      <button class="flex-1 py-4 text-[14px] text-gray-400 font-medium" onclick="skipOnboarding()">稍后再说</button>
      <button class="flex-1 py-4 text-[14px] font-bold link-brand" style="border-left: 1px solid rgba(184,233,240,.6);" onclick="startOnboarding()">开始设置</button>
    </div>

<script>
        let isProtocolAgreed = false;

        function toggleCheckbox() {
            const checkbox = document.getElementById('protocolCheckbox');
            isProtocolAgreed = !isProtocolAgreed;
            if (isProtocolAgreed) {
                checkbox.classList.add('checked');
            } else {
                checkbox.classList.remove('checked');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function handleClose() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function handleLogin() {
            if (!isProtocolAgreed) {
                showToast('请先同意用户协议');
                return;
            }
            showToast('一键登录中...');
            setTimeout(() => {
                document.getElementById('onboarding-modal').classList.remove('hidden');
                document.getElementById('onboarding-modal').classList.add('flex');
            }, 1200);
        }

        function startOnboarding() {
            window.location.href = 'onboarding_gender.html';
        }

        function skipOnboarding() {
            window.location.href = 'index.html';
        }

        function handleOtherLogin() {
            showToast('请使用本机号码登录');
        }
    </script>
