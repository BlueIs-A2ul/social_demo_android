<!doctype html>

<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0"
      name="viewport"
    />
    <title>引导页 - 兴趣选择</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <link href="assets/vendor/theme.css" rel="stylesheet" />
    <style>
      body {
        width: 100%;
        height: 100dvh;
        background-color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        overflow: hidden;
        position: relative;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(
          --safe-area-inset-bottom,
          env(safe-area-inset-bottom, 0px)
        );
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="flex flex-col">
    <!-- 顶部：返回 + 跳过 -->
    <div
      class="flex items-center justify-between px-5 pt-3 shrink-0"
      style="padding-top: calc(var(--safe-area-inset-top, 0px) + 12px)"
    >
      <button class="text-[#9fb3b9] text-2xl leading-none" onclick="history.back()">‹</button>
      <a
        class="text-[13px] text-[#9fb3b9] px-4 py-1.5 rounded-full bg-[#f2f7f8]"
        onclick="skipOnboarding()"
        >跳过</a
      >
    </div>
    <!-- 主内容区 -->
    <div class="flex-1 px-6 pt-4 flex flex-col min-h-0">
      <h1
        class="text-[26px] font-bold title-brand leading-snug tracking-wide mb-1"
        id="step-title"
      >
        选择你的文化偏好
      </h1>
      <p class="text-[#9fb3b9] text-[12px] mb-4" id="step-subtitle">
        文化类：艺术、历史、传统、教育等
      </p>
      <!-- 标签选择区 -->
      <div class="flex-1 overflow-y-auto pb-8" id="tag-scroll-area">
        <div class="space-y-6" id="tag-container">
          <!-- 动态填充 -->
        </div>
      </div>
    </div>
    <!-- 底部操作栏 -->
    <div
      class="px-8 py-5 flex items-center justify-center shrink-0"
      style="border-top: 1px solid #eef4f6"
    >
      <button
        class="btn-brand text-base px-12 py-3"
        disabled=""
        id="next-btn"
        onclick="handleNext()"
      >
        下一步
      </button>
    </div>

                '文娱艺术流行文化',
                '新国风文化',
                '职场商务文化',
              ],
            },
          ],
        },
        {
          title: '选择你的<br>兴趣特长',
          subtitle: '兴趣特长类：体育、游戏、音乐、旅游等',
          groups: [
            {
              name: '体育与运动',

              ],

            {

        },
        {
          title: '选择更像你的<br>互动方式',
          subtitle: '这里只用于优化推荐',
          groups: [
            {
              name: '社交能量',
              tags: [
                '外向活跃',
                '安静观察',
                '熟人局更自在',
                '喜欢认识新朋友',
                '慢热型',
                '主动发起话题',
              ],
            },
            {
              name: '表达方式',
              tags: [
                '理性表达',
                '感性表达',
                '幽默轻松',
                '直接坦率',
                '喜欢深聊',
                '喜欢轻松闲聊',
              ],
            },
            {
              name: '探索偏好',
              tags: [
                '好奇心强',
                '喜欢新鲜事物',
                '偏爱稳定熟悉',
                '愿意尝试挑战',
                '喜欢规划',
                '随性自由',
              ],
            },
            {
              name: '相处偏好',
              tags: [
                '重视边界感',
                '重视陪伴感',
                '喜欢团队活动',
                '偏好一对一交流',
                '愿意分享生活',
                '喜欢共同完成任务',
              ],
            },
          ],
        },
      ]

      let currentStep = 0
      let selectedTags = [new Set(), new Set(), new Set()]

      function renderStep() {
        const data = stepData[currentStep]
        document.getElementById('step-title').innerHTML = data.title
        document.getElementById('step-subtitle').innerText = data.subtitle

        const container = document.getElementById('tag-container')
        container.innerHTML = ''

        data.groups.forEach(group => {
          const groupDiv = document.createElement('div')
          groupDiv.innerHTML = `<h3 class="text-[#17313a] font-bold mb-3 text-sm">${group.name}</h3>`

          const grid = document.createElement('div')
          grid.className = 'grid grid-cols-2 gap-3'

          group.tags.forEach(tag => {
            const isSelected = selectedTags[currentStep].has(tag)
            const card = document.createElement('div')
            card.className = `chip text-[13px] ${isSelected ? 'selected' : ''}`
            card.innerText = tag
            card.onclick = () => toggleTag(tag, card)
            grid.appendChild(card)
          })

          groupDiv.appendChild(grid)
          container.appendChild(groupDiv)
        })

        const nextBtn = document.getElementById('next-btn')
        nextBtn.innerText = currentStep === 2 ? '完成' : '下一步'
        updateButtonState()

        document.getElementById('tag-scroll-area').scrollTop = 0
      }

      function toggleTag(tag, element) {
        const currentSelected = selectedTags[currentStep]
        if (currentSelected.has(tag)) {
          currentSelected.delete(tag)
          element.classList.remove('selected')
        } else {
          currentSelected.add(tag)
          element.classList.add('selected')
        }
        updateButtonState()
      }

      function updateButtonState() {
        document.getElementById('next-btn').disabled =
          selectedTags[currentStep].size === 0
      }

      function handleNext() {
        if (currentStep < 2) {
          currentStep++
          renderStep()
        } else {
          window.location.href = 'index.html'
        }
      }

      function skipOnboarding() {
        window.location.href = 'index.html'
      }

      // 初始渲染
      renderStep()
    </script>
  
<script src="assets/vendor/back.js"></script>
</body>
</html>
