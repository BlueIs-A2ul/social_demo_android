<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>雷达 - 智慧空间</title>
<script src="assets/vendor/tailwindcss.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<script src="assets/vendor/iconify-icon.min.js"></script>
<script>window.parent.postMessage({ type: 'setBottomNav', visible: true }, '*')</script>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
    }
    ::-webkit-scrollbar { display: none; }
    button { font: inherit; border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; }
    a { color: inherit; text-decoration: none; }
    .app-container {
        width: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #fff;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    }
    /* ===== 地图区域 ===== */
    .map-area {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
        background: #e8e8e6;
    }
    .map-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
    }
    /* 顶部：地区 / 范围 / 搜索 */
    .map-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 20px 17px 0 16px;
        z-index: 5;
    }
    .drop-wrap {
        position: relative;
        flex: none;
        width: 78px;
        height: 32px;
    }
    .drop-wrap select {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 100%;
        border: 1px solid #abe1e8;
        border-radius: 5px;
        background: #e7f2f4;
        color: #4c4c4c;
        font-size: 15px;
        padding: 0 20px 0 9px;
        outline: none;
        cursor: pointer;
    }
    .drop-wrap .caret {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        display: block;
        width: 11px;
        height: 7px;
    }
    .search-btn {
        margin-left: auto;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
    }
    .search-btn img { width: 27px; height: 27px; display: block; }
    /* 地图中央搜索框（点右上角放大镜展开/收起） */
    .map-search {
        position: absolute;
        top: 68px;
        left: 50%;
        width: 50%;
        max-width: 300px;
        height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px 0 18px;
        background: #fff;
        border: 1px solid #abe1e8;
        border-radius: 19px;
        box-shadow: 0 2px 8px rgba(171, 225, 232, .8);
        z-index: 4;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, -10px);
        transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
    }
    .map-search.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, 0);
        transition-delay: 0s, 0s, 0s;
    }
    .map-search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 15px;
        color: #333;
    }
    .map-search input::placeholder { color: #9a9a9a; }
    .map-search .s-icon {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
    }
    /* 底部两个切换按钮 */
    .map-tabs {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 16px;
        display: flex;
        z-index: 5;
    }
    .map-tab {
        width: 74px;
        height: 29px;
        background: rgba(236, 236, 236, .42);
        box-shadow: 0 4px 10px rgba(179, 179, 179, .6);
        color: #555;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .map-tab:first-child { border-radius: 5px 0 0 5px; }
    .map-tab:last-child { border-radius: 0 5px 5px 0; }
    .map-tab.selected {
        background: rgba(30, 30, 30, .82);
        color: #fff;
        box-shadow: 0 1px 3px rgba(86, 194, 206, 1);
    }
    /* 吉祥物 */
    .mascot-btn {
        position: absolute;
        right: 17px;
        bottom: 54px;
        width: 50px;
        height: 53px;
        z-index: 5;
        display: block;
    }
    .mascot-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
    /* AI 语音上滑面板 */
    .ai-sheet {
        position: absolute;
        inset: 0;
        z-index: 80;
        background: #fff;
        transform: translateY(100%);
        transition: transform .3s cubic-bezier(.2, .8, .2, 1);
        will-change: transform;
    }
    .ai-sheet.open { transform: translateY(0); }
    .ai-sheet iframe { width: 100%; height: 100%; border: 0; display: block; }
    /* ===== 附近推荐 ===== */
    .sheet {
        flex: none;
        position: relative;
        margin: 13px 11px 0;
        background: #fff;
        border-radius: 6px 6px 0 0;
        box-shadow: 0 1px 5px rgba(171, 225, 232, 1);
        padding-bottom: 4px;
    }
    .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 8px 0 12px;
        height: 42px;
        border-bottom: 1px solid #f2f2f2;
    }
    .sheet-title {
        position: relative;
        font-size: 15px;
        color: #333;
        font-weight: 600;
    }
    .gold-badge {
        position: absolute;
        top: -9px;
        left: 26px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        background: var(--gold);
        color: #6b4a00;
        font-size: 10px;
        font-weight: 700;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 1.5px #fff;
    }
    .more-link { font-size: 14px; color: #555; }
    /* 人员行 */
    .person-row {
        display: flex;
        align-items: center;
        height: 51px;
        padding: 0 8px 0 12px;
        border-bottom: 1px solid #f2f2f2;
    }
    .person-row:last-child { border-bottom: 0; }
    .person-avatar {
        width: 35px;
        height: 35px;
        object-fit: cover;
        flex: none;
        border-radius: 6px;
    }
    .person-info { width: 73px; flex: none; margin-left: 8px; min-width: 0; }
    .person-name {
        font-size: 16px;
        line-height: 22px;
        color: #56c2ce;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .person-dist { font-size: 10px; line-height: 14px; color: #888; }
    .person-badges { display: flex; align-items: center; gap: 3px; flex: none; }
    .person-badges .badge-wrap { position: relative; width: 35px; height: 35px; flex: none; }
    .person-badges .badge-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .person-badges .gold-badge.small {
        top: auto;
        left: auto;
        right: -4px;
        bottom: -2px;
        box-shadow: 0 0 0 1.5px #fff;
    }
    .add-btn {
        margin-left: auto;
        width: 51px;
        height: 23px;
        flex: none;
        background: #e1e1e1;
        border-radius: 4px;
        font-size: 12px;
        color: #6a6a6a;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #toast {
        position: fixed;
        left: 50%;
        bottom: 160px;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, .78);
        color: #fff;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 6px;
        z-index: 999;
        display: none;
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- 地图 -->
    <div class="map-area">
        <img class="map-img" src="assets/v2/processed/雷达地图.png" alt="地图"/>

        <div class="map-top">
            <label class="drop-wrap">
                <select id="regionSelect" onchange="showToast(this.value)">
                    <option>新疆</option>
                    <option>乌鲁木齐</option>
                    <option>昌吉</option>
                    <option>呼图壁</option>
                    <option>石河子</option>
                    <option>奎屯</option>
                    <option>克拉玛依</option>
                </select>
                <svg class="caret" width="10" height="6" viewBox="0 0 10 6" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0.5 0.5 L5 5 L9.5 0.5" fill="none" stroke="#4c4c4c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </label>
            <label class="drop-wrap">
                <select id="radiusSelect" onchange="showToast(this.value)">
                    <option>5km</option>
                    <option>10km</option>
                    <option>20km</option>
                    <option>50km</option>
                </select>
                <svg class="caret" width="10" height="6" viewBox="0 0 10 6" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0.5 0.5 L5 5 L9.5 0.5" fill="none" stroke="#4c4c4c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </label>
            <button class="search-btn" aria-label="搜索" onclick="toggleMapSearch()">
                <img src="assets/v2/processed/放大镜-金色.png" alt="搜索"/>
            </button>
        </div>

        <div class="map-search" id="mapSearch">
            <input id="mapSearchInput" type="text" placeholder="搜索关键字" enterkeyhint="search" onkeydown="if (event.key === 'Enter') submitMapSearch()"/>
            <button class="s-icon" aria-label="搜索" onclick="submitMapSearch()">
                <iconify-icon icon="solar:magnifer-linear" style="color: #abe1e8; font-size: 20px"></iconify-icon>
            </button>
        </div>

        <div class="map-tabs">
            <button class="map-tab" id="tabScan" onclick="selectMapTab('tabScan')">雷达扫描</button>
            <button class="map-tab" id="tabNearby" onclick="selectMapTab('tabNearby')">附近的人</button>
        </div>

        <button class="mascot-btn" aria-label="AI 语音" onclick="openAiSheet()">
            <img src="assets/v2/processed/奶油方块吉祥物.png" alt="AI 语音"/>
        </button>
    </div>

    <!-- 附近推荐 -->
    <div class="sheet">
        <div class="sheet-head">
            <span class="sheet-title">
                附近推荐
            </span>
            <button class="more-link" onclick="showToast('更多')">更多&gt;&gt;</button>
        </div>

        <div class="person-row">
            <img class="person-avatar" alt="美美" src="assets/v2/processed/汉库克坐姿.png"/>
            <div class="person-info">
                <div class="person-name">美美</div>
                <div class="person-dist">距你1.54km</div>
            </div>
            <div class="person-badges">
                <span class="badge-wrap"><img src="assets/v2/vip/cat-entertainment.png" alt="VIP"/></span>
                <span class="badge-wrap"><img src="assets/v2/card/idcard.png" alt="个人名片"/></span>
                <span class="badge-wrap"><img src="assets/v2/processed/小房子气泡-橙色.png" alt="房间"/></span>
                <span class="badge-wrap"><img src="assets/v2/processed/金色相机-水晶球.png" alt="TV"/></span>
            </div>
            <button class="add-btn" onclick="showAddFriendModal()">加好友</button>
        </div>

        <div class="person-row">
            <img class="person-avatar" alt="心忧" src="assets/v2/processed/汉库克通缉令.png"/>
            <div class="person-info">
                <div class="person-name">心忧</div>
                <div class="person-dist">距你2.0km</div>
            </div>
            <div class="person-badges">
                <span class="badge-wrap"><img src="assets/v2/vip/cat-tech.png" alt="VIP"/></span>
                <span class="badge-wrap"><img src="assets/v2/card/idcard.png" alt="个人名片"/></span>
                <span class="badge-wrap"><img src="assets/v2/processed/金色相机-水晶球.png" alt="TV"/></span>
            </div>
            <button class="add-btn" onclick="showAddFriendModal()">加好友</button>
        </div>

        <div class="person-row">
            <img class="person-avatar" alt="小慧" src="assets/v2/processed/汉库克头像.png"/>
            <div class="person-info">
                <div class="person-name">小慧</div>
                <div class="person-dist">距你2.6km</div>
            </div>
            <div class="person-badges">
                <span class="badge-wrap"><img src="assets/v2/vip/cat-education.png" alt="VIP"/></span>
                <span class="badge-wrap">
                    <img src="assets/v2/card/company-idcard.png" alt="公司名片"/>
                </span>
            </div>
            <button class="add-btn" onclick="showAddFriendModal()">加好友</button>
        </div>
    </div>
    <!-- AI 语音上滑面板 -->
    <div class="ai-sheet" id="aiSheet">
        <iframe id="aiSheetFrame" src="ai_voice.html" title="AI 语音"></iframe>
    </div>
</div>

<!-- 添加好友弹窗 -->
<div id="addFriendModal" class="fixed inset-0 z-[60] hidden">
    <div class="modal-mask" style="position: absolute; inset: 0; background: rgba(129, 148, 148, .42)" onclick="hideAddFriendModal()"></div>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 77%; max-width: 300px; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, .18)">
        <div class="flex items-center justify-center relative" style="height: 44px">
            <span style="font-size: 15px; font-weight: 700; color: #555">添加好友</span>
            <button aria-label="关闭" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; cursor: pointer" onclick="hideAddFriendModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2.2" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18"></path>
                </svg>
            </button>
        </div>
        <div style="height: 1px; background: #eef4f6"></div>
        <div style="padding: 16px 24px 0">
            <textarea id="addFriendMessage" placeholder="输入验证信息" style="display: block; width: 100%; height: 75px; padding: 10px; box-sizing: border-box; border: 1px solid #f2f2f2; border-radius: 4px; background: #fff; font-size: 14px; color: var(--ink-900); outline: none; resize: none; font-family: inherit"></textarea>
        </div>
        <div class="flex items-center justify-center" style="padding: 20px 0 22px">
            <button class="btn-send" style="min-width: 77px; height: 30px; padding: 0 16px; background: #a5e0ea; color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer" onclick="sendAddFriendRequest()">发送</button>
        </div>
    </div>
</div>
<div id="toast"></div>

<script>
    function selectMapTab(id) {
        document.querySelectorAll('.map-tab').forEach(tab => tab.classList.remove('selected'))
        document.getElementById(id).classList.add('selected')
    }

    function toggleMapSearch() {
        const wrap = document.getElementById('mapSearch')
        const input = document.getElementById('mapSearchInput')
        const show = !wrap.classList.contains('show')
        wrap.classList.toggle('show', show)
        if (show) {
            requestAnimationFrame(function () { input.focus() })
        } else {
            input.value = ''
            input.blur()
        }
    }

    function submitMapSearch() {
        const input = document.getElementById('mapSearchInput')
        const text = (input.value || '').trim()
        showToast(text ? '搜索：' + text : '请输入搜索关键字')
    }

    function showAddFriendModal() {
        document.getElementById('addFriendModal').classList.remove('hidden')
        document.getElementById('addFriendMessage').value = ''
    }

    function hideAddFriendModal() {
        document.getElementById('addFriendModal').classList.add('hidden')
    }

    function sendAddFriendRequest() {
        hideAddFriendModal()
        showToast('信息已发送')
    }

    function showToast(message) {
        const toast = document.getElementById('toast')
        toast.textContent = message
        toast.style.display = 'block'
        clearTimeout(toast._timer)
        toast._timer = setTimeout(() => (toast.style.display = 'none'), 1600)
    }

    function openAiSheet() {
        document.getElementById('aiSheet').classList.add('open')
    }

    function closeAiSheet() {
        document.getElementById('aiSheet').classList.remove('open')
        const frame = document.getElementById('aiSheetFrame')
        if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type: 'blurAiInput' }, '*')
    }

    window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'closeAiVoice') closeAiSheet()
    })
</script>
<script src="assets/vendor/back.js"></script>
</body>
</html>
