      <script>
        let currentOpenIndex = -1
        let targetUserIndex = -1

        function showToast(msg) {
          const toast = document.getElementById('toast')
          toast.innerText = msg
          toast.style.display = 'block'
          setTimeout(() => {
            toast.style.display = 'none'
          }, 2000)
        }

        function toggleIdentityCard(index) {
          const allContents = document.querySelectorAll('.identity-content')
          const allButtons = document.querySelectorAll('.identity-btn')

          if (currentOpenIndex === index) {
            allContents[index].classList.add('hidden')
            allButtons[index].textContent = '虚拟身份证'
            allButtons[index].className =
              'identity-btn px-2 py-1 border border-blue-300 bg-white text-black text-[12px] straight-edge transition-all'
            currentOpenIndex = -1
            return
          }

          if (currentOpenIndex >= 0) {
            allContents[currentOpenIndex].classList.add('hidden')
            allButtons[currentOpenIndex].textContent = '虚拟身份证'
            allButtons[currentOpenIndex].className =
              'identity-btn px-2 py-1 border border-blue-300 bg-white text-black text-[12px] straight-edge transition-all'
          }

          allContents[index].classList.remove('hidden')
          allButtons[index].textContent = '收起身份证'
          allButtons[index].className =
            'identity-btn px-2 py-1 bg-blue-500 text-white text-[12px] straight-edge transition-all'
          currentOpenIndex = index
        }

        function showAddFriendModal(index) {
          targetUserIndex = index
          const modal = document.getElementById('add-friend-modal')
          modal.classList.remove('hidden')
          modal.classList.add('flex')
          document.getElementById('request-message').value =
            '你好，很高兴认识你！'
          document.getElementById('request-message').focus()
        }

        function closeAddFriendModal() {
          const modal = document.getElementById('add-friend-modal')
          modal.classList.add('hidden')
          modal.classList.remove('flex')
        }

        function sendFriendRequest() {
          if (targetUserIndex === -1) return

          const btn = document.getElementById(
            `add-friend-btn-${targetUserIndex}`,
          )
          btn.textContent = '已申请'
          btn.disabled = true
          btn.classList.remove('bg-[#ec4899]')
          btn.classList.add(
            'bg-gray-300',
            'text-gray-500',
            'cursor-not-allowed',
          )
          btn.onclick = e => e.stopPropagation()

          closeAddFriendModal()
          showToast('申请已发送')
          targetUserIndex = -1
        }
