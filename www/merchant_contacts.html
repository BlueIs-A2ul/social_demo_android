<!doctype html>

<html data-immersive-translate-page-theme="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>商家通讯录 - 元宇宙社交</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <style>
      @import url('assets/vendor/inter.css');
      body {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
      }
      .mobile-container {
        width: 100%;
        height: 100dvh;
        background-color: white;
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .active-tab {
        background-color: #ec4899;
        color: white;
        border-color: #ec4899;
      }
      .merchant-card:last-child {
        border-bottom: none;
      }
      .merchant-name {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
      }
      .merchant-vip-badge {
        width: 34px;
        height: auto;
        flex: none;
        object-fit: contain;
        transform: translateY(1px);
      }
    </style>
    <style data-id="immersive-translate-input-injected-css"></style>
  </head>
  <body class="is-mb-ai-setting">
    <div class="mobile-container">
      <!-- 顶部状态栏 -->

        <a class="text-black" href="radar_merchant.html">

        </a>
        <h1 class="text-lg font-bold tracking-tight">商家通讯录</h1>
        <button class="text-black">

            fill="none"
            height="24"
            stroke="currentColor"
            stroke-linecap="butt"
            stroke-linejoin="miter"
            stroke-width="2"
            viewbox="0 0 24 24"
            width="24"
          >
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="12" r="1"></circle>

        </button>
      </header>
      <!-- 搜索栏-->
      <div class="px-4 py-3 bg-white flex-none">
        <div class="flex space-x-0">
          <div class="relative flex-1">
            <span
              class="absolute inset-y-0 left-3 flex items-center text-gray-400"
            >
              <svg
                fill="none"

                stroke="currentColor"
                stroke-width="2"
                viewbox="0 0 24 24"

              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
              </svg>
            </span>
            <input
              class="w-full pl-10 pr-4 py-2 bg-white border border-gray-300 focus:outline-none focus:border-pink-500 text-sm font-light"

              type="text"
            />
          </div>
          <button
            class="bg-[#ec4899] text-white px-5 py-2 text-sm font-bold hover:bg-[#db2777] transition-colors"
            onclick="handleSearch()"

            搜索

        </div>
      </div>
      <!-- 筛选栏 -->
      <div
        class="px-4 pb-3 flex space-x-2 overflow-x-auto hide-scrollbar flex-none bg-white"

        <button
          class="filter-tab whitespace-nowrap px-4 py-1.5 border border-gray-300 text-xs font-bold transition-all active-tab"
          id="tab-all"
          onclick="filterType('all')"

          全部

        <button
          class="filter-tab whitespace-nowrap px-4 py-1.5 border border-gray-300 text-xs font-bold transition-all bg-white text-gray-600"
          id="tab-recent"
          onclick="filterType('recent')"
        >
          最近访客</button>
        <button
          class="bg-white text-gray-600 whitespace-nowrap px-4 py-1.5 border border-gray-300 text-xs font-bold flex items-center"
        >
          分类

            class="ml-1 w-3 h-3"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewbox="0 0 24 24"

          </svg>

        <button

          <a

        <!-- 商家 3 -->

        >
          <img

          />
          <div class="ml-4 flex-1">

            <p class="text-[11px] text-gray-400 mt-1.5">42 件商品</p>

          <a

          <div class="ml-4 flex-1">

            </h3>
            <div class="flex mt-1 space-x-2">

        <!-- 商家 5 -->

          <div class="ml-4 flex-1">

            >

                alt="商家VIP1"
                class="merchant-vip-badge"

              />

            <div class="flex mt-1 space-x-2">

      </main>
      <!-- 空状态提示 (默认隐藏) -->
      <div
        class="hidden flex-1 bg-white flex flex-col items-center justify-center px-10 text-center"
        id="emptyState"
      >
        <div
          class="w-24 h-24 bg-gray-50 flex items-center justify-center text-gray-300 mb-4"
        >
          <svg
            fill="none"
            height="48"
            stroke="currentColor"
            stroke-width="1.5"
            viewbox="0 0 24 24"
            width="48"
          >
            <path d="M21 8l-9-4-9 4v8l9 4 9-4V8z"></path>
            <path d="M3 8l9 4 9-4"></path>
            <path d="M12 12v9"></path>
          </svg>
        </div>
        <p class="text-gray-400 text-sm mb-6">暂无关注的商家</p>
        <button
          class="w-full py-3 bg-[#ec4899] text-white font-bold text-sm tracking-widest hover:bg-[#db2777] transition-colors"
          onclick="resetSearch()"
        >
          去发现商家</button>
      </div>
      <!-- 底部导航 (装饰) -->
    </div>
    <script>
      function filterType(type) {
        const tabs = document.querySelectorAll('.filter-tab')
        tabs.forEach(tab => {
          tab.classList.remove('active-tab')
          tab.classList.add('bg-white', 'text-gray-600')
        })

        const activeTab = document.getElementById(`tab-${type}`)
        activeTab.classList.add('active-tab')
        activeTab.classList.remove('bg-white', 'text-gray-600')

        // 模拟加载最近访客        if (type === 'recent') {
          const cards = document.querySelectorAll('.merchant-card')
          cards.forEach((card, index) => {
            if (index > 2) card.classList.add('hidden')
            else card.classList.remove('hidden')
          })
        } else {
          const cards = document.querySelectorAll('.merchant-card')
          cards.forEach(card => card.classList.remove('hidden'))
        }
        checkEmpty()
      }

      function handleSearch() {
        const query = document.getElementById('searchInput').value.trim()
        const cards = document.querySelectorAll('.merchant-card')
        let found = 0

        cards.forEach(card => {
          const name = card.getAttribute('data-name')
          if (name.includes(query)) {
            card.classList.remove('hidden')
            found++
          } else {
            card.classList.add('hidden')
          }
        })

        checkEmpty()
      }

      function checkEmpty() {
        const visibleCards = document.querySelectorAll(
          '.merchant-card:not(.hidden)',
        )
        const list = document.getElementById('merchantList')
        const empty = document.getElementById('emptyState')

        if (visibleCards.length === 0) {
          list.classList.add('hidden')
          empty.classList.remove('hidden')
        } else {
          list.classList.remove('hidden')
          empty.classList.add('hidden')
        }
      }

      function resetSearch() {
        document.getElementById('searchInput').value = ''
        const cards = document.querySelectorAll('.merchant-card')
        cards.forEach(card => card.classList.remove('hidden'))
        filterType('all')
        checkEmpty()
      }

      // 绑定搜索回车键      document
        .getElementById('searchInput')
        .addEventListener('keypress', function (e) {
          if (e.key === 'Enter') {
            handleSearch()
          }
        })
    </script>
  </body>
</html>
