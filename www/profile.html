<!doctype html>

<html data-immersive-translate-page-theme="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>个人空间 - 智能空间</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <script src="assets/vendor/iconify-icon.min.js"></script>
    <script src="assets/vendor/history-favorites.js"></script>
    <script src="assets/vendor/safe-area.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI',
          Roboto, Helvetica, Arial, sans-serif;
        color: #1f1722;
        background: #f7f7f8;
        background-attachment: fixed;
      }
      ::-webkit-scrollbar {
        display: none;
      }

      /* ====== 设计 token ====== */
      :root {
        --brand: #ec4899;
        --brand-soft: #fdf2f8;
        --brand-line: #fbcfe8;
        --ink-900: #1f1722;
        --ink-700: #4a3f50;
        --ink-500: #8b7e93;
        --ink-100: #f4edf1;
        --shadow-sm: 0 2px 8px rgba(236, 72, 153, .06);
        --shadow-md: 0 6px 18px rgba(31, 23, 34, .06);
      }

      /* ====== 通用 ====== */
      .vip-badge {
        display: inline-block;
        width: 18px;
        height: auto;
        margin-left: 4px;
        vertical-align: -3px;
      }

      /* ====== 头像 / Logo ====== */
      .avatar-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--shadow-md);
        overflow: hidden;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform .12s ease;
      }
      .avatar-ring:active { transform: scale(.94); }
      .avatar-ring img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ====== 搜索条 ====== */
      .search-wrap {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--ink-100);
        border-radius: 8px;
        padding: 0 16px;
        height: 40px;
        transition: box-shadow .15s ease, background .15s ease;
      }
      .search-wrap:focus-within {
        background: #fff;
        box-shadow: 0 0 0 2px var(--brand-line);
      }
      .search-wrap input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: none;
        font-size: 14px;
        color: var(--ink-900);
      }
      .search-wrap input::placeholder { color: var(--ink-500); }

      /* ====== 卡片通用 ====== */
      .soft-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      /* ====== 房间网格 ====== */
      .room-grid-item {
        transition: background-color .15s ease;
      }
      .room-grid-item:active {
        background: rgba(252, 231, 243, .55);
      }
      .room-grid-name {
        font-size: 12px;
        color: var(--ink-700);
        font-weight: 500;
      }

      /* ====== 新闻网格 ====== */
      .news-card {
        position: relative;
        aspect-ratio: 3/4;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition: transform .15s ease, box-shadow .15s ease;
      }
      .news-card:active {
        transform: scale(.97);
      }
      .news-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .news-card .news-card-title {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 6px 8px;
        font-size: 10px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .55) 100%);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ====== 共享菜单（浮在房间项上） ====== */
      .action-menu {
        position: absolute;
        width: 132px;
        background: rgba(255, 255, 255, .92);
        border: 0;
        border-radius: 8px;
        box-shadow: 0 12px 28px rgba(31, 23, 34, .14);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-4px);
        transition: opacity .18s ease, transform .18s ease;
        will-change: opacity, transform;
        overflow: hidden;
      }
      .action-menu.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .action-menu button {
        width: 100%;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border: 0;
        border-bottom: 1px solid rgba(251, 207, 232, .55);
        background: transparent;
        color: var(--ink-700);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
        transition: background-color .15s ease;
      }
      .action-menu button:last-child {
        border-bottom: 0;
      }
      .action-menu button:active {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .room-action-menu { z-index: 40; }

      /* ====== 弹窗 ====== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(31, 23, 34, .42);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
      }
      .modal-overlay.hidden { display: none; }
      .modal-card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        position: relative;
        border-radius: 8px;
        box-shadow: 0 20px 48px rgba(31, 23, 34, .18);
        border: 0;
      }
      .modal-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-500);
        background: transparent;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color .15s ease;
      }
      .modal-close:active { background: var(--ink-100); }

      /* ====== 虚拟身份证字段（保留分隔线、柔化） ====== */
      .idcard-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(251, 207, 232, .55);
      }
      .idcard-avatar {
        width: 56px;
        height: 56px;
        object-fit: cover;
        flex-shrink: 0;
        border-radius: 8px;
        background: var(--ink-100);
      }
      .idcard-name {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink-900);
      }
      .idcard-vid {
        font-size: 11px;
        color: var(--ink-500);
        margin-top: 2px;
      }
      .idcard-field {
        padding: 10px 0;
        border-bottom: 1px solid rgba(251, 207, 232, .45);
        display: flex;
        gap: 12px;
      }
      .idcard-field:last-child { border-bottom: 0; }
      .idcard-field-label {
        width: 72px;
        flex: none;
        color: #be185d;
        font-size: 11px;
        font-weight: 600;
      }
      .idcard-field-value {
        color: var(--ink-900);
        font-size: 12px;
        font-weight: 500;
      }
      .idcard-close-btn {
        padding: 8px 24px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color .15s ease;
      }
      .idcard-close-btn:active { background: var(--brand-line); }

      /* ====== 简历表（保持印刷风格的硬黑边） ====== */
      .resume-clone-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        border: 1px solid #000;
        color: #000;
        background: #fff;
        font-family: SimSun, 'Songti SC', 'Noto Serif SC', serif;
        font-size: 12px;
      }
      .resume-clone-table td {
        border: 1px solid #000;
        padding: 0 6px;
        height: 52px;
        vertical-align: middle;
      }
      .resume-clone-table .resume-top-row td { height: 62px; }
      .resume-clone-table .resume-unit-row td { height: 30px; }
      .resume-label {
        text-align: center;
        font-size: 16px;
        line-height: 1.75;
        font-weight: 400;
        white-space: normal;
      }
      .resume-label-multiline {
        display: inline-block;
        line-height: 1.8;
      }
      .resume-value {
        text-align: left;
        font-size: 11px;
        line-height: 1.35;
        word-break: break-word;
      }
      .resume-photo-cell {
        padding: 8px !important;
        text-align: center;
      }
      .resume-photo-box {
        width: 78px;
        height: 78px;
        margin: 0 auto;
        object-fit: cover;
        border: 1px solid #000;
      }
      .resume-close-btn {
        padding: 8px 24px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .resume-close-btn:active { background: var(--brand-line); }

      /* ====== 社区新闻详情弹窗 ====== */
      .community-news-image {
        width: 100%;
        height: 192px;
        object-fit: cover;
        background: var(--ink-100);
        display: block;
      }
      .community-news-fav-bar {
        flex-shrink: 0;
        padding: 12px 20px;
        background: #fff;
        box-shadow: 0 -4px 12px rgba(31, 23, 34, .04);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .community-news-fav-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink-500);
        background: transparent;
        border: 0;
        cursor: pointer;
        transition: transform .12s ease, color .15s ease;
      }
      .community-news-fav-btn:active { transform: scale(.94); }

      /* ====== 下拉刷新 ====== */
      .pull-to-refresh-indicator {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 10;
        transform: translateY(-100%);
        transition: transform 0.3s ease;
        border-bottom: 1px solid rgba(251, 207, 232, .55);
        border-radius: 0 0 8px 8px;
        will-change: transform;
      }
      .refresh-icon {
        width: 40px;
        height: 40px;
      }
      .refresh-text {
        font-size: 12px;
        color: var(--ink-500);
        margin-top: 4px;
      }

      /* ====== Toast ====== */
      #toast {
        visibility: hidden;
        min-width: 200px;
        background: rgba(31, 23, 34, .78);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #fff;
        text-align: center;
        padding: 12px 20px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 8px;
        font-size: 14px;
        box-shadow: 0 12px 32px rgba(31, 23, 34, .18);
      }
      #toast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from { opacity: 0; transform: translate(-50%, -45%); }
        to   { opacity: 1; transform: translate(-50%, -50%); }
      }
      @keyframes fadeout {
        from { opacity: 1; transform: translate(-50%, -50%); }
        to   { opacity: 0; transform: translate(-50%, -45%); }
      }

      /* ====== 新闻网格动画 ====== */
      .news-item-enter {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 0.3s ease forwards;
      }
      @keyframes fadeInUp {
        to { opacity: 1; transform: translateY(0); }
      }

      /* ====== 视觉精修：柔和圆角与按压反馈（仅样式，不改布局/图片） ====== */
      .room-grid-item {
        border-radius: 8px;
      }
      .room-grid-item > .aspect-square {
        border-radius: 8px;
      }
    </style>
    <style data-id="immersive-translate-input-injected-css"></style>
  </head>
  <body>
    <div
      id="app-root"
      class="w-full h-[100dvh] overflow-hidden flex flex-col relative"
      data-safe-root
      style="padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));"
    >
      <!-- 顶部用户信息区 -->
      <div
        class="flex-none px-5 pt-3 pb-4 flex items-center gap-3"
      >
        <div class="flex items-center gap-3">
          <!-- Logo -->
          <div
            class="avatar-ring"
            onclick="window.location.href='vip_center.html'"
          >
            <img
              alt="标志"
              src="assets/src_01/标志/标志02.jpg"
            />
          </div>
          <!-- 搜索框 -->
          <div class="flex-1 min-w-0">
            <div class="search-wrap">
              <iconify-icon
                style="color: var(--ink-500); font-size: 18px; flex-shrink: 0;"
                icon="solar:magnifer-linear"
              ></iconify-icon>
              <input
                id="headerSearchInput"
                placeholder="搜索"
                type="text"
              />
            </div>
          </div>
        </div>
      </div>
      <!-- 「我的房间」大盒子 -->
      <div
        class="flex-none soft-card mx-5 mt-2"
      >
          <!-- 内部标题行 -->
          <div
            class="px-4 flex items-center justify-center"
          >
            <img alt="社区房间" class="h-12" src="assets/src_01/icon/社区房间.png" />
          </div>
        <!-- Grid 网格 -->
        <div class="grid grid-cols-4">
          <!-- 房间 1 -->
          <div
            class="room-grid-item p-2 flex flex-col items-center cursor-pointer"
            onclick="showRoomProfileMenu(event)"
          >
            <div class="w-full aspect-square mb-1 overflow-hidden">
              <img
                alt="房间缩略图"
                class="w-full h-full object-cover"
                src="assets/packaged/sq/微信图片_20260727180857.jpg"
              />
            </div>
            <span class="room-grid-name whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">王爷府</span>
          </div>
          <!-- 房间 2 -->
          <div
            class="room-grid-item p-2 flex flex-col items-center cursor-pointer"
            onclick="showRoomProfileMenu(event)"
          >
            <div class="w-full aspect-square mb-1 overflow-hidden">
              <img
                alt="房间缩略图"
                class="w-full h-full object-cover"
                src="assets/packaged/a360e987b470405b93134ddbf8e0e7c2.png"
              />
            </div>
            <span class="room-grid-name whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">小美的房间</span>
          </div>
          <!-- 房间 3 -->
          <div
            class="room-grid-item p-2 flex flex-col items-center cursor-pointer"
            onclick="showRoomProfileMenu(event)"
          >
            <div class="w-full aspect-square mb-1 overflow-hidden">
              <img
                alt="房间缩略图"
                class="w-full h-full object-cover"
                src="./assets/shops/shop-coffee-bar.png"
              />
            </div>
            <span class="room-grid-name whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">蓝鹊咖啡</span>
          </div>
          <!-- 房间 4 -->
          <div
            class="room-grid-item p-2 flex flex-col items-center cursor-pointer"
            onclick="showRoomProfileMenu(event)"
          >
            <div class="w-full aspect-square mb-1 overflow-hidden">
              <img
                alt="房间缩略图"
                class="w-full h-full object-cover"
                src="./assets/shops/shop-pizza-front.png"
              />
            </div>
            <span class="room-grid-name whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">布朗披萨</span>
          </div>
          <!-- 房间 5 -->
          <div
            class="room-grid-item p-2 flex flex-col items-center cursor-pointer"
            onclick="showRoomProfileMenu(event)"
          >
            <div class="w-full aspect-square mb-1 overflow-hidden">
              <img
                alt="妮妮的播客"
                class="w-full h-full object-cover"
                src="assets/packaged/sq/妮妮的播客.png"
              />
            </div>
            <span class="room-grid-name whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">妮妮的播客</span>
          </div>
        </div>
      </div>
      <!-- 「社区新闻」大盒子 -->
      <div
        class="flex-none soft-card mx-5 mt-2"
        id="newsContainer"
      >
        <!-- 内部标题行 -->
        <div
          class="px-4 py-3 flex items-center cursor-pointer select-none relative"
          onclick="toggleNews()"
        >
          <div class="flex-1 flex justify-center">
            <img src="assets/src_01/icon/社区新闻.png" alt="社区新闻" class="h-12 w-auto" />
          </div>
          <img class="news-arrow h-4 w-auto absolute right-4" src="assets/src_01/icon/展开状态箭头-removebg-preview.png" alt="展开"/>
        </div>
        <!-- 新闻网格 -->
        <div class="grid grid-cols-3 gap-3 p-3 relative" id="newsList">
          <!-- 下拉刷新指示器 -->
          <div class="pull-to-refresh-indicator hidden" id="pullToRefreshIndicator">
            <img src="assets/src_01/icon/下拉加载图.png" alt="加载中" class="refresh-icon" />
            <span class="refresh-text">下拉刷新...</span>
          </div>
          <!-- 新闻内容由 JavaScript 动态生成 -->
        </div>
      </div>
      <div aria-hidden="true" class="action-menu room-action-menu" id="roomActionMenu">
        <button onclick="handleRoomProfileAction(event, '分享主页')">
          查看分享
        </button>
        <button onclick="handleRoomProfileAction(event, '查看虚拟身份证')">
          查看虚拟身份证
        </button>
        <button onclick="handleRoomProfileAction(event, '查看个人简历')">
          查看个人简历
        </button>
        <button onclick="handleRoomProfileAction(event, '收藏')">
          收藏
        </button>
      </div>
      <!-- 虚拟身份证弹窗 -->
      <div aria-hidden="true" class="modal-overlay hidden" id="idCardModal">
        <div class="modal-card p-5">
          <button aria-label="关闭" class="modal-close" onclick="closeIDCardModal()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
              <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </button>
          <h3 class="text-center font-bold text-base mb-4" style="color: var(--ink-900);">
            虚拟身份证
          </h3>
          <div id="idCardContent"></div>
          <div class="mt-4 flex justify-center">
            <button class="idcard-close-btn" onclick="closeIDCardModal()">
              关闭
            </button>
          </div>
        </div>
      </div>
      <!-- 个人简历弹窗 -->
      <div aria-hidden="true" class="modal-overlay hidden" id="resumeModal">
        <div class="modal-card p-4" style="border: 1px solid #000;">
          <button aria-label="关闭" class="modal-close" onclick="closeResumeModal()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
              <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </button>
          <h2 class="text-center text-lg font-bold mb-4">个人简历</h2>
          <div id="resumeContent"></div>
          <div class="mt-4 flex justify-center">
            <button class="resume-close-btn" onclick="closeResumeModal()">
              关闭
            </button>
          </div>
        </div>
      </div>
      <!-- 社区新闻详情弹窗 -->
      <div aria-hidden="true" class="modal-overlay hidden" id="communityNewsModal">
        <div class="modal-card overflow-hidden flex flex-col" style="max-height:88dvh;">
          <button aria-label="关闭" class="modal-close" onclick="closeCommunityNewsModal()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
          </button>
          <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar">
            <img id="communityNewsImage" class="community-news-image" src="" alt="新闻图片" />
            <div class="p-5">
              <h3 id="communityNewsTitle" class="text-lg font-bold mb-2" style="color: var(--ink-900);"></h3>
              <div id="communityNewsMeta" class="text-xs mb-3" style="color: var(--ink-500);"></div>
              <p id="communityNewsBody" class="text-sm leading-relaxed" style="color: var(--ink-700);"></p>
            </div>
          </div>
          <div class="community-news-fav-bar">
            <button id="communityNewsFavBtn" class="community-news-fav-btn" onclick="toggleCommunityNewsFavorite()">
              <svg id="communityNewsFavIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
              </svg>
              <span id="communityNewsFavText">收藏</span>
            </button>
          </div>
        </div>
      </div>
      <!-- Toast -->
      <div class="" id="toast">进入星河的房间</div>
    </div>
    <script>
      function showToast(msg) {
        const toast = document.getElementById('toast')
        toast.innerText = msg
        toast.className = 'show'
        setTimeout(() => {
          toast.className = toast.className.replace('show', '')
        }, 3000)
      }

      function toggleNews() {
        const list = document.getElementById('newsList')
        const arrow = document.querySelector('.news-arrow')
        if (list.classList.contains('hidden')) {
          list.classList.remove('hidden')
          arrow.src = 'assets/src_01/icon/展开状态箭头-removebg-preview.png'

      // 下拉刷新相关变量
      let startY = 0
      let currentY = 0
      let isPulling = false
      let isRefreshing = false
      const PULL_THRESHOLD = 80

      // 初始化下拉刷新
      function initPullToRefresh() {
        const container = document.getElementById('app-root')
        const indicator = document.getElementById('pullToRefreshIndicator')
        const newsList = document.getElementById('newsList')
        const refreshText = indicator.querySelector('.refresh-text')

        // 触摸开始
        container.addEventListener('touchstart', (e) => {
          if (isRefreshing) return
          startY = e.touches[0].clientY
          isPulling = true
          // 移除过渡动画，让手指跟随更流畅
          indicator.style.transition = 'none'
          newsList.style.transition = 'none'
        }, { passive: true })

        // 触摸移动
        container.addEventListener('touchmove', (e) => {
          if (!isPulling || isRefreshing) return

          currentY = e.touches[0].clientY
          const pullDistance = currentY - startY

          // 只有在页面顶部且向下拉时才触发
          if (window.scrollY <= 0 && pullDistance > 0) {
            e.preventDefault()

            const moveDistance = Math.min(pullDistance * 0.5, 40)

            indicator.classList.remove('hidden')
            // 新闻网格整体跟随移动
            newsList.style.transform = `translateY(${moveDistance}px)`

            if (pullDistance > PULL_THRESHOLD) {
              refreshText.textContent = '释放刷新...'
            } else {
              refreshText.textContent = '下拉刷新...'
            }
          }
        }, { passive: false })

        // 触摸结束
        container.addEventListener('touchend', () => {
          if (!isPulling || isRefreshing) return

          const pullDistance = currentY - startY

          // 恢复过渡动画
          indicator.style.transition = 'transform 0.3s ease'
          newsList.style.transition = 'transform 0.3s ease'

          if (pullDistance > PULL_THRESHOLD) {
            isRefreshing = true
            newsList.style.transform = 'translateY(40px)'
            refreshText.textContent = '刷新中...'

            setTimeout(() => {
              refreshNews()
              hideRefreshIndicator()
              isRefreshing = false
            }, 1500)
          } else {
            hideRefreshIndicator()
          }

          isPulling = false
          startY = 0
          currentY = 0
        })

        // 隐藏刷新指示器
        function hideRefreshIndicator() {
          indicator.style.transform = 'translateY(-100%)'
          newsList.style.transform = 'translateY(0)'
          setTimeout(() => {
            indicator.classList.add('hidden')
          }, 300)
        }
      }

      // 刷新新闻内容
      function refreshNews() {
        const newsList = document.getElementById('newsList')
        const items = newsList.querySelectorAll('.news-card')

        // 添加刷新动画
        items.forEach((item, index) => {
          item.classList.add('news-item-enter')
          item.style.animationDelay = `${index * 0.05}s`
        })

        // 显示刷新成功提示
        showToast('新闻已刷新')

        // 移除动画类
        setTimeout(() => {
          items.forEach(item => {
            item.classList.remove('news-item-enter')
          })
        }, 500)
      }

      // 页面加载时初始化下拉刷新
      document.addEventListener('DOMContentLoaded', () => {
        initPullToRefresh()
      })
    </script>
