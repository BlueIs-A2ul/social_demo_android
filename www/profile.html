      /* Toast 样式 */
      #toast {
        visibility: hidden;
        min-width: 200px;
        background-color: rgba(0, 0, 0, 0.8);
        color: #fff;
        text-align: center;
        padding: 12px 24px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 50px;
        transform: translateX(-50%);
        font-size: 14px;
      }
      #toast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 50px;
          opacity: 1;
        }
      }
      @keyframes fadeout {
        from {
          bottom: 50px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }
      .vip-badge {
        display: inline-block;
        width: 22px;
        height: auto;
        margin-left: 4px;
        vertical-align: -3px;
      }
      .profile-avatar-wrap {
        position: relative;
      }
      .profile-avatar-button {
        width: 64px;
        height: 64px;
        display: block;
        padding: 0;
        border: 0;
        background: transparent;
        border-radius: 9999px;
        overflow: hidden;
        cursor: pointer;
      }
      .avatar-action-menu {
        position: absolute;
        left: 0;
        top: 70px;
        width: 132px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(229, 231, 235, 0.95);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 20;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-4px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .avatar-action-menu.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .avatar-action-menu button {
        width: 100%;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border: 0;
        border-bottom: 1px solid rgba(243, 244, 246, 0.95);
        background: transparent;
        color: #374151;
        font-size: 12px;
        text-align: left;
      }
      .avatar-action-menu button:last-child {
        border-bottom: 0;
      }
      .avatar-action-menu button:active {
        background: rgba(253, 242, 248, 0.95);
        color: #ec4899;
      }
      .room-action-menu {
        position: absolute;
        width: 132px;
        background: rgba(255, 255, 255, 0.92);

    <script>
      function showToast(msg) {
        const toast = document.getElementById('toast')
        toast.innerText = msg
        toast.className = 'show'
        setTimeout(() => {
          toast.className = toast.className.replace('show', '')
        }, 3000)
      }

      function toggleAvatarMenu(event) {
        event.stopPropagation()
        const menu = document.getElementById('avatarActionMenu')
        const button = document.getElementById('avatarActionButton')
        const isOpen = menu.classList.toggle('show')
        menu.setAttribute('aria-hidden', String(!isOpen))
        button.setAttribute('aria-expanded', String(isOpen))
      }

      function closeAvatarMenu() {
        const menu = document.getElementById('avatarActionMenu')
        const button = document.getElementById('avatarActionButton')
        menu.classList.remove('show')
        menu.setAttribute('aria-hidden', 'true')
        button.setAttribute('aria-expanded', 'false')
      }

      function closeRoomProfileMenu() {
        const menu = document.getElementById('roomActionMenu')
        menu.classList.remove('show')
        menu.setAttribute('aria-hidden', 'true')
      }

      function handleAvatarAction(event, label) {
        event.stopPropagation()
        closeAvatarMenu()
        showToast(label)
      }

      function showRoomProfileMenu(event) {
        event.stopPropagation()
        closeAvatarMenu()
        const menu = document.getElementById('roomActionMenu')
        const container = document.querySelector('.max-w-\\[393px\\]')
        const containerRect = container.getBoundingClientRect()
        const targetRect = event.currentTarget.getBoundingClientRect()
        const left = Math.min(
          targetRect.left - containerRect.left,
          containerRect.width - 142,
        )
        const top = targetRect.bottom - containerRect.top + 6
        menu.style.left = Math.max(8, left) + 'px'
        menu.style.top = top + 'px'
        menu.classList.add('show')
        menu.setAttribute('aria-hidden', 'false')
      }

      function handleRoomProfileAction(event, label) {
        event.stopPropagation()
        closeRoomProfileMenu()
        showToast(label)
      }

      document.addEventListener('click', () => {
        closeAvatarMenu()
        closeRoomProfileMenu()
      })
    </script>
