      /* Toast 样式 */
      #toast {
        visibility: hidden;
        min-width: 200px;
        background-color: rgba(0, 0, 0, 0.8);
        color: #fff;
        text-align: center;
        padding: 12px 24px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 50px;
        transform: translateX(-50%);
        font-size: 14px;
      }
      #toast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 50px;
          opacity: 1;
        }
      }
      @keyframes fadeout {
        from {
          bottom: 50px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }
      .vip-badge {
        display: inline-block;
        width: 22px;
        height: auto;
        margin-left: 4px;
        vertical-align: -3px;

      /* 共享菜单样式 */

        position: absolute;
        width: 132px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(229, 231, 235, 0.95);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-4px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
        will-change: opacity, transform;
      }
      .action-menu.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .action-menu button {
        width: 100%;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border: 0;
        border-bottom: 1px solid rgba(243, 244, 246, 0.95);

      }
      .action-menu button:last-child {
        border-bottom: 0;
      }
      .action-menu button:active {
        background: rgba(253, 242, 248, 0.95);
        color: #ec4899;
      }

      .modal-overlay {

      }

        }, 3000)

          list.classList.add('hidden')

      ]

      let currentRoomIndex = 0

      function showIDCard(data) {
        const content = document.getElementById('idCardContent')
        content.innerHTML = `

            <div class="min-w-0">
              <div class="idcard-name">${data.name}</div>
              <div class="text-xs text-gray-400 mt-1">虚拟身份证编号：${data.vId}</div>
            </div>
          </div>
          <div class="pt-1">
            <div class="idcard-field"><span class="idcard-field-label">出生</span><span class="idcard-field-value">${data.birth}</span></div>
            <div class="idcard-field"><span class="idcard-field-label">性别</span><span class="idcard-field-value">${data.gender}</span></div>
            <div class="idcard-field"><span class="idcard-field-label">民族</span><span class="idcard-field-value">${data.ethnic}</span></div>
            <div class="idcard-field"><span class="idcard-field-label">职业</span><span class="idcard-field-value">${data.job}</span></div>
            <div class="idcard-field"><span class="idcard-field-label">职业现状</span><span class="idcard-field-value">${data.jobStatus}</span></div>
            <div class="idcard-field"><span class="idcard-field-label">技能</span><span class="idcard-field-value">${data.skills}</span></div>
            <div class="idcard-field"><span class="idcard-field-label">特长</span><span class="idcard-field-value">${data.specialty}</span></div>
            <div class="idcard-field"><span class="idcard-field-label">爱好</span><span class="idcard-field-value">${data.hobbies}</span></div>
          </div>
        `
        const modal = document.getElementById('idCardModal')
        modal.classList.remove('hidden')
        modal.setAttribute('aria-hidden', 'false')
      }

      function closeIDCardModal() {
        const modal = document.getElementById('idCardModal')
        modal.classList.add('hidden')
        modal.setAttribute('aria-hidden', 'true')
      }

      function showResume(data) {

        content.innerHTML = `
                <table class="resume-clone-table">
                    <colgroup>
                        <col class="resume-col-label" style="width: 16.66%;">
                        <col class="resume-col-value" style="width: 16.66%;">
                        <col class="resume-col-label" style="width: 16.66%;">
                        <col class="resume-col-value" style="width: 16.66%;">
                        <col class="resume-col-photo" style="width: 33.36%;">
                    </colgroup>
                    <tr class="resume-top-row">
                        <td class="resume-label">姓名</td>
                        <td class="resume-value">${data.name}</td>
                        <td class="resume-label">性别</td>
                        <td class="resume-value">${data.gender}</td>
                        <td class="resume-photo-cell" rowspan="3">
                            <img src="${data.avatar}" alt="${data.name}" class="resume-photo-box">
                        </td>
                    </tr>
                    <tr class="resume-top-row">
                        <td class="resume-label">出生</td>

                    <tr class="resume-top-row">

                        <td class="resume-value">${data.job}</td>
                        <td class="resume-label"><span class="resume-label-multiline">职业<br>现状</span></td>
                        <td class="resume-value">${data.jobStatus}</td>
                    </tr>
                    <tr class="resume-unit-row">
                        <td class="resume-label" rowspan="2"><span class="resume-label-multiline">上任单<br>位名称</span></td>
                        <td class="resume-value" colspan="2" rowspan="2">${data.prevUnit}</td>
                        <td class="resume-label">联系人</td>
                        <td class="resume-value">${data.contact}</td>
                    </tr>
                    <tr class="resume-unit-row">
                        <td class="resume-label">电话</td>
                        <td class="resume-value">${data.phone}</td>
                    </tr>
                    <tr>
                        <td class="resume-label"><span class="resume-label-multiline">教育<br>经历</span></td>
                        <td class="resume-value" colspan="4">${data.education}</td>
                    </tr>
                    <tr>
                        <td class="resume-label">技能</td>
                        <td class="resume-value" colspan="4">${data.skills}</td>
                    </tr>

      function closeResumeModal() {
        const modal = document.getElementById('resumeModal')
        modal.classList.add('hidden')
        modal.setAttribute('aria-hidden', 'true')
      }

      function showRoomProfileMenu(event) {
        event.stopPropagation()
        const grid = event.currentTarget.parentElement
        currentRoomIndex = Array.prototype.indexOf.call(
          grid.children,
          event.currentTarget,
        )
        const menu = document.getElementById('roomActionMenu')
        const container = document.getElementById('app-root')
        const containerRect = container.getBoundingClientRect()
        const targetRect = event.currentTarget.getBoundingClientRect()
        const left = Math.min(
          targetRect.left - containerRect.left,
          containerRect.width - 142,
        )
        const top = targetRect.bottom - containerRect.top + 6
        menu.style.left = Math.max(8, left) + 'px'
        menu.style.top = top + 'px'
        menu.classList.add('show')
        menu.setAttribute('aria-hidden', 'false')
      }

      function handleRoomProfileAction(event, label) {
        event.stopPropagation()
        closeRoomProfileMenu()
        const owner = roomOwners[currentRoomIndex] || roomOwners[0]
        if (label === '分享主页') {
          showToast('建设中')
        } else if (label === '查看虚拟身份证') {
          showIDCard(owner)
        } else if (label === '查看个人简历') {
          showResume(owner)
        } else if (label === '收藏') {
          showToast('收藏功能建设中')
        }
      }

      document.addEventListener('click', () => {
        closeRoomProfileMenu()
      })

      // 下拉刷新相关变量
      let startY = 0
      let currentY = 0
      let isPulling = false
      let isRefreshing = false
      const PULL_THRESHOLD = 80

      // 初始化下拉刷新
      function initPullToRefresh() {
        const container = document.getElementById('app-root')
        const indicator = document.getElementById('pullToRefreshIndicator')
        const newsList = document.getElementById('newsList')
        const refreshText = indicator.querySelector('.refresh-text')

        // 触摸开始
        container.addEventListener('touchstart', (e) => {
          if (isRefreshing) return
          startY = e.touches[0].clientY
          isPulling = true
          // 移除过渡动画，让手指跟随更流畅
          indicator.style.transition = 'none'
          newsList.style.transition = 'none'
        }, { passive: true })

        // 触摸移动
        container.addEventListener('touchmove', (e) => {
          if (!isPulling || isRefreshing) return

          currentY = e.touches[0].clientY
          const pullDistance = currentY - startY

          // 只有在页面顶部且向下拉时才触发
          if (window.scrollY <= 0 && pullDistance > 0) {
            e.preventDefault()

            const moveDistance = Math.min(pullDistance * 0.5, 40)

            indicator.classList.remove('hidden')
            // 新闻网格整体跟随移动
            newsList.style.transform = `translateY(${moveDistance}px)`

            if (pullDistance > PULL_THRESHOLD) {
              refreshText.textContent = '释放刷新...'
            } else {
              refreshText.textContent = '下拉刷新...'
            }
          }
        }, { passive: false })

        // 触摸结束
        container.addEventListener('touchend', () => {
          if (!isPulling || isRefreshing) return

          const pullDistance = currentY - startY

          // 恢复过渡动画
          indicator.style.transition = 'transform 0.3s ease'
          newsList.style.transition = 'transform 0.3s ease'

          if (pullDistance > PULL_THRESHOLD) {
            isRefreshing = true
            newsList.style.transform = 'translateY(40px)'
            refreshText.textContent = '刷新中...'

            setTimeout(() => {
              refreshNews()
              hideRefreshIndicator()
              isRefreshing = false
            }, 1500)
          } else {
            hideRefreshIndicator()
          }

          isPulling = false
          startY = 0
          currentY = 0
        })

        // 隐藏刷新指示器
        function hideRefreshIndicator() {
          indicator.style.transform = 'translateY(-100%)'
          newsList.style.transform = 'translateY(0)'
          setTimeout(() => {
            indicator.classList.add('hidden')
          }, 300)
        }
      }

      // 刷新新闻内容
      function refreshNews() {
        const newsList = document.getElementById('newsList')
        const items = newsList.querySelectorAll('.relative')

        // 添加刷新动画
        items.forEach((item, index) => {
          item.classList.add('news-item-enter')
          item.style.animationDelay = `${index * 0.05}s`
        })

        // 显示刷新成功提示
        showToast('新闻已刷新')

        // 移除动画类
        setTimeout(() => {
          items.forEach(item => {
            item.classList.remove('news-item-enter')
          })
        }, 500)
      }

      // 页面加载时初始化下拉刷新
      document.addEventListener('DOMContentLoaded', () => {
        initPullToRefresh()
      })
    </script>
  </body>
</html>
