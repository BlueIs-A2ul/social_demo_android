      /* Toast 样式 */
      #toast {
        visibility: hidden;
        min-width: 200px;
        background-color: rgba(0, 0, 0, 0.8);
        color: #fff;
        text-align: center;
        padding: 12px 24px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        bottom: 50px;
        transform: translateX(-50%);
        font-size: 14px;
      }
      #toast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 50px;
          opacity: 1;
        }
      }
      @keyframes fadeout {
        from {
          bottom: 50px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }
      .vip-badge {
        display: inline-block;
        width: 22px;
        height: auto;
        margin-left: 4px;
        vertical-align: -3px;
      }
      .profile-avatar-wrap {

        width: 64px;

    <script>
      function showToast(msg) {
        const toast = document.getElementById('toast')
        toast.innerText = msg
        toast.className = 'show'
        setTimeout(() => {
          toast.className = toast.className.replace('show', '')
        }, 3000)
      }

      function toggleAvatarMenu(event) {
        event.stopPropagation()
        const menu = document.getElementById('avatarActionMenu')
        const button = document.getElementById('avatarActionButton')
        const isOpen = menu.classList.toggle('show')
        menu.setAttribute('aria-hidden', String(!isOpen))
        button.setAttribute('aria-expanded', String(isOpen))
      }

      function closeAvatarMenu() {
        const menu = document.getElementById('avatarActionMenu')
        const button = document.getElementById('avatarActionButton')
        menu.classList.remove('show')
        menu.setAttribute('aria-hidden', 'true')
        button.setAttribute('aria-expanded', 'false')
      }

      function handleAvatarAction(event, label) {
        event.stopPropagation()
        closeAvatarMenu()
        if (label === '分享主页') {
          location.href = 'publish.html'
        } else if (label === '查看虚拟身份证') {
          showIDCard(userProfile)
        } else if (label === '查看个人简历') {
          showResume(userProfile)
        }
      }

      function showRoomProfileMenu(event) {
        event.stopPropagation()
        closeAvatarMenu()
        const grid = event.currentTarget.parentElement
        currentRoomIndex = Array.prototype.indexOf.call(
          grid.children,
          event.currentTarget,
        )
        const menu = document.getElementById('roomActionMenu')
        const container = document.getElementById('app-root')
        const containerRect = container.getBoundingClientRect()
        const targetRect = event.currentTarget.getBoundingClientRect()
        const left = Math.min(
          targetRect.left - containerRect.left,
          containerRect.width - 142,
        )
        const top = targetRect.bottom - containerRect.top + 6
        menu.style.left = Math.max(8, left) + 'px'
        menu.style.top = top + 'px'
        menu.classList.add('show')
        menu.setAttribute('aria-hidden', 'false')
      }

      function handleRoomProfileAction(event, label) {
        event.stopPropagation()
        closeRoomProfileMenu()
        const owner = roomOwners[currentRoomIndex] || roomOwners[0]
        if (label === '分享主页') {
          showToast('建设中')
        } else if (label === '查看虚拟身份证') {
          showIDCard(owner)
        } else if (label === '查看个人简历') {
          showResume(owner)
        }
      }

      document.addEventListener('click', () => {
        closeAvatarMenu()
        closeRoomProfileMenu()
      })
