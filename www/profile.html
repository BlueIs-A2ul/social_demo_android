<!doctype html>

<html data-immersive-translate-page-theme="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>个人空间 - 智能空间</title>
    <script src="assets/vendor/tailwindcss.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
    <script>
      (function () {
        try {
          if (window.parent !== window) {
            window.parent.postMessage({ type: 'setBottomNav', visible: true }, '*')
          }
        } catch (e) {}
      })();
    </script>
    <script src="assets/vendor/iconify-icon.min.js"></script>
    <script src="assets/vendor/history-favorites.js"></script>
    <script src="assets/vendor/safe-area.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI',
          Roboto, Helvetica, Arial, sans-serif;
        color: #17313a;
        background: #fff;
        background-attachment: fixed;
      }
      ::-webkit-scrollbar {
        display: none;
      }

      /* ====== 设计 token ====== */
      :root {
        --brand: #26c6da;
        --brand-soft: #f2fcfd;
        --brand-line: #b8e9f0;
        --ink-900: #17313a;
        --ink-700: #3f5b64;
        --ink-500: #8aa0a8;
        --ink-100: #eef4f6;
        --shadow-sm: 0 2px 8px rgba(38, 198, 218, .06);
        --shadow-md: 0 6px 18px rgba(31, 23, 34, .06);
      }

      /* ====== 通用 ====== */
      .vip-badge {
        display: inline-block;
        width: 18px;
        height: auto;
        margin-left: 4px;
        vertical-align: -3px;
      }

      /* ====== 头像 / Logo ====== */
      .avatar-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #fff;
        box-shadow: var(--shadow-md);
        overflow: hidden;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform .12s ease;
      }
      .avatar-ring:active { transform: scale(.94); }
      .avatar-ring img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ====== 搜索条 ====== */
      .search-wrap {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--ink-100);
        border-radius: 8px;
        padding: 0 16px;
        height: 40px;
        transition: box-shadow .15s ease, background .15s ease;
      }
      .search-wrap:focus-within {
        background: #fff;
        box-shadow: 0 0 0 2px var(--brand-line);
      }
      .search-wrap input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: none;
        font-size: 14px;
        color: var(--ink-900);
      }
      .search-wrap input::placeholder { color: var(--ink-500); }
      .btn-search {
        flex-shrink: 0;
        height: 28px;
        padding: 0 14px;
        background: var(--brand);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(38, 198, 218, .25);
        transition: transform .12s ease;
      }
      .btn-search:active { transform: scale(.94); }

      /* ====== 卡片通用 ====== */
      .soft-card {
        background: #fff;
        border-radius: 8px;
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      /* ====== 内部标题行彩色横条背景 ====== */
      .title-strip {
        background: transparent;
      }

      /* ====== 房间网格 ====== */
      .room-section {
        flex: none;
        padding: 24px 21px 0;
      }
      .room-grid-v2 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        column-gap: 18px;
        row-gap: 22px;
      }
      .room-grid-item {
        cursor: pointer;
      }
      .room-grid-item:active .room-tile {
        transform: scale(.96);
      }
      .room-tile {
        position: relative;
        width: 100%;
        aspect-ratio: 1/1;
        transition: transform .12s ease;
      }
      .room-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 12px;
      }
      .pin-pill {
        position: absolute;
        top: -5px;
        right: -3px;
        height: 15px;
        padding: 0 3px;
        border-radius: 9999px;
        background: #56C2CE;
        color: #fff;
        font-size: 10px;
        line-height: 15px;
        white-space: nowrap;
      }
      .room-grid-name {
        margin-top: 14px;
        font-size: 13px;
        color: #555;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      /* ====== 新闻网格（两列卡片 + 赞/星底栏） ====== */
      .news-card {
        position: relative;
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
        background: #fff;
        transition: transform .15s ease, box-shadow .15s ease;
      }
      .news-card:active {
        transform: scale(.97);
      }
      .news-card .news-card-img {
        width: 100%;
        aspect-ratio: 4/3;
        overflow: hidden;
      }
      .news-card .news-card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .news-card .news-card-body {
        padding: 8px;
      }
      .news-card .news-card-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-900);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .news-card .news-card-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
        font-size: 11px;
        color: var(--ink-500);
      }
      .news-card .news-card-meta span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .news-card .news-card-meta img,
      .news-card .news-card-meta iconify-icon {
        width: 14px;
        height: 14px;
        font-size: 14px;
        object-fit: contain;
      }
      /* ====== 标题行角标 ====== */
      .badge-dot {
        position: absolute;
        top: -5px;
        right: -6px;
        min-width: 15px;
        height: 15px;
        padding: 0 3px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 1.5px #fff;
      }

      /* ====== 顶部渐变头 ====== */
      .home-header {
        position: relative;
        flex: none;
        background: linear-gradient(180deg, #56c2ce 0%, #62c7d2 18%, #8ed6de 62%, #d7f1f4 100%);
        padding: 7px 23px 8px 25px;
      }
      .hh-row {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .hh-logo {
        width: 57px;
        height: 57px;
        flex: none;
        cursor: pointer;
      }
      .hh-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .hh-search {
        flex: 1;
        min-width: 0;
        height: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        background: #fff;
        border-radius: 9999px;
      }
      .hh-search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 13px;
        color: var(--ink-900);
      }
      .hh-msg {
        position: relative;
        flex: none;
        width: 32px;
        height: 32px;
        cursor: pointer;
      }
      .hh-msg img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        display: block;
      }
      .hh-banner-wrap {
        display: flex;
        justify-content: center;
        margin-top: 9px;
      }
      .hh-banner {
        height: 44px;
        width: auto;
        display: block;
      }
      .hh-chevron {
        position: absolute;
        right: 19px;
        bottom: 15px;
        cursor: pointer;
      }
      .hh-chevron img {
        width: 28px;
        height: auto;
        display: block;
        transition: transform .18s ease;
      }
      .badge-square {
        position: absolute;
        min-width: 15px;
        height: 15px;
        padding: 0 2px;
        box-sizing: border-box;
        background: #FFF849;
        color: #000;
        font-size: 11px;
        font-weight: 700;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge-round {
        position: absolute;
        min-width: 16px;
        height: 16px;
        box-sizing: border-box;
        border-radius: 9999px;
        background: #FF736B;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hh-msg .badge-square { top: -13px; right: -11px; }
      .hh-msg .badge-round { top: -3px; right: -11px; }
      .hh-chevron .badge-square { top: -8px; right: -6px; }

      /* ====== 社区新闻横幅带 ====== */
      .news-section {
        flex: none;
        margin-top: 24px;
      }
      .news-band {
        position: relative;
        height: 66px;
        display: flex;
        align-items: center;
        padding: 0 19px 0 8px;
        background: linear-gradient(180deg, #d9f2f5 0%, #56c2ce 12%, #8ed6de 55%, #c1e9ee 100%);
        cursor: pointer;
        user-select: none;
      }
      .news-banner {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        height: 44px;
        width: auto;
      }
      .news-band-icons {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nb-ico {
        position: relative;
        width: 30px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nb-ico img {
        max-width: 28px;
        max-height: 26px;
        object-fit: contain;
        transition: transform .18s ease;
      }
      .nb-ico .badge-square { top: -12px; right: -4px; }
      .nb-ico .badge-round { top: 1px; right: -8px; }
      .news-arrow { margin-left: auto; width: 34px; }
      .news-arrow img { max-height: 30px; }
      .news-arrow .badge-square { top: -10px; right: 0; }

      /* ====== 共享菜单（浮在房间项上） ====== */
      .action-menu {
        position: absolute;
        width: 132px;
        background: rgba(255, 255, 255, .92);
        border: 0;
        border-radius: 8px;
        box-shadow: 0 12px 28px rgba(31, 23, 34, .14);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-4px);
        transition: opacity .18s ease, transform .18s ease;
        will-change: opacity, transform;
        overflow: hidden;
      }
      .action-menu.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .action-menu button {
        width: 100%;
        height: 34px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border: 0;
        border-bottom: 1px solid rgba(184, 233, 240, .55);
        background: transparent;
        color: var(--ink-700);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
        transition: background-color .15s ease;
      }
      .action-menu button:last-child {
        border-bottom: 0;
      }
      .action-menu button:active {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .room-action-menu button.disabled {
        color: #c3c3c3;
        cursor: default;
      }
      .room-action-menu button.disabled:active {
        background: transparent;
        color: #c3c3c3;
      }
      .room-action-menu { z-index: 40; }

      /* ====== 弹窗 ====== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(31, 23, 34, .42);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
      }
      .modal-overlay.hidden { display: none; }
      .modal-card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        position: relative;
        border-radius: 8px;
        box-shadow: 0 20px 48px rgba(31, 23, 34, .18);
        border: 0;
      }
      .modal-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-500);
        background: transparent;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color .15s ease;
      }
      .modal-close:active { background: var(--ink-100); }

      /* ====== 个人名片字段（保留分隔线、柔化） ====== */
      .idcard-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(184, 233, 240, .55);
      }
      .idcard-avatar {
        width: 56px;
        height: 56px;
        object-fit: cover;
        flex-shrink: 0;
        border-radius: 8px;
        background: var(--ink-100);
      }
      .idcard-name {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink-900);
      }
      .idcard-vid {
        font-size: 11px;
        color: var(--ink-500);
        margin-top: 2px;
      }
      .idcard-field {
        padding: 10px 0;
        border-bottom: 1px solid rgba(184, 233, 240, .45);
        display: flex;
        gap: 12px;
      }
      .idcard-field:last-child { border-bottom: 0; }
      .idcard-field-label {
        width: 72px;
        flex: none;
        color: #00838f;
        font-size: 11px;
        font-weight: 600;
      }
      .idcard-field-value {
        color: var(--ink-900);
        font-size: 12px;
        font-weight: 500;
      }
      .idcard-close-btn {
        padding: 8px 24px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color .15s ease;
      }
      .idcard-close-btn:active { background: var(--brand-line); }

      /* ====== 简历表（保持印刷风格的硬黑边） ====== */
      .resume-clone-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        border: 1px solid #000;
        color: #000;
        background: #fff;
        font-family: SimSun, 'Songti SC', 'Noto Serif SC', serif;
        font-size: 12px;
      }
      .resume-clone-table td {
        border: 1px solid #000;
        padding: 0 6px;
        height: 52px;
        vertical-align: middle;
      }
      .resume-clone-table .resume-top-row td { height: 62px; }
      .resume-clone-table .resume-unit-row td { height: 30px; }
      .resume-label {
        text-align: center;
        font-size: 16px;
        line-height: 1.75;
        font-weight: 400;
        white-space: normal;
      }
      .resume-label-multiline {
        display: inline-block;
        line-height: 1.8;
      }
      .resume-value {
        text-align: left;
        font-size: 11px;
        line-height: 1.35;
        word-break: break-word;
      }
      .resume-photo-cell {
        padding: 8px !important;
        text-align: center;
      }
      .resume-photo-box {
        width: 78px;
        height: 78px;
        margin: 0 auto;
        object-fit: cover;
        border: 1px solid #000;
      }
      .resume-close-btn {
        padding: 8px 24px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .resume-close-btn:active { background: var(--brand-line); }

      /* ====== 社区新闻详情弹窗 ====== */
      .community-news-image {
        width: 100%;
        height: 192px;
        object-fit: cover;
        background: var(--ink-100);
        display: block;
      }
      .community-news-fav-bar {
        flex-shrink: 0;
        padding: 12px 20px;
        background: #fff;
        box-shadow: 0 -4px 12px rgba(31, 23, 34, .04);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .community-news-fav-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink-500);
        background: transparent;
        border: 0;
        cursor: pointer;
        transition: transform .12s ease, color .15s ease;
      }
      .community-news-fav-btn:active { transform: scale(.94); }

      /* ====== 下拉刷新 ====== */
      .pull-to-refresh-indicator {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 10;
        transform: translateY(-100%);
        transition: transform 0.3s ease;
        border-bottom: 1px solid rgba(184, 233, 240, .55);
        border-radius: 0 0 8px 8px;
        will-change: transform;
      }
      .refresh-icon {
        width: 40px;
        height: 40px;
      }
      .refresh-text {
        font-size: 12px;
        color: var(--ink-500);
        margin-top: 4px;
      }

      /* ====== Toast ====== */
      #toast {
        visibility: hidden;
        min-width: 200px;
        background: rgba(31, 23, 34, .78);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #fff;
        text-align: center;
        padding: 12px 20px;
        position: fixed;
        z-index: 1000;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 8px;
        font-size: 14px;
        box-shadow: 0 12px 32px rgba(31, 23, 34, .18);
      }
      #toast.show {
        visibility: visible;
        animation:
          fadein 0.5s,
          fadeout 0.5s 2.5s;
      }
      @keyframes fadein {
        from { opacity: 0; transform: translate(-50%, -45%); }
        to   { opacity: 1; transform: translate(-50%, -50%); }
      }
      @keyframes fadeout {
        from { opacity: 1; transform: translate(-50%, -50%); }
        to   { opacity: 0; transform: translate(-50%, -45%); }
      }

      /* ====== 新闻网格动画 ====== */
      .news-item-enter {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 0.3s ease forwards;
      }
      @keyframes fadeInUp {
        to { opacity: 1; transform: translateY(0); }
      }

      /* ====== 视觉精修：按压反馈（仅样式，不改布局/图片） ====== */
    </style>
    <style data-id="immersive-translate-input-injected-css"></style>
  </head>
  <body>
    <div
      id="app-root"
      class="w-full min-h-[100dvh] flex flex-col relative"
      data-safe-root
      style="padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));"
    >
      <!-- 顶部渐变头：Logo / 搜索 / 消息 / 社区空间横幅 -->
      <div class="home-header">
        <div class="hh-row">
          <div class="hh-logo" onclick="window.location.href='vip_center.html'">
            <img alt="标志" src="assets/new_src/logo-cy.png" />
          </div>
          <label class="hh-search" aria-label="搜索">
            <input
              id="headerSearchInput"
              type="text"
              onkeydown="if (event.key === 'Enter') handleHeaderSearch()"
            />
            <iconify-icon
              style="color: #56C2CE; font-size: 21px; flex-shrink: 0"
              icon="solar:magnifer-linear"
            ></iconify-icon>
          </label>
          <div class="hh-msg" onclick="window.location.href='message_center.html?from=profile'">
            <img alt="消息" src="assets/v2/processed/聊天气泡-金色.png" />
            <span class="badge-round">1</span>
          </div>
        </div>
        <div class="hh-banner-wrap">
          <img class="hh-banner" alt="社区空间" src="assets/src_01/icon/社区空间.png" />
        </div>
        <div class="hh-chevron" onclick="toggleRooms()">
          <img alt="收起/展开" src="assets/v2/processed/双下箭头-银色.png" />
        </div>
      </div>
      <!-- 社区空间：房间网格 -->
      <div class="room-section" id="roomSection">
        <div class="room-grid-v2">
          <!-- 房间 1 -->
          <div class="room-grid-item flex flex-col items-center" onclick="showRoomProfileMenu(event)">
            <div class="room-tile">
              <img
                alt="雅柔的房间"
                class="w-full h-full object-cover"
                src="assets/v2/processed/井上织姬头像.png"
              />
              <span class="pin-pill">置顶</span>
            </div>
            <span class="room-grid-name">雅柔的房间</span>
          </div>
          <!-- 房间 2 -->
          <div class="room-grid-item flex flex-col items-center" onclick="showRoomProfileMenu(event)">
            <div class="room-tile">
              <img
                alt="碧晨的房间"
                class="w-full h-full object-cover"
                src="assets/v2/processed/纲手头像.png"
              />
              <span class="pin-pill">置顶</span>
            </div>
            <span class="room-grid-name">碧晨的房间</span>
          </div>
          <!-- 房间 3 -->
          <div class="room-grid-item flex flex-col items-center" onclick="showRoomProfileMenu(event)">
            <div class="room-tile">
              <img
                alt="童灵的房间"
                class="w-full h-full object-cover"
                src="assets/v2/processed/不知火舞头像.png"

          grid.children,
          event.currentTarget,
        )
        const menu = document.getElementById('roomActionMenu')
        const container = document.getElementById('app-root')
        const containerRect = container.getBoundingClientRect()
        const targetRect = event.currentTarget.getBoundingClientRect()
        const left = Math.min(
          targetRect.left - containerRect.left,
          containerRect.width - 142,
        )
        const top = targetRect.bottom - containerRect.top + 6
        menu.style.left = Math.max(8, left) + 'px'
        menu.style.top = top + 'px'
        menu.classList.add('show')
        menu.setAttribute('aria-hidden', 'false')
        const owner = roomOwners[currentRoomIndex] || roomOwners[0]
        const resumeBtn = document.getElementById('roomResumeBtn')
        if (resumeBtn) {
          resumeBtn.classList.toggle('disabled', !owner.isFriend)
        }
      }

      let currentCommunityNews = null

      function renderCommunityNews() {
        const newsList = document.getElementById('newsList')
        // 保留刷新指示器
        const indicator = document.getElementById('pullToRefreshIndicator')
        newsList.innerHTML = ''
        if (indicator) newsList.appendChild(indicator)
        communityNewsData.forEach((item) => {
          const card = document.createElement('div')
          card.className = 'news-card'
          card.innerHTML =
            '<div class="news-card-img"><img src="' + item.image + '" alt="' + item.title + '" /></div>' +
            '<div class="news-card-body">' +
            '<div class="news-card-title">' + item.title + '</div>' +
            '<div class="news-card-meta">' +
            '<span><iconify-icon icon="solar:heart-linear"></iconify-icon>' + item.likes + '</span>' +
            '<span><iconify-icon icon="solar:star-linear"></iconify-icon>' + item.stars + '</span>' +
            '</div></div>'
          card.addEventListener('click', () => openCommunityNews(item))
          newsList.appendChild(card)
        })
      }

      function openCommunityNews(item) {
        currentCommunityNews = item
        document.getElementById('communityNewsImage').src = item.image
        document.getElementById('communityNewsTitle').textContent = item.title
        document.getElementById('communityNewsMeta').textContent =
          item.source + ' · ' + item.time
        document.getElementById('communityNewsBody').textContent = item.body

        // 初始化收藏按钮状态
        updateCommunityNewsFavBtn()

        const modal = document.getElementById('communityNewsModal')
        modal.classList.remove('hidden')
        modal.setAttribute('aria-hidden', 'false')

        // 写入浏览历史
        window.HistoryFavorites.addHistory({
          id: 'communityNews_' + item.id,
          source: 'communityNews',
          data: {
            title: item.title,
            desc: item.source + ' · ' + item.time,
            image: item.image,
            body: item.body,
          },
        })
      }

      function closeCommunityNewsModal() {
        const modal = document.getElementById('communityNewsModal')
        modal.classList.add('hidden')
        modal.setAttribute('aria-hidden', 'true')
      }

      function updateCommunityNewsFavBtn() {
        if (!currentCommunityNews) return
        const id = 'communityNews_' + currentCommunityNews.id
        const isFav = window.HistoryFavorites.isFavorited(id, 'communityNews')
        const icon = document.getElementById('communityNewsFavIcon')
        const text = document.getElementById('communityNewsFavText')
        if (isFav) {
          icon.setAttribute('fill', '#26c6da')
          icon.style.color = '#26c6da'
          text.textContent = '已收藏'
          text.style.color = '#26c6da'
        } else {
          icon.setAttribute('fill', 'none')
          icon.style.color = ''
          text.textContent = '收藏'
          text.style.color = ''
        }
      }

      function toggleCommunityNewsFavorite() {
        if (!currentCommunityNews) return
        const item = {
          id: 'communityNews_' + currentCommunityNews.id,
          source: 'communityNews',
          data: {
            title: currentCommunityNews.title,
            desc: currentCommunityNews.source + ' · ' + currentCommunityNews.time,
            image: currentCommunityNews.image,
            body: currentCommunityNews.body,
          },
        }
        const fav = window.HistoryFavorites.toggleFavorite(item)
        updateCommunityNewsFavBtn()
        showToast(fav ? '已收藏' : '已取消收藏')
      }

      // 初始渲染社区新闻
      renderCommunityNews()

      document.addEventListener('click', () => {
        closeRoomProfileMenu()
      })

      // 下拉刷新相关变量
      let startY = 0
      let currentY = 0
      let isPulling = false
      let isRefreshing = false
      const PULL_THRESHOLD = 80

      // 初始化下拉刷新
      function initPullToRefresh() {
        const container = document.getElementById('app-root')
        const indicator = document.getElementById('pullToRefreshIndicator')
        const newsList = document.getElementById('newsList')
        const refreshText = indicator.querySelector('.refresh-text')

        // 触摸开始
        container.addEventListener('touchstart', (e) => {
          if (isRefreshing) return
          startY = e.touches[0].clientY
          isPulling = true
          // 移除过渡动画，让手指跟随更流畅
          indicator.style.transition = 'none'
          newsList.style.transition = 'none'
        }, { passive: true })

        // 触摸移动
        container.addEventListener('touchmove', (e) => {
          if (!isPulling || isRefreshing) return

          currentY = e.touches[0].clientY
          const pullDistance = currentY - startY

          // 只有在页面顶部且向下拉时才触发
          if (window.scrollY <= 0 && pullDistance > 0) {
            e.preventDefault()

            const moveDistance = Math.min(pullDistance * 0.5, 40)

            indicator.classList.remove('hidden')
            // 新闻网格整体跟随移动
            newsList.style.transform = `translateY(${moveDistance}px)`

            if (pullDistance > PULL_THRESHOLD) {
              refreshText.textContent = '释放刷新...'
            } else {
              refreshText.textContent = '下拉刷新...'
            }
          }
        }, { passive: false })

        // 触摸结束
        container.addEventListener('touchend', () => {
          if (!isPulling || isRefreshing) return

          const pullDistance = currentY - startY

          // 恢复过渡动画
          indicator.style.transition = 'transform 0.3s ease'
          newsList.style.transition = 'transform 0.3s ease'

          if (pullDistance > PULL_THRESHOLD) {
            isRefreshing = true
            newsList.style.transform = 'translateY(40px)'
            refreshText.textContent = '刷新中...'

            setTimeout(() => {
              refreshNews()
              hideRefreshIndicator()
              isRefreshing = false
            }, 1500)
          } else {
            hideRefreshIndicator()
          }

          isPulling = false
          startY = 0
          currentY = 0
        })

        // 隐藏刷新指示器
        function hideRefreshIndicator() {
          indicator.style.transform = 'translateY(-100%)'
          newsList.style.transform = 'translateY(0)'
          setTimeout(() => {
            indicator.classList.add('hidden')
          }, 300)
        }
      }

      // 刷新新闻内容
      function refreshNews() {
        const newsList = document.getElementById('newsList')
        const items = newsList.querySelectorAll('.news-card')

        // 添加刷新动画
        items.forEach((item, index) => {
          item.classList.add('news-item-enter')
          item.style.animationDelay = `${index * 0.05}s`
        })

        // 显示刷新成功提示
        showToast('新闻已刷新')

        // 移除动画类
        setTimeout(() => {
          items.forEach(item => {
            item.classList.remove('news-item-enter')
          })
        }, 500)
      }

      // 页面加载时初始化下拉刷新
      document.addEventListener('DOMContentLoaded', () => {
        initPullToRefresh()
      })
    </script>
