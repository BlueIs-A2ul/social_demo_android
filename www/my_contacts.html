            const content = header.nextElementSibling;

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                arrow.style.transform = 'rotate(0deg)';
                arrow.textContent = '▶';
            } else {
                content.classList.add('expanded');
                arrow.style.transform = 'rotate(0deg)';
                arrow.textContent = '▼';
            }
        }

        // Inline ID Card toggle

            const expandDiv = document.getElementById(`id-expand-${id}`);

            document.querySelectorAll('[id^="id-expand-"]').forEach(div => {
                div.classList.add('hidden');
            });

        function closeResumeModal() {
            document.getElementById('resumeModal').classList.add('hidden');
        }

        // Add Group Logic
        function openAddGroupModal() {
            document.getElementById('addGroupModal').classList.remove('hidden');
        }

        function closeAddGroupModal() {
            document.getElementById('addGroupModal').classList.add('hidden');
            document.getElementById('groupNameInput').value = '';
        }

        function confirmAddGroup() {
            const name = document.getElementById('groupNameInput').value.trim();
            if (!name) return;

            const groupList = document.getElementById('groupList');
            const newGroup = document.createElement('div');
            newGroup.className = 'group-item border-b border-gray-100';
            newGroup.innerHTML = `
                <div onclick="toggleGroup(this)" class="group-header px-4 py-3 flex items-center justify-between cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                    <div class="flex items-center space-x-2">
                        <span class="arrow transition-transform duration-200">▶</span>
                        <span class="font-bold text-sm">${name}（0）</span>
                    </div>
                </div>
                <div class="group-content">
                    <div class="p-8 text-center text-gray-400 text-xs">该分组暂无好友</div>
                </div>
            `;
            groupList.appendChild(newGroup);
            
            closeAddGroupModal();
            showToast();
        }

        // 全部 / 在线 筛选
        let contactFilterMode = 'all';

        function applyContactFilter() {
            const keyword = (document.getElementById('contactSearch').value || '').trim();
            document.querySelectorAll('.contact-row').forEach(row => {
                const onlineOk = contactFilterMode === 'all' || row.dataset.online === '1';
                const nameOk = !keyword || (row.dataset.name || '').includes(keyword);
                row.style.display = onlineOk && nameOk ? '' : 'none';
            });
            document.querySelectorAll('.contact-letter').forEach(letter => {
                let next = letter.nextElementSibling;
                let visible = false;
                while (next && next.classList.contains('contact-row')) {
                    if (next.style.display !== 'none') visible = true;
                    next = next.nextElementSibling;
                }
                letter.style.display = visible ? '' : 'none';
            });
        }

        function setContactFilter(mode) {
            contactFilterMode = mode;
            const on = mode === 'online';
            const allBtn = document.getElementById('filter-all');
            const onlineBtn = document.getElementById('filter-online');
            allBtn.style.background = on ? '#fff' : 'var(--brand-strong)';
            allBtn.style.color = on ? 'var(--ink-700)' : '#fff';
            allBtn.style.border = on ? '1px solid var(--brand-line)' : '0';
            onlineBtn.style.background = on ? 'var(--brand-strong)' : '#fff';
            onlineBtn.style.color = on ? '#fff' : 'var(--ink-700)';
            onlineBtn.style.border = on ? '0' : '1px solid var(--brand-line)';
            applyContactFilter();
        }

        function filterContacts() {
            applyContactFilter();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (msg) toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }
    </script>
