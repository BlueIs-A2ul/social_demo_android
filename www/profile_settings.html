<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>我的 - 智慧空间</title>
<script src="assets/vendor/tailwindcss.js"></script>
<script src="assets/vendor/iconify-icon.min.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<script>window.parent.postMessage({ type: 'setBottomNav', visible: true }, '*')</script>
<style>
        body {
            margin: 0;
            background: var(--page-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        ::-webkit-scrollbar { display: none; }
        .my-head {
            background: linear-gradient(160deg, var(--brand) 0%, var(--brand-strong) 55%, var(--brand-deep) 100%);
        }
        .my-pill {
            background: #fff;
            border: 1px solid var(--brand-line);
            color: var(--ink-700);
        }
        .my-pill:active { background: var(--brand-tint); }
        .vip-badge {
            display: inline-block;
            width: 18px;
            height: auto;
            margin-left: 4px;
            vertical-align: -4px;
        }
        .my-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #fff;
            border-bottom: 1px solid var(--ink-100);
            color: var(--ink-900);
            font-size: 15px;
            text-decoration: none;
        }
        .my-row:active { background: var(--brand-tint); }
        #toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .78);
            color: #fff;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 6px;
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>
<div class="w-full h-[100dvh] overflow-hidden flex flex-col"
     style="padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));">

    <!-- 渐变头部 -->
    <div class="my-head flex-none px-5 pt-5 pb-7 relative">
        <button
            aria-label="设置"
            class="absolute right-4 top-4 text-white"
            onclick="showToast('设置 建设中')"
        >
            <iconify-icon class="text-[26px]" icon="solar:settings-bold"></iconify-icon>
        </button>
        <div class="flex items-center gap-3">
            <img
                alt="雅柔"
                class="w-[64px] h-[64px] object-cover border-2"
                style="border-radius: 9999px; border-color: rgba(255,255,255,.7)"
                src="assets/packaged/d51ada3793fa4999ba92c028ae4313f7.png"
            />
            <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                    <span class="text-white font-bold" style="font-size: 20px">雅柔</span>
                    <img class="vip-badge" alt="VIP" src="assets/v2/vip/cat-entertainment.png"/>
                    <img class="vip-badge" alt="等级" src="assets/v2/icon/gear-badge.png"/>
                </div>
                <div class="mt-1" style="color: rgba(255,255,255,.85); font-size: 12px">id:202609060012</div>
            </div>
        </div>
        <div
            class="mt-4 flex items-center gap-2 cursor-pointer"
            style="color: rgba(255,255,255,.92); font-size: 13px"
            onclick="showToast('编辑介绍')"
        >
            <span>添加介绍，让大家都来了解一下你</span>
            <iconify-icon class="text-[15px]" icon="solar:pen-linear"></iconify-icon>
        </div>
    </div>

    <!-- 三个胶囊 -->
    <div class="flex-none px-4 -mt-4 flex gap-3">
        <a class="my-pill flex-1 flex items-center justify-center gap-1.5"
           style="height: 44px; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none"
           href="profile_center.html">
            <img class="w-5 h-5 object-contain" src="assets/v2/card/idcard.png" alt=""/>我的名片
        </a>
        <a class="my-pill flex-1 flex items-center justify-center gap-1.5"
           style="height: 44px; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none"
           href="profile_center.html">
            <img class="w-5 h-5 object-contain" src="assets/v2/card/resume.png" alt=""/>我的简历
        </a>
        <a class="my-pill flex-1 flex items-center justify-center gap-1.5"
           style="height: 44px; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none"
           href="category.html">
            <img class="w-5 h-5 object-contain" src="assets/v2/icon/cart.png" alt=""/>商城
        </a>
    </div>

    <!-- 四行列表 -->
    <div class="flex-1 overflow-y-auto mt-4 bg-white">
        <a class="my-row" href="history_favorites.html">
            <span class="flex items-center gap-3">
                <iconify-icon style="color: var(--brand-deep); font-size: 22px" icon="solar:history-bold"></iconify-icon>
                浏览记录
            </span>
            <iconify-icon style="color: #c9d6da; font-size: 20px" icon="solar:alt-arrow-right-linear"></iconify-icon>
        </a>
        <a class="my-row" href="vip_center.html">
            <span class="flex items-center gap-3">
                <img class="w-[22px] h-[22px] object-contain" src="assets/v2/vip/cat-entertainment.png" alt=""/>VIP介绍
            </span>
            <iconify-icon style="color: #c9d6da; font-size: 20px" icon="solar:alt-arrow-right-linear"></iconify-icon>
        </a>
        <a class="my-row" href="javascript:void(0)" onclick="showToast('币种介绍 建设中')">
            <span class="flex items-center gap-3">
                <img class="w-[22px] h-[22px] object-contain" src="assets/v2/coin/rmb.png" alt=""/>币种介绍
            </span>
            <iconify-icon style="color: #c9d6da; font-size: 20px" icon="solar:alt-arrow-right-linear"></iconify-icon>
        </a>
        <a class="my-row" href="javascript:void(0)" onclick="showToast('其它图标介绍 建设中')">
            <span class="flex items-center gap-3">
                <span class="flex items-center justify-center" style="width: 22px; height: 22px; border-radius: 9999px; background: #3fc46a">
                    <iconify-icon class="text-[14px] text-white" icon="solar:info-circle-bold"></iconify-icon>
                </span>
                其它图标介绍
            </span>
            <iconify-icon style="color: #c9d6da; font-size: 20px" icon="solar:alt-arrow-right-linear"></iconify-icon>
        </a>
    </div>
</div>
<div id="toast"></div>
<script>
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => (toast.style.display = 'none'), 1800);
    }
</script>
</body>
</html>
