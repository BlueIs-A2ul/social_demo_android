<!DOCTYPE html>

<html data-immersive-translate-page-theme="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>智慧空间 - SPA</title>
<script src="assets/vendor/tailwindcss.js"></script>
<link href="assets/vendor/theme.css" rel="stylesheet"/>
<style>
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body { 
            background-color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            color: #333;
        }
        ::-webkit-scrollbar { display: none; }
        
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: rgba(0,0,0,0.8);
            color: #fff;
            text-align: center;
            padding: 12px 24px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 100px;
            transform: translateX(-50%);
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 100px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 100px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
        .nav-badge {
            position: absolute;
            top: 2px;
            right: calc(50% - 34px);
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: var(--gold);
            color: #6b4a00;
            font-size: 10px;
            font-weight: 700;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 1.5px #fff;
        }
    </style>
<style data-id="immersive-translate-input-injected-css"></style>
</head>
<body class="bg-white">
<div class="w-full h-[100dvh] bg-white overflow-hidden flex flex-col relative" style="padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));">
<!-- 中间内容区 (填满剩余空间) -->
<div class="flex-1 min-h-0 relative">
<iframe class="w-full h-full border-none" id="content-frame" src="room_list.html"></iframe>
</div>
<!-- 底部导航栏 -->
<nav class="h-[64px] bg-white border-t border-[#e6f2f4] flex items-center justify-between px-2 relative z-50" id="bottom-nav">
<!-- 房间 -->
<button class="nav-item flex items-center justify-center flex-1 h-full" onclick="switchTab('room_list.html', this)">
<img class="nav-icon h-[24px] object-contain" data-normal="assets/src_01/icon/nav-icons-v2/normal_房间.png" data-active="assets/src_01/icon/nav-icons-v2/active_房间.png" src="assets/src_01/icon/nav-icons-v2/active_房间.png" alt="房间"/>
</button>
<!-- 空间 -->
<button class="nav-item flex items-center justify-center flex-1 h-full" onclick="switchTab('profile.html', this)">
<img class="nav-icon h-[24px] object-contain" data-normal="assets/src_01/icon/nav-icons-v2/normal_空间.png" data-active="assets/src_01/icon/nav-icons-v2/active_空间.png" src="assets/src_01/icon/nav-icons-v2/normal_空间.png" alt="空间"/>
</button>
<!-- 雷达 -->
<button class="nav-item flex items-center justify-center flex-1 h-full relative" onclick="switchTab('radar.html', this)">
  <img class="nav-icon h-[46px] object-contain" data-normal="assets/src_01/icon/nav-icons-v2/normal_雷达.png" data-active="assets/src_01/icon/nav-icons-v2/active_雷达.png" src="assets/src_01/icon/nav-icons-v2/normal_雷达.png" alt="雷达"/>
  <span class="nav-badge">10</span>
</button>
<!-- TV -->
<button class="nav-item flex items-center justify-center flex-1 h-full relative" onclick="switchTab('publish.html', this)">
<img class="nav-icon h-[24px] object-contain" data-normal="assets/src_01/icon/nav-icons-v2/normal_TV.png" data-active="assets/src_01/icon/nav-icons-v2/active_TV.png" src="assets/src_01/icon/nav-icons-v2/normal_TV.png" alt="TV"/>
</button>
<!-- 我的 -->
<button class="nav-item flex items-center justify-center flex-1 h-full" onclick="switchTab('profile_settings.html', this)">
<img class="nav-icon h-[24px] object-contain" data-normal="assets/src_01/icon/nav-icons-v2/normal_我的.png" data-active="assets/src_01/icon/nav-icons-v2/active_我的.png" src="assets/src_01/icon/nav-icons-v2/normal_我的.png" alt="我的"/>
</button>
</nav>
<!-- Toast -->
<div id="toast"></div>
</div>
<script>
    function switchTab(url, el) {
        document.getElementById('content-frame').src = url;
        
        document.querySelectorAll('.nav-item').forEach(item => {
            const img = item.querySelector('.nav-icon');
            if (img) img.src = img.dataset.normal;
        });
        
        const img = el.querySelector('.nav-icon');
        if (img) img.src = img.dataset.active;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.className = "show";
        setTimeout(() => {
            toast.className = toast.className.replace("show", "");
        }, 3000);
    }

    window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'setBottomNav') {
            const nav = document.getElementById('bottom-nav');
            if (nav) nav.style.display = e.data.visible ? '' : 'none';
        }
    });
</script>
</body></html>
